<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa | Butkus Coaching</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101010">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stilius.css">

<!--
  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.
  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo
  duomenų trečiai šaliai. Paprastas skriptas įvykdomas anksčiau už modulį,
  tad app.js jį jau randa.
  Atnaujinimas: curl -sL -o zona/vendor/supabase-2.116.0.umd.js \n                  https://cdn.jsdelivr.net/npm/@supabase/supabase-js@VERSIJA
-->
<script src="vendor/supabase-2.116.0.umd.js"></script>
<style>
  /* Dienos -- <details> vietoje visada matomos kortelės, kad vienu metu
     matytum tik tos dienos, kurią pasirinkai, pratimus. */
  .diena-kortele { padding: 0; overflow: hidden; }
  .diena-kortele + .diena-kortele { margin-top: var(--s-300); }
  .diena-antraste {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-200);
    padding: var(--s-400); cursor: pointer; list-style: none;
  }
  .diena-antraste::-webkit-details-marker { display: none; }
  .diena-antraste h2 { margin: 0; font-size: 1.5rem; }
  .diena-antraste .rodykle {
    flex: none; width: 20px; height: 20px; transition: rotate 180ms var(--ease-out);
    stroke: var(--ink-soft);
  }
  .diena-kortele[open] .diena-antraste .rodykle { rotate: 180deg; }
  .diena-turinys { padding: 0 var(--s-400) var(--s-400); }

  .pratimo-kortele { padding: var(--s-300) 0; border-top: 1px solid var(--hair-ink); }
  .pratimo-kortele:first-child { padding-top: 0; border-top: 0; }
  .pratimo-tikslas { display: flex; flex-wrap: wrap; gap: var(--s-100); margin-top: 4px; }
  .paskutinis { font-size: .8125rem; color: var(--ink-soft); margin-top: var(--s-100) }

  /* Istorija -- visos ankstesnės sesijos, sulankstomos, kad pratimo kortelė
     liktų trumpa, kol žmogus tikrai nori pažiūrėti progresą. */
  .istorija-mygtukas {
    font-size: .8125rem; font-weight: 600; color: var(--ink); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; margin-top: var(--s-100); display: inline-block;
  }
  .istorija-sarasas { margin-top: var(--s-150, var(--s-100)); display: flex; flex-direction: column; gap: var(--s-75); }
  .istorija-eilute { display: flex; justify-content: space-between; gap: var(--s-200); font-size: .8125rem; }
  .istorija-data { color: var(--ink-soft); flex: none; white-space: nowrap; }
  .istorija-setai { text-align: right; }
  .istorija-pastaba { color: var(--ink-soft); font-style: italic; margin-top: 2px; }

  /* Setų įvedimas -- viena stulpelių antraštė, o ne pakartotos placeholder
     reikšmės kiekvienoje eilutėje, ir be gimtųjų rodyklių ant skaičių lauko. */
  .setu-lentele { margin-top: var(--s-200); }
  .setu-antraste {
    display: grid; grid-template-columns: 28px 1fr 1fr; gap: var(--s-100);
    font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-soft); padding: 0 0 var(--s-75);
  }
  .setu-eilute { display: grid; grid-template-columns: 28px 1fr 1fr; gap: var(--s-100); align-items: center; margin-top: var(--s-75); }
  .setu-eilute span { font-size: .8125rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .setu-eilute input { min-height: 44px; }
  .setu-eilute input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
  .setu-eilute input[type="number"]::-webkit-inner-spin-button,
  .setu-eilute input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Klientų zona</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <p><a class="btn btn-ghost btn-sm" href="mano.html">&larr; Mano programa</a></p>
      <h1 id="antraste">Programa</h1>
      <p id="paantraste"></p>
    </div>
    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>
    <p class="note" id="pranesimas" hidden></p>
    <div id="turinys-vieta"></div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, Dalius Butkus</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, $$, esc, data, klaidaLT, pranesk, reikiaSesijos, rodykNav,
} from './app.js';

const programId = new URLSearchParams(location.search).get('id');

let vartotojas = null;
let dienos = [];
let pratimai = [];
let irasaiPagalPratima = new Map();

paleisk();

async function paleisk() {
  const s = await reikiaSesijos();
  if (!s) return;
  rodykNav(s.profilis, 'mano.html', s.arTreneris);
  vartotojas = s.vartotojas;

  if (!programId) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), 'Trūksta programos adreso. Grįžk į savo programų sąrašą.', 'error');
    return;
  }

  await ikelk();
}

async function ikelk() {
  const { data: programa, error: pKlaida } = await db
    .from('client_programs').select('id, title, status').eq('id', programId).maybeSingle();

  // Programos gali nematyti, jei ji ne šio kliento -- owns_client_program
  // taisyklė tokiu atveju tiesiog negrąžina eilutės, ne klaidą.
  if (pKlaida || !programa) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), pKlaida ? klaidaLT(pKlaida) : 'Šios programos nematai arba jos nebėra.', 'error');
    return;
  }

  $('#antraste').textContent = programa.title;
  document.title = programa.title + ' | Butkus Coaching';

  const { data: d, error: dKlaida } = await db
    .from('client_days').select('id, title, notes, position')
    .eq('client_program_id', programId).order('position', { ascending: true });

  if (dKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(dKlaida), 'error');
    return;
  }
  dienos = d || [];

  const dienuId = dienos.map((x) => x.id);
  const { data: p, error: prKlaida } = dienuId.length
    ? await db.from('client_exercises').select('*').in('client_day_id', dienuId).order('position', { ascending: true })
    : { data: [] };

  if (prKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(prKlaida), 'error');
    return;
  }
  pratimai = p || [];

  await ikelkIrasus();

  $('#kraunasi').hidden = true;
  piesTurini();
}

async function ikelkIrasus() {
  irasaiPagalPratima = new Map();
  const pratimuId = pratimai.map((p) => p.id);
  if (!pratimuId.length) return;

  const { data: irasai } = await db
    .from('exercise_logs')
    .select('*')
    .eq('client_id', vartotojas.id)
    .in('client_exercise_id', pratimuId)
    .order('logged_at', { ascending: false });

  for (const i of irasai || []) {
    if (!irasaiPagalPratima.has(i.client_exercise_id)) irasaiPagalPratima.set(i.client_exercise_id, []);
    irasaiPagalPratima.get(i.client_exercise_id).push(i);
  }
}

/** Visos pratimo sesijos, sugrupuotos pagal dieną, naujausia pirma. */
function grupuokPagalSesijas(pratimoId) {
  const irasai = irasaiPagalPratima.get(pratimoId);
  if (!irasai || !irasai.length) return [];

  const grupes = new Map();
  for (const i of irasai) {
    const raktas = new Date(i.logged_at).toISOString().slice(0, 10);
    if (!grupes.has(raktas)) grupes.set(raktas, []);
    grupes.get(raktas).push(i);
  }

  return Array.from(grupes.entries())
    .sort((a, b) => (a[0] < b[0] ? 1 : -1))
    .map(([raktas, setai]) => ({
      logged_at: setai[0].logged_at,
      pastaba: setai.map((s) => s.notes).find(Boolean) || '',
      setai: setai.slice().sort((a, b) => a.set_index - b.set_index),
    }));
}

function piesTurini() {
  const vieta = $('#turinys-vieta');

  if (!dienos.length) {
    vieta.innerHTML = '<div class="empty"><h2>Turinys ruošiamas</h2><p>Dalius dar pildo šią programą. Užsuk vėliau.</p></div>';
    return;
  }

  vieta.innerHTML = dienos.map((d, i) => {
    const savi = pratimai.filter((p) => p.client_day_id === d.id);
    return `
      <details class="card diena-kortele"${i === 0 ? ' open' : ''}>
        <summary class="diena-antraste">
          <div>
            <h2>${esc(d.title)}</h2>
            ${d.notes ? `<p class="muted" style="font-size:.9375rem;margin-top:4px">${esc(d.notes)}</p>` : ''}
          </div>
          <div class="row" style="align-items:center;gap:var(--s-200)">
            <span class="chip chip-quiet">${savi.length} ${savi.length === 1 ? 'pratimas' : 'pratimai'}</span>
            <svg class="rodykle" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </summary>
        <div class="diena-turinys">
          ${savi.length ? savi.map((p) => pratimoKortele(p)).join('') : '<p class="muted">Pratimų šiai dienai dar nėra.</p>'}
        </div>
      </details>`;
  }).join('');

  for (const f of $$('.forma-setai')) f.addEventListener('submit', issaugokSetus);
  for (const b of $$('.istorija-mygtukas')) b.addEventListener('click', () => rodykIstorija(b));
}

function rodykIstorija(mygtukas) {
  const sarasas = document.getElementById(mygtukas.dataset.target);
  if (!sarasas) return;
  const rodoma = !sarasas.hidden;
  sarasas.hidden = rodoma;
  mygtukas.textContent = rodoma
    ? mygtukas.textContent.replace('Slėpti', 'Peržiūrėti visą')
    : mygtukas.textContent.replace('Peržiūrėti visą', 'Slėpti');
}

function pratimoKortele(p) {
  const kiekSetu = p.target_sets && p.target_sets > 0 ? p.target_sets : 3;
  const sesijos = grupuokPagalSesijas(p.id);
  const paskutine = sesijos[0] || null;
  const ankstesnes = sesijos.slice(1);

  const tikslai = [];
  if (p.target_sets) tikslai.push(`${p.target_sets} setai`);
  if (p.target_reps) tikslai.push(`${esc(p.target_reps)} kartų`);
  if (p.target_load) tikslai.push(esc(p.target_load));
  if (p.rest_seconds) tikslai.push(`${p.rest_seconds} sek poilsis`);

  const setuEilutes = Array.from({ length: kiekSetu }, (_, i) => i + 1).map((n) => `
    <div class="setu-eilute">
      <span>${n}.</span>
      <input type="number" step="0.5" min="0" inputmode="decimal" aria-label="${n} seto svoris, kg" name="svoris-${n}">
      <input type="number" step="1" min="0" inputmode="numeric" aria-label="${n} seto kartai" name="kartai-${n}">
    </div>`).join('');

  return `
    <div class="pratimo-kortele">
      <strong>${esc(p.title)}</strong>
      ${tikslai.length ? `<div class="pratimo-tikslas">${tikslai.map((t) => `<span class="chip chip-quiet">${t}</span>`).join('')}</div>` : ''}
      ${p.notes ? `<p class="muted" style="font-size:.875rem;margin-top:4px">${esc(p.notes)}</p>` : ''}
      ${p.video_url ? `<p style="margin-top:4px"><a href="${esc(p.video_url)}" target="_blank" rel="noopener" style="font-size:.875rem;text-decoration:underline">Peržiūrėti pavyzdį</a></p>` : ''}

      ${paskutine ? `<p class="paskutinis">Paskutinį kartą (${esc(data(paskutine.logged_at))}): ${paskutine.setai.map((s) => `${s.weight_kg ?? '–'}kg × ${s.reps ?? '–'}`).join(', ')}</p>` : ''}
      ${ankstesnes.length ? istorijosBlokas(p.id, ankstesnes) : ''}

      <div class="setu-lentele">
        <div class="setu-antraste"><span></span><span>Svoris, kg</span><span>Kartai</span></div>
        <form class="forma-setai" data-pratimas="${esc(p.id)}" novalidate>
          ${setuEilutes}
          <div class="field" style="margin-top:var(--s-200)">
            <label for="pastaba-${esc(p.id)}">Pastaba <span class="hint" style="display:inline">(neprivaloma)</span></label>
            <textarea id="pastaba-${esc(p.id)}" name="pastaba" placeholder="Kaip jauteisi, ką verta prisiminti kitą kartą"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary btn-sm" type="submit">Išsaugoti šios dienos setus</button>
          </div>
          <p class="note" id="statusas-${esc(p.id)}" hidden></p>
        </form>
      </div>
    </div>`;
}

function istorijosBlokas(pratimoId, sesijos) {
  const id = 'istorija-' + pratimoId;
  const eilutes = sesijos.map((s) => `
    <div class="istorija-eilute">
      <span class="istorija-data">${esc(data(s.logged_at))}</span>
      <span class="istorija-setai">
        ${s.setai.map((set) => `${set.weight_kg ?? '–'}kg × ${set.reps ?? '–'}`).join(', ')}
        ${s.pastaba ? `<div class="istorija-pastaba">${esc(s.pastaba)}</div>` : ''}
      </span>
    </div>`).join('');

  return `
    <button type="button" class="istorija-mygtukas" data-target="${id}">Peržiūrėti visą istoriją (${sesijos.length})</button>
    <div class="istorija-sarasas" id="${id}" hidden>${eilutes}</div>`;
}

async function issaugokSetus(ev) {
  ev.preventDefault();
  const forma = ev.currentTarget;
  const pratimoId = forma.dataset.pratimas;
  const fd = new FormData(forma);
  const pastaba = String(fd.get('pastaba') || '').trim() || null;

  const irasai = [];
  let n = 1;
  while (fd.has(`svoris-${n}`) || fd.has(`kartai-${n}`)) {
    const svoris = fd.get(`svoris-${n}`);
    const kartai = fd.get(`kartai-${n}`);
    if (svoris || kartai) {
      irasai.push({
        client_exercise_id: pratimoId,
        client_id: vartotojas.id,
        set_index: n,
        weight_kg: svoris ? Number(svoris) : null,
        reps: kartai ? Number(kartai) : null,
        notes: pastaba,
      });
    }
    n += 1;
  }

  const busena = $('#statusas-' + pratimoId);
  if (!irasai.length) {
    pranesk(busena, 'Įrašyk bent vieno seto svorį arba kartus.', 'error');
    return;
  }

  const { error } = await db.from('exercise_logs').insert(irasai);
  if (error) {
    pranesk(busena, klaidaLT(error), 'error');
    return;
  }

  pranesk(busena, 'Išsaugota.', 'ok');
  await ikelkIrasus();
  piesTurini();
}
</script>
</body>
</html>
