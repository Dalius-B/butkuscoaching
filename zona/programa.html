<!--
  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.
  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo
  duomenų trečiai šaliai. Paprastas skriptas įvykdomas anksčiau už modulį,
  tad app.js jį jau randa.
  Atnaujinimas: curl -sL -o zona/vendor/supabase-2.116.0.umd.js \n                  https://cdn.jsdelivr.net/npm/@supabase/supabase-js@VERSIJA
-->
<script src="vendor/supabase-2.116.0.umd.js"></script>
<style>
  /* Atgal/Istorija mygtukų eilutė ir antraštė po ja lipo viena prie kitos --
     mygtukai turi savo aukštį, bet jokio tarpo žemiau. */
  .programos-nuorodos { margin-bottom: var(--s-300); }

  /* Dienos -- <details> vietoje visada matomos kortelės, kad vienu metu
     matytum tik tos dienos, kurią pasirinkai, pratimus. */
  .diena-kortele { padding: 0; overflow: hidden; }
  .diena-kortele + .diena-kortele { margin-top: var(--s-300); }
  .diena-antraste {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-200);
    padding: var(--s-400); cursor: pointer; list-style: none;
  }
  .diena-antraste::-webkit-details-marker { display: none; }
  .diena-antraste h2 { margin: 0; font-size: 1.5rem; }
  .diena-antraste .rodykle {
    flex: none; width: 20px; height: 20px; transition: rotate 180ms var(--ease-out);
    stroke: var(--ink-soft);
  }
  .diena-kortele[open] .diena-antraste .rodykle { rotate: 180deg; }
  .diena-turinys { padding: 0 var(--s-400) var(--s-400); }

  /* Kelios pratimo kortelės vienoje eilutėje platesniame ekrane -- panaudoja
     laisvą vietą šalia kompaktiškos setų lentelės, o ne palieka ją tuščią.
     min(280px, 100%) apsaugo, kad kortelė nepersirikiuotų už siauro
     telefono ekrano ribų. */
  .pratimo-tinklelis {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
    gap: var(--s-300);
  }
  .pratimo-kortele { padding: var(--s-300); border: 1px solid var(--hair-ink); border-radius: var(--r-md); }
  /* flex-wrap -- kai pavadinimas ilgas, Video mygtukas nuslenka į savo
     eilutę žemiau, o ne spaudžia pavadinimą į vieno žodžio pločio stulpelį. */
  .pratimo-virsus { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--s-100) var(--s-200); }
  .pratimo-virsus > .pratimo-info { flex: 1 1 200px; min-width: 0; }
  .pratimo-pavadinimas { font-size: 1.1875rem; }

  /* Supersetai -- kortelėje rodomas rėmelis ir A1/A2 ženklelis, kad
     klientas žinotų, jog šis pratimas atliekamas kartu su kitu, be poilsio
     tarp jų (rėmelio kryptis kortelių tinklelyje gali nesutapti, tad
     pasikliaujama žodine užuomina, o ne vien vizualiu ryšiu). */
  .pratimo-kortele.supersete { box-shadow: inset 0 0 0 2px var(--volt); }
  .superseto-zenklas {
    display: inline-block; font-size: .6875rem; font-weight: 700; letter-spacing: .04em;
    color: var(--ink); background: var(--volt); border-radius: var(--r-sm); padding: 1px 6px; margin-left: 4px;
    vertical-align: middle;
  }
  .superseto-uzuomina { font-size: .8125rem; color: var(--ink-soft); margin-top: var(--s-75); }
  .video-mygtukas { flex: none; white-space: nowrap; }

  /* Tikslo eilutė (setai/kartai/svoris/poilsis) -- viena kompaktiška teksto
     eilutė su pagrindiniu skaičiumi paryškintu, o ne krūva atskirų "piliulės"
     formos ženkliukų, kurie iš arti atrodo netvarkingai. */
  /* flex + wrap, o ne tekstas su tarpais -- kad kiekviena dalis (pvz. "60s
     poilsis") vyniotųsi kaip vientisas blokas kartu su savo taškeliu, o ne
     paliktų taškelį vieną kabantį eilutės pradžioje siaurame ekrane. */
  .pratimo-tikslas { margin-top: var(--s-75); font-size: .875rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; row-gap: 4px; }
  .pratimo-tikslas strong { color: var(--ink); font-weight: 700; }
  .pratimo-tikslas .dalis:not(:first-child)::before { content: '\00b7'; margin: 0 var(--s-75); color: rgba(16,16,16,0.28); }
  .paskutine-sesija { font-size: .8125rem; color: var(--ink-soft); margin-top: var(--s-200); }
  .paskutine-sesija strong { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Setų įvedimas -- kompaktiški, fiksuoto pločio laukai, nes čia visada
     įvedami trumpi skaičiai, o ne laisvas tekstas. Viena stulpelių antraštė,
     o ne pakartotos placeholder reikšmės kiekvienoje eilutėje, ir be gimtųjų
     rodyklių ant skaičių lauko. */
  .setu-lentele { margin-top: var(--s-200); max-width: 280px; }
  .setu-antraste {
    display: grid; grid-template-columns: 22px 84px 84px; gap: var(--s-100);
    font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-soft); padding: 0 0 var(--s-75);
  }
  .setu-eilute { display: grid; grid-template-columns: 22px 84px 84px; gap: var(--s-100); align-items: center; margin-top: var(--s-75); }
  .setu-eilute span { font-size: .8125rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .setu-eilute input {
    min-height: 36px; width: 100%; text-align: center;
    font-family: var(--display); font-size: .9375rem; color: var(--ink);
    background: var(--white); border: 1px solid rgba(16,16,16,0.20); border-radius: var(--r-sm);
    padding: 0 var(--s-75); transition: border-color 150ms var(--ease-out);
  }
  .setu-eilute input:hover { border-color: rgba(16,16,16,.42); }
  .setu-eilute input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
  .setu-eilute input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
  .setu-eilute input[type="number"]::-webkit-inner-spin-button,
  .setu-eilute input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* Pratimams be svorio (tik kartai arba tik laikas) -- vienas stulpelis
     vietoj dviejų, kad netuščiuotų antro, nereikalingo stulpelio. */
  .setu-antraste.viena-reiksme, .setu-eilute.viena-reiksme { grid-template-columns: 22px 84px; }

  /* Vienas "Išsaugoti treniruotę" mygtukas visai dienai, o ne po vieną
     kiekvienam pratimui -- mažiau palietimų per treniruotę. */
  .diena-issaugojimas { margin-top: var(--s-400); padding-top: var(--s-300); border-top: 1px solid var(--hair-ink); }
  .diena-issaugojimas .btn { min-width: 220px; }

  @media (max-width: 620px) {
    .diena-antraste { padding: var(--s-300); flex-wrap: wrap; }
    .diena-turinys { padding: 0 var(--s-300) var(--s-300); }
    .pratimo-tinklelis { gap: var(--s-200); }
  }

  /* Labai siauruose telefonuose "Mano programa" + "Istorija" mygtukai
     nebetilpdavo vienoje eilutėje ir "Istorija" nukrisdavo į kitą eilutę
     be jokio dešiniojo lygiavimo -- sumažiname tarpus, kad liktų vienoje. */
  @media (max-width: 400px) {
    .programos-nuorodos { gap: var(--s-75); }
    .programos-nuorodos .btn { padding-inline: var(--s-75); font-size: 0.75rem; }
  }
</style>

<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Klientų zona</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <div class="row programos-nuorodos" style="justify-content:space-between;align-items:center">
        <a class="btn btn-ghost btn-sm" href="mano.html">&larr; Mano programa</a>
        <a class="btn btn-ghost btn-sm" id="istorijos-nuoroda" href="#">Istorija</a>
      </div>
      <h1 id="antraste">Programa</h1>
      <p id="paantraste"></p>
    </div>
    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>
    <p class="note" id="pranesimas" hidden></p>
    <div id="turinys-vieta"></div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, Dalius Butkus</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, $$, esc, data, klaidaLT, pranesk, valyk, reikiaSesijos, rodykNav, programosSavaite,
  apskaiciuokSupersetuZenklus, formatuokTrukme,
} from './app.js?v=20261011';

const programId = new URLSearchParams(location.search).get('id');

let vartotojas = null;
let dienos = [];
let pratimai = [];
let paskutineSesija = new Map();

paleisk();

async function paleisk() {
  const s = await reikiaSesijos();
  if (!s) return;
  rodykNav(s.profilis, 'mano.html', s.arTreneris);
  vartotojas = s.vartotojas;

  if (!programId) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), 'Trūksta programos adreso. Grįžk į savo programų sąrašą.', 'error');
    return;
  }

  await ikelk();
}

async function ikelk() {
  const { data: programa, error: pKlaida } = await db
    .from('client_programs').select('id, title, status, starts_on, assigned_at').eq('id', programId).maybeSingle();

  // Programos gali nematyti, jei ji ne šio kliento -- owns_client_program
  // taisyklė tokiu atveju tiesiog negrąžina eilutės, ne klaidą.
  if (pKlaida || !programa) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), pKlaida ? klaidaLT(pKlaida) : 'Šios programos nematai arba jos nebėra.', 'error');
    return;
  }

  $('#antraste').textContent = programa.title;
  document.title = programa.title + ' | Butkus Coaching';
  $('#istorijos-nuoroda').href = 'istorija.html?id=' + encodeURIComponent(programId);

  if (programa.status === 'active') {
    const savaite = programosSavaite(programa);
    if (savaite) $('#paantraste').textContent = savaite + ' savaitė programoje';
  }

  const { data: d, error: dKlaida } = await db
    .from('client_days').select('id, title, notes, position')
    .eq('client_program_id', programId).order('position', { ascending: true });

  if (dKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(dKlaida), 'error');
    return;
  }
  dienos = d || [];

  const dienuId = dienos.map((x) => x.id);
  const { data: p, error: prKlaida } = dienuId.length
    ? await db.from('client_exercises').select('*').in('client_day_id', dienuId).order('position', { ascending: true })
    : { data: [] };

  if (prKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(prKlaida), 'error');
    return;
  }
  pratimai = p || [];

  // Reikia žinoti kiekvieno pratimo paskutinę sesiją, kad: 1) pradinio
  // svorio pasiūlymą rodytume tik kol dar nėra jokio įrašo, ir 2) vėliau
  // klientas matytų, kokį sunkiausią svorį naudojo praėjusį kartą.
  const pratimuId = pratimai.map((x) => x.id);
  const { data: irasai } = pratimuId.length
    ? await db.from('exercise_logs').select('client_exercise_id, weight_kg, reps, duration_seconds, logged_at')
        .eq('client_id', vartotojas.id).in('client_exercise_id', pratimuId).order('logged_at', { ascending: false })
    : { data: [] };
  paskutineSesija = apskaiciuokPaskutinesSesijas(irasai || []);

  $('#kraunasi').hidden = true;
  piesTurini();
}

/** pratimoId -> paskutinės sesijos {data, weight_kg, reps, duration_seconds}
 * (geriausias tos dienos setas -- sunkiausias svoris, arba kai jo nėra,
 * ilgiausia trukmė, arba daugiausia kartų). Kadangi irasai jau surikiuoti
 * nuo naujausios datos, pirmas kiekvieno pratimo pasirodymas visada
 * priklauso jo naujausiai sesijai. */
function apskaiciuokPaskutinesSesijas(irasai) {
  const grupes = new Map();
  for (const i of irasai) {
    const raktas = new Date(i.logged_at).toISOString().slice(0, 10);
    const esama = grupes.get(i.client_exercise_id);
    if (!esama) grupes.set(i.client_exercise_id, { data: raktas, irasai: [i] });
    else if (raktas === esama.data) esama.irasai.push(i);
  }

  const rezultatas = new Map();
  for (const [pratimoId, grupe] of grupes) {
    const suSvoriu = grupe.irasai.filter((i) => i.weight_kg != null);
    const suTrukme = grupe.irasai.filter((i) => i.duration_seconds != null);
    const suKartais = grupe.irasai.filter((i) => i.reps != null);
    const sunkiausias = suSvoriu.length ? suSvoriu.reduce((a, b) => (b.weight_kg > a.weight_kg ? b : a)) : null;
    const ilgiausias  = suTrukme.length ? suTrukme.reduce((a, b) => (b.duration_seconds > a.duration_seconds ? b : a)) : null;
    const daugiausiai = suKartais.length ? suKartais.reduce((a, b) => (b.reps > a.reps ? b : a)) : null;
    rezultatas.set(pratimoId, {
      data: grupe.data,
      weight_kg: sunkiausias ? sunkiausias.weight_kg : null,
      reps: sunkiausias ? sunkiausias.reps : (daugiausiai ? daugiausiai.reps : null),
      duration_seconds: ilgiausias ? ilgiausias.duration_seconds : null,
    });
  }
  return rezultatas;
}

function piesTurini() {
  const vieta = $('#turinys-vieta');

  if (!dienos.length) {
    vieta.innerHTML = '<div class="empty"><h2>Turinys ruošiamas</h2><p>Dalius dar pildo šią programą. Užsuk vėliau.</p></div>';
    return;
  }

  vieta.innerHTML = dienos.map((d) => {
    const savi = pratimai.filter((p) => p.client_day_id === d.id);
    const supersetuZenklai = apskaiciuokSupersetuZenklus(savi);
    return `
      <details class="card diena-kortele">
        <summary class="diena-antraste">
          <div>
            <h2>${esc(d.title)}</h2>
            ${d.notes ? `<p class="muted" style="font-size:.9375rem;margin-top:4px">${esc(d.notes)}</p>` : ''}
          </div>
          <div class="row" style="align-items:center;gap:var(--s-200)">
            <span class="chip chip-quiet">${savi.length} ${savi.length === 1 ? 'pratimas' : 'pratimai'}</span>
            <svg class="rodykle" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </summary>
        <div class="diena-turinys">
          ${savi.length ? `
            <div class="pratimo-tinklelis" data-diena="${esc(d.id)}">${savi.map((p) => pratimoKortele(p, supersetuZenklai.get(p.id))).join('')}</div>
            <div class="diena-issaugojimas">
              <div class="form-actions">
                <button class="btn btn-primary" type="button" data-issaugoti-diena="${esc(d.id)}">Išsaugoti treniruotę</button>
              </div>
              <p class="note" id="diena-statusas-${esc(d.id)}" hidden></p>
            </div>
          ` : '<p class="muted">Pratimų šiai dienai dar nėra.</p>'}
        </div>
      </details>`;
  }).join('');

  for (const kont of $$('.pratimo-setai')) {
    kont.addEventListener('input', () => issaugokDrafta(kont));
  }
  for (const b of $$('[data-issaugoti-diena]')) {
    b.addEventListener('click', () => issaugokDiena(b.dataset.issaugotiDiena));
  }
}

// =============================================================================
//  NEIŠSAUGOTO ĮVEDIMO JUODRAŠTIS -- kad neprisijungęs interneto ryšys ar
//  atsitiktinis puslapio atnaujinimas prieš paspaudžiant "Išsaugoti" nenutrintų
//  klientui ką tik įvestų skaičių. Saugoma tik iki paspaudimo -- po sėkmingo
//  išsaugojimo duomenų bazėje juodraštis ištrinamas.
// =============================================================================
function draftoRaktas(pratimoId) {
  return 'zona-draftas:' + pratimoId;
}

function issaugokDrafta(konteineris) {
  const pratimoId = konteineris.dataset.pratimas;
  const objektas = {};
  for (const laukas of konteineris.querySelectorAll('input, textarea')) {
    if (laukas.name && laukas.value) objektas[laukas.name] = laukas.value;
  }
  try {
    if (Object.keys(objektas).length) localStorage.setItem(draftoRaktas(pratimoId), JSON.stringify(objektas));
    else localStorage.removeItem(draftoRaktas(pratimoId));
  } catch {
    // Privatus naršymo režimas ar užblokuota saugykla -- juodraštis tiesiog neišliks.
  }
}

function atstatytasDraftas(pratimoId) {
  try {
    const rew = localStorage.getItem(draftoRaktas(pratimoId));
    return rew ? JSON.parse(rew) : {};
  } catch {
    return {};
  }
}

function istrinkDrafta(pratimoId) {
  try {
    localStorage.removeItem(draftoRaktas(pratimoId));
  } catch {
    // nesvarbu -- jei saugykla neveikia, ir įrašyti niekas negalėjo
  }
}

/** Kompaktiška "4 × 5 · 80kg · 90s poilsis" eilutė vietoj kelių atskirų ženkliukų. */
function tiksloEilute(p) {
  const dalys = [];
  if (p.target_sets && p.target_reps) dalys.push(`<strong>${p.target_sets} × ${esc(p.target_reps)}</strong>`);
  else if (p.target_sets) dalys.push(`<strong>${p.target_sets} setai</strong>`);
  else if (p.target_reps) dalys.push(`<strong>${esc(p.target_reps)} kartų</strong>`);
  if (p.target_load) dalys.push(esc(p.target_load));
  if (p.rest_seconds) dalys.push(`${p.rest_seconds}s poilsis`);
  return dalys.map((d) => `<span class="dalis">${d}</span>`).join('');
}

/** Rodoma, kai pratimas jau turi bent vieną įrašą. Svorio tipo pratimams
 * pasiūlymas rodomas kaip įvesties lauko placeholder (žr. pratimoKortele),
 * ne atskira eilute -- čia liekame tik tiems tipams, kur svorio nėra. */
function paskutinesSesijosEilute(p) {
  const s = paskutineSesija.get(p.id);
  if (!s) return '';
  const tipas = p.log_type || 'svoris';

  if (tipas === 'kartai') {
    if (s.reps == null) return '';
    return `<p class="paskutine-sesija">Praėjusią treniruotę: <strong>${s.reps} kartai</strong> (${esc(data(s.data))})</p>`;
  }
  if (tipas === 'laikas') {
    if (s.duration_seconds == null) return '';
    return `<p class="paskutine-sesija">Praėjusią treniruotę: <strong>${esc(formatuokTrukme(s.duration_seconds))}</strong> (${esc(data(s.data))})</p>`;
  }
  return '';
}

function pratimoKortele(p, supersetoZenklas) {
  const kiekSetu = p.target_sets && p.target_sets > 0 ? p.target_sets : 3;
  const tikslas = tiksloEilute(p);
  const draftas = atstatytasDraftas(p.id);
  const s = paskutineSesija.get(p.id);
  const tipas = p.log_type || 'svoris';
  const numeriai = Array.from({ length: kiekSetu }, (_, i) => i + 1);

  let setuAntraste, setuEilutes;
  const vienaReiksme = tipas !== 'svoris';

  if (tipas === 'kartai') {
    setuAntraste = '<span></span><span>Kartai</span>';
    setuEilutes = numeriai.map((n) => `
      <div class="setu-eilute viena-reiksme">
        <span>${n}.</span>
        <input type="number" step="1" min="0" inputmode="numeric" aria-label="${n} seto kartai" name="kartai-${n}"${s?.reps != null ? ` placeholder="${s.reps}"` : ''}${draftas[`kartai-${n}`] ? ` value="${esc(draftas[`kartai-${n}`])}"` : ''}>
      </div>`).join('');
  } else if (tipas === 'laikas') {
    setuAntraste = '<span></span><span>Trukmė, sek</span>';
    setuEilutes = numeriai.map((n) => `
      <div class="setu-eilute viena-reiksme">
        <span>${n}.</span>
        <input type="number" step="1" min="0" inputmode="numeric" aria-label="${n} seto trukmė, sek" name="trukme-${n}"${s?.duration_seconds != null ? ` placeholder="${s.duration_seconds}"` : ''}${draftas[`trukme-${n}`] ? ` value="${esc(draftas[`trukme-${n}`])}"` : ''}>
      </div>`).join('');
  } else {
    setuAntraste = '<span></span><span>Svoris, kg</span><span>Kartai</span>';
    setuEilutes = numeriai.map((n) => `
      <div class="setu-eilute">
        <span>${n}.</span>
        <input type="number" step="0.5" min="0" inputmode="decimal" aria-label="${n} seto svoris, kg" name="svoris-${n}"${s?.weight_kg != null ? ` placeholder="${s.weight_kg}"` : ''}${draftas[`svoris-${n}`] ? ` value="${esc(draftas[`svoris-${n}`])}"` : ''}>
        <input type="number" step="1" min="0" inputmode="numeric" aria-label="${n} seto kartai" name="kartai-${n}"${s?.reps != null ? ` placeholder="${s.reps}"` : ''}${draftas[`kartai-${n}`] ? ` value="${esc(draftas[`kartai-${n}`])}"` : ''}>
      </div>`).join('');
  }

  return `
    <div class="pratimo-kortele${supersetoZenklas ? ' supersete' : ''}">
      <div class="pratimo-virsus">
        <div class="pratimo-info">
          <strong class="pratimo-pavadinimas">${esc(p.title)}</strong>${supersetoZenklas ? ` <span class="superseto-zenklas">${supersetoZenklas}</span>` : ''}
          ${tikslas ? `<p class="pratimo-tikslas">${tikslas}</p>` : ''}
          ${supersetoZenklas ? '<p class="superseto-uzuomina">Supersetas -- atlik iš karto po poros pratimo, be poilsio tarp jų.</p>' : ''}
        </div>
        ${p.video_url ? `<a class="btn btn-ghost btn-sm video-mygtukas" href="${esc(p.video_url)}" target="_blank" rel="noopener">&#9654; Video</a>` : ''}
      </div>
      ${p.notes ? `<p class="muted" style="font-size:.875rem;margin-top:var(--s-200)">${esc(p.notes)}</p>` : ''}
      <div id="paskutine-${esc(p.id)}">${paskutinesSesijosEilute(p)}</div>

      <div class="setu-lentele pratimo-setai" data-pratimas="${esc(p.id)}" data-tipas="${esc(tipas)}">
        <div class="setu-antraste${vienaReiksme ? ' viena-reiksme' : ''}">${setuAntraste}</div>
        ${setuEilutes}
        <div class="field" style="margin-top:var(--s-200)">
          <label for="pastaba-${esc(p.id)}">Pastaba <span class="hint" style="display:inline">(neprivaloma)</span></label>
          <textarea id="pastaba-${esc(p.id)}" name="pastaba" placeholder="Kaip jauteisi, ką verta prisiminti kitą kartą">${draftas.pastaba ? esc(draftas.pastaba) : ''}</textarea>
        </div>
      </div>
    </div>`;
}

/** Vienas mygtukas visai dienai -- surenka kiekvieno pratimo įvestus setus
 * iš jo .pratimo-setai konteinerio ir išsaugo juos vienu kartu, kad
 * klientui nereikėtų spausti "Išsaugoti" po kiekvieno pratimo atskirai, ir
 * kad vienas tinklo nesklandumas neliktų nepastebėtas prie kortelės, kurią
 * jau paliko. */
async function issaugokDiena(dienaId) {
  const konteineriai = $$(`.pratimo-tinklelis[data-diena="${esc(dienaId)}"] .pratimo-setai`);
  const busena = $('#diena-statusas-' + dienaId);
  const mygtukas = $(`[data-issaugoti-diena="${dienaId}"]`);

  const irasai = [];
  const perPratima = new Map();

  for (const kont of konteineriai) {
    const pratimoId = kont.dataset.pratimas;
    const pastabaEl = kont.querySelector('textarea[name="pastaba"]');
    const pastaba = pastabaEl ? (pastabaEl.value.trim() || null) : null;

    const savieIrasai = [];
    let n = 1;
    while (true) {
      const svorisEl = kont.querySelector(`input[name="svoris-${n}"]`);
      const kartaiEl = kont.querySelector(`input[name="kartai-${n}"]`);
      const trukmeEl = kont.querySelector(`input[name="trukme-${n}"]`);
      if (!svorisEl && !kartaiEl && !trukmeEl) break;

      const svoris = svorisEl?.value;
      const kartai = kartaiEl?.value;
      const trukme = trukmeEl?.value;
      if (svoris || kartai || trukme) {
        savieIrasai.push({
          client_exercise_id: pratimoId,
          client_id: vartotojas.id,
          set_index: n,
          weight_kg: svoris ? Number(svoris) : null,
          reps: kartai ? Number(kartai) : null,
          duration_seconds: trukme ? Number(trukme) : null,
          notes: pastaba,
        });
      }
      n += 1;
    }

    if (savieIrasai.length) {
      perPratima.set(pratimoId, { irasai: savieIrasai, konteineris: kont });
      irasai.push(...savieIrasai);
    }
  }

  if (!irasai.length) {
    pranesk(busena, 'Įrašyk bent vieno pratimo rezultatą.', 'error');
    return;
  }

  if (mygtukas) mygtukas.disabled = true;
  const { error } = await db.from('exercise_logs').insert(irasai);
  if (mygtukas) mygtukas.disabled = false;

  if (error) {
    console.error('Nepavyko išsaugoti exercise_logs:', error);
    pranesk(busena, klaidaLT(error), 'error');
    return;
  }

  pranesk(busena, 'Treniruotė išsaugota ✓', 'ok');
  clearTimeout(issaugokDiena._laikmaciai?.[dienaId]);
  issaugokDiena._laikmaciai ??= {};
  issaugokDiena._laikmaciai[dienaId] = setTimeout(() => valyk(busena), 4000);

  for (const [pratimoId, { irasai: savieIrasai, konteineris }] of perPratima) {
    istrinkDrafta(pratimoId);
    for (const laukas of konteineris.querySelectorAll('input, textarea')) laukas.value = '';

    const pratimas = pratimai.find((x) => x.id === pratimoId);
    const tipas = pratimas?.log_type || 'svoris';

    let gerinusias = null;
    if (tipas === 'kartai') {
      const suKartais = savieIrasai.filter((i) => i.reps != null);
      gerinusias = suKartais.length ? suKartais.reduce((a, b) => (b.reps > a.reps ? b : a)) : null;
    } else if (tipas === 'laikas') {
      const suTrukme = savieIrasai.filter((i) => i.duration_seconds != null);
      gerinusias = suTrukme.length ? suTrukme.reduce((a, b) => (b.duration_seconds > a.duration_seconds ? b : a)) : null;
    } else {
      const suSvoriu = savieIrasai.filter((i) => i.weight_kg != null);
      gerinusias = suSvoriu.length ? suSvoriu.reduce((a, b) => (b.weight_kg > a.weight_kg ? b : a)) : null;
    }

    if (gerinusias) {
      paskutineSesija.set(pratimoId, {
        data: new Date().toISOString().slice(0, 10),
        weight_kg: gerinusias.weight_kg,
        reps: gerinusias.reps,
        duration_seconds: gerinusias.duration_seconds,
      });
    } else if (!paskutineSesija.has(pratimoId)) {
      paskutineSesija.set(pratimoId, { data: new Date().toISOString().slice(0, 10), weight_kg: null, reps: null, duration_seconds: null });
    }

    // Atnaujiname tik šio pratimo užuominą, o ne visą dienos turinį -- kitaip
    // ką tik parodytas "Treniruotė išsaugota" pranešimas ir išvalyti laukai
    // iškart dingtų perpiešiant visą kortelę.
    const paskutineEl = $('#paskutine-' + pratimoId);
    if (paskutineEl && pratimas) paskutineEl.innerHTML = paskutinesSesijosEilute(pratimas);
  }
}
</script>
