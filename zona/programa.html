<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa | Butkus Coaching</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101010">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stilius.css">

<!--
  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.
  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo
  duomenų trečiai šaliai. Paprastas skriptas įvykdomas anksčiau už modulį,
  tad app.js jį jau randa.
  Atnaujinimas: curl -sL -o zona/vendor/supabase-2.116.0.umd.js \n                  https://cdn.jsdelivr.net/npm/@supabase/supabase-js@VERSIJA
-->
<script src="vendor/supabase-2.116.0.umd.js"></script>
<style>
  /* Dienos -- <details> vietoje visada matomos kortelės, kad vienu metu
     matytum tik tos dienos, kurią pasirinkai, pratimus. */
  .diena-kortele { padding: 0; overflow: hidden; }
  .diena-kortele + .diena-kortele { margin-top: var(--s-300); }
  .diena-antraste {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-200);
    padding: var(--s-400); cursor: pointer; list-style: none;
  }
  .diena-antraste::-webkit-details-marker { display: none; }
  .diena-antraste h2 { margin: 0; font-size: 1.5rem; }
  .diena-antraste .rodykle {
    flex: none; width: 20px; height: 20px; transition: rotate 180ms var(--ease-out);
    stroke: var(--ink-soft);
  }
  .diena-kortele[open] .diena-antraste .rodykle { rotate: 180deg; }
  .diena-turinys { padding: 0 var(--s-400) var(--s-400); }

  /* Kelios pratimo kortelės vienoje eilutėje platesniame ekrane -- panaudoja
     laisvą vietą šalia kompaktiškos setų lentelės, o ne palieka ją tuščią.
     min(280px, 100%) apsaugo, kad kortelė nepersirikiuotų už siauro
     telefono ekrano ribų. */
  .pratimo-tinklelis {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
    gap: var(--s-300);
  }
  .pratimo-kortele { padding: var(--s-300); border: 1px solid var(--hair-ink); border-radius: var(--r-md); }
  .pratimo-virsus { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-200); }
  .video-mygtukas { flex: none; white-space: nowrap; }

  /* Tikslo eilutė (setai/kartai/svoris/poilsis) -- viena kompaktiška teksto
     eilutė su pagrindiniu skaičiumi paryškintu, o ne krūva atskirų "piliulės"
     formos ženkliukų, kurie iš arti atrodo netvarkingai. */
  .pratimo-tikslas { margin-top: 2px; font-size: .875rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .pratimo-tikslas strong { color: var(--ink); font-weight: 700; }
  .pratimo-tikslas .taskas { margin: 0 var(--s-75); color: rgba(16,16,16,0.28); }

  /* Setų įvedimas -- kompaktiški, fiksuoto pločio laukai, nes čia visada
     įvedami trumpi skaičiai, o ne laisvas tekstas. Viena stulpelių antraštė,
     o ne pakartotos placeholder reikšmės kiekvienoje eilutėje, ir be gimtųjų
     rodyklių ant skaičių lauko. */
  .setu-lentele { margin-top: var(--s-200); max-width: 280px; }
  .setu-antraste {
    display: grid; grid-template-columns: 22px 84px 84px; gap: var(--s-100);
    font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-soft); padding: 0 0 var(--s-75);
  }
  .setu-eilute { display: grid; grid-template-columns: 22px 84px 84px; gap: var(--s-100); align-items: center; margin-top: var(--s-75); }
  .setu-eilute span { font-size: .8125rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .setu-eilute input {
    min-height: 36px; width: 100%; text-align: center;
    font-family: var(--display); font-size: .9375rem; color: var(--ink);
    background: var(--white); border: 1px solid rgba(16,16,16,0.20); border-radius: var(--r-sm);
    padding: 0 var(--s-75); transition: border-color 150ms var(--ease-out);
  }
  .setu-eilute input:hover { border-color: rgba(16,16,16,.42); }
  .setu-eilute input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
  .setu-eilute input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
  .setu-eilute input[type="number"]::-webkit-inner-spin-button,
  .setu-eilute input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  @media (max-width: 620px) {
    .diena-antraste { padding: var(--s-300); flex-wrap: wrap; }
    .diena-turinys { padding: 0 var(--s-300) var(--s-300); }
    .pratimo-tinklelis { gap: var(--s-200); }
  }
</style>
</head>
<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Klientų zona</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <div class="row" style="justify-content:space-between;align-items:center">
        <a class="btn btn-ghost btn-sm" href="mano.html">&larr; Mano programa</a>
        <a class="btn btn-ghost btn-sm" id="istorijos-nuoroda" href="#">Istorija</a>
      </div>
      <h1 id="antraste">Programa</h1>
      <p id="paantraste"></p>
    </div>
    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>
    <p class="note" id="pranesimas" hidden></p>
    <div id="turinys-vieta"></div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, Dalius Butkus</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, $$, esc, klaidaLT, pranesk, reikiaSesijos, rodykNav,
} from './app.js';

const programId = new URLSearchParams(location.search).get('id');

let vartotojas = null;
let dienos = [];
let pratimai = [];

paleisk();

async function paleisk() {
  const s = await reikiaSesijos();
  if (!s) return;
  rodykNav(s.profilis, 'mano.html', s.arTreneris);
  vartotojas = s.vartotojas;

  if (!programId) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), 'Trūksta programos adreso. Grįžk į savo programų sąrašą.', 'error');
    return;
  }

  await ikelk();
}

async function ikelk() {
  const { data: programa, error: pKlaida } = await db
    .from('client_programs').select('id, title, status').eq('id', programId).maybeSingle();

  // Programos gali nematyti, jei ji ne šio kliento -- owns_client_program
  // taisyklė tokiu atveju tiesiog negrąžina eilutės, ne klaidą.
  if (pKlaida || !programa) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), pKlaida ? klaidaLT(pKlaida) : 'Šios programos nematai arba jos nebėra.', 'error');
    return;
  }

  $('#antraste').textContent = programa.title;
  document.title = programa.title + ' | Butkus Coaching';
  $('#istorijos-nuoroda').href = 'istorija.html?id=' + encodeURIComponent(programId);

  const { data: d, error: dKlaida } = await db
    .from('client_days').select('id, title, notes, position')
    .eq('client_program_id', programId).order('position', { ascending: true });

  if (dKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(dKlaida), 'error');
    return;
  }
  dienos = d || [];

  const dienuId = dienos.map((x) => x.id);
  const { data: p, error: prKlaida } = dienuId.length
    ? await db.from('client_exercises').select('*').in('client_day_id', dienuId).order('position', { ascending: true })
    : { data: [] };

  if (prKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(prKlaida), 'error');
    return;
  }
  pratimai = p || [];

  $('#kraunasi').hidden = true;
  piesTurini();
}

function piesTurini() {
  const vieta = $('#turinys-vieta');

  if (!dienos.length) {
    vieta.innerHTML = '<div class="empty"><h2>Turinys ruošiamas</h2><p>Dalius dar pildo šią programą. Užsuk vėliau.</p></div>';
    return;
  }

  vieta.innerHTML = dienos.map((d, i) => {
    const savi = pratimai.filter((p) => p.client_day_id === d.id);
    return `
      <details class="card diena-kortele"${i === 0 ? ' open' : ''}>
        <summary class="diena-antraste">
          <div>
            <h2>${esc(d.title)}</h2>
            ${d.notes ? `<p class="muted" style="font-size:.9375rem;margin-top:4px">${esc(d.notes)}</p>` : ''}
          </div>
          <div class="row" style="align-items:center;gap:var(--s-200)">
            <span class="chip chip-quiet">${savi.length} ${savi.length === 1 ? 'pratimas' : 'pratimai'}</span>
            <svg class="rodykle" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </summary>
        <div class="diena-turinys">
          ${savi.length ? `<div class="pratimo-tinklelis">${savi.map((p) => pratimoKortele(p)).join('')}</div>` : '<p class="muted">Pratimų šiai dienai dar nėra.</p>'}
        </div>
      </details>`;
  }).join('');

  for (const f of $$('.forma-setai')) f.addEventListener('submit', issaugokSetus);
}

/** Kompaktiška "4 × 5 · 80kg · 90s poilsis" eilutė vietoj kelių atskirų ženkliukų. */
function tiksloEilute(p) {
  const dalys = [];
  if (p.target_sets && p.target_reps) dalys.push(`<strong>${p.target_sets} × ${esc(p.target_reps)}</strong>`);
  else if (p.target_sets) dalys.push(`<strong>${p.target_sets} setai</strong>`);
  else if (p.target_reps) dalys.push(`<strong>${esc(p.target_reps)} kartų</strong>`);
  if (p.target_load) dalys.push(esc(p.target_load));
  if (p.rest_seconds) dalys.push(`${p.rest_seconds}s poilsis`);
  return dalys.join(' <span class="taskas">&middot;</span> ');
}

function pratimoKortele(p) {
  const kiekSetu = p.target_sets && p.target_sets > 0 ? p.target_sets : 3;
  const tikslas = tiksloEilute(p);

  const setuEilutes = Array.from({ length: kiekSetu }, (_, i) => i + 1).map((n) => `
    <div class="setu-eilute">
      <span>${n}.</span>
      <input type="number" step="0.5" min="0" inputmode="decimal" aria-label="${n} seto svoris, kg" name="svoris-${n}">
      <input type="number" step="1" min="0" inputmode="numeric" aria-label="${n} seto kartai" name="kartai-${n}">
    </div>`).join('');

  return `
    <div class="pratimo-kortele">
      <div class="pratimo-virsus">
        <div>
          <strong>${esc(p.title)}</strong>
          ${tikslas ? `<p class="pratimo-tikslas">${tikslas}</p>` : ''}
        </div>
        ${p.video_url ? `<a class="btn btn-ghost btn-sm video-mygtukas" href="${esc(p.video_url)}" target="_blank" rel="noopener">&#9654; Video</a>` : ''}
      </div>
      ${p.notes ? `<p class="muted" style="font-size:.875rem;margin-top:4px">${esc(p.notes)}</p>` : ''}

      <div class="setu-lentele">
        <div class="setu-antraste"><span></span><span>Svoris, kg</span><span>Kartai</span></div>
        <form class="forma-setai" data-pratimas="${esc(p.id)}" novalidate>
          ${setuEilutes}
          <div class="field" style="margin-top:var(--s-200)">
            <label for="pastaba-${esc(p.id)}">Pastaba <span class="hint" style="display:inline">(neprivaloma)</span></label>
            <textarea id="pastaba-${esc(p.id)}" name="pastaba" placeholder="Kaip jauteisi, ką verta prisiminti kitą kartą"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary btn-sm" type="submit">Išsaugoti šios dienos setus</button>
          </div>
          <p class="note" id="statusas-${esc(p.id)}" hidden></p>
        </form>
      </div>
    </div>`;
}

async function issaugokSetus(ev) {
  ev.preventDefault();
  const forma = ev.currentTarget;
  const pratimoId = forma.dataset.pratimas;
  const fd = new FormData(forma);
  const pastaba = String(fd.get('pastaba') || '').trim() || null;

  const irasai = [];
  let n = 1;
  while (fd.has(`svoris-${n}`) || fd.has(`kartai-${n}`)) {
    const svoris = fd.get(`svoris-${n}`);
    const kartai = fd.get(`kartai-${n}`);
    if (svoris || kartai) {
      irasai.push({
        client_exercise_id: pratimoId,
        client_id: vartotojas.id,
        set_index: n,
        weight_kg: svoris ? Number(svoris) : null,
        reps: kartai ? Number(kartai) : null,
        notes: pastaba,
      });
    }
    n += 1;
  }

  const busena = $('#statusas-' + pratimoId);
  if (!irasai.length) {
    pranesk(busena, 'Įrašyk bent vieno seto svorį arba kartus.', 'error');
    return;
  }

  const { error } = await db.from('exercise_logs').insert(irasai);
  if (error) {
    pranesk(busena, klaidaLT(error), 'error');
    return;
  }

  pranesk(busena, 'Išsaugota.', 'ok');
  piesTurini();
}
</script>
</body>
</html>
