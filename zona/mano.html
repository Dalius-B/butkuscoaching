<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mano programa | Butkus Coaching</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101010">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stilius.css">

<!--
  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.
  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo
  duomenų trečiai šaliai. Paprastas skriptas įvykdomas anksčiau už modulį,
  tad app.js jį jau randa.
  Atnaujinimas: curl -sL -o zona/vendor/supabase-2.116.0.umd.js \n                  https://cdn.jsdelivr.net/npm/@supabase/supabase-js@VERSIJA
-->
<script src="vendor/supabase-2.116.0.umd.js"></script>
</head>
<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Klientų zona</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <h1 id="antraste">Mano programa</h1>
      <p id="paantraste">Kraunama</p>
    </div>
    <div id="sarasas">
      <div class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunamos programos</span></div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, Dalius Butkus</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, esc, data, klaidaLT, reikiaSesijos, rodykNav,
  panaudokLaukiantiKvietima,
} from './app.js';

const sarasas    = $('#sarasas');
const paantraste = $('#paantraste');

paleisk();

async function paleisk() {
  const s = await reikiaSesijos();
  if (!s) return;

  let profilis = s.profilis;

  if (s.klaida) {
    sarasas.innerHTML = `<div class="note note-error">${esc(klaidaLT(s.klaida))}</div>`;
    paantraste.textContent = '';
    return;
  }

  // Jei žmogus registravosi su patvirtinimo laišku, kvietimas dar nepanaudotas.
  if (await panaudokLaukiantiKvietima(profilis)) {
    const { data: naujas } = await db
      .from('profiles')
      .select('id, email, full_name, phone, status, created_at')
      .eq('id', s.vartotojas.id)
      .maybeSingle();
    if (naujas) profilis = naujas;
  }

  rodykNav(profilis, 'mano.html', s.arTreneris);

  const vardas = profilis?.full_name?.trim();
  // Kreipinys be giminės, nes zona skirta ir moterims, ir vyrams.
  $('#antraste').textContent = vardas ? `Labas, ${vardas.split(' ')[0]}` : 'Mano programa';

  if (profilis?.status === 'pending') {
    paantraste.textContent = '';
    sarasas.innerHTML = `
      <div class="empty">
        <h2>Paskyra sukurta</h2>
        <p>Kvietimas dar nepatvirtintas arba Dalius dar nepriskyrė tau programos.
           Kai tik ji atsiras, ją matysi būtent čia.</p>
      </div>`;
    return;
  }

  await rodykProgramas(s.arTreneris);
}

async function rodykProgramas(arTreneris) {
  const { data: mano, error } = await db
    .from('client_programs')
    .select('id, title, status, starts_on, assigned_at')
    .eq('status', 'active')
    .order('assigned_at', { ascending: false });

  if (error) {
    paantraste.textContent = '';
    sarasas.innerHTML = `<div class="note note-error">${esc(klaidaLT(error))}</div>`;
    return;
  }

  const matomos = mano || [];

  if (!matomos.length) {
    paantraste.textContent = '';
    sarasas.innerHTML = `
      <div class="empty">
        <h2>Kol kas tuščia</h2>
        <p>Priskirtų programų dar nėra. Kai Dalius paruoš tavo planą, jis atsiras čia.</p>
        ${arTreneris
          ? '<div class="form-actions" style="justify-content:center"><a class="btn btn-primary" href="valdymas.html">Eiti į valdymą</a></div>'
          : ''}
      </div>`;
    return;
  }

  // Kiek dienų ir pratimų turi kiekviena kliento kopija. Dvi užklausos visoms
  // kopijoms iš karto, o ne po vieną kiekvienai kortelei.
  const idSarasas = matomos.map((p) => p.id);
  const { data: dienos } = await db
    .from('client_days')
    .select('id, client_program_id')
    .in('client_program_id', idSarasas);

  const dienuId = (dienos || []).map((d) => d.id);
  const { data: pratimai } = dienuId.length
    ? await db.from('client_exercises').select('id, client_day_id').in('client_day_id', dienuId)
    : { data: [] };

  const dienuSkaicius = new Map();
  for (const d of dienos || []) {
    dienuSkaicius.set(d.client_program_id, (dienuSkaicius.get(d.client_program_id) || 0) + 1);
  }
  const dienaPrieProgram = new Map((dienos || []).map((d) => [d.id, d.client_program_id]));
  const pratimuSkaicius = new Map();
  for (const p of pratimai || []) {
    const progId = dienaPrieProgram.get(p.client_day_id);
    if (!progId) continue;
    pratimuSkaicius.set(progId, (pratimuSkaicius.get(progId) || 0) + 1);
  }

  paantraste.textContent = matomos.length === 1
    ? 'Viena aktyvi programa.'
    : `Aktyvių programų: ${matomos.length}.`;

  sarasas.className = 'grid-cards';
  sarasas.innerHTML = matomos.map((p) => {
    const kiekDienu = dienuSkaicius.get(p.id) || 0;
    const kiekPratimu = pratimuSkaicius.get(p.id) || 0;
    const zymos = [];
    if (kiekDienu)   zymos.push(`${kiekDienu} ${kiekDienu === 1 ? 'diena' : 'dienos'}`);
    if (kiekPratimu) zymos.push(`${kiekPratimu} ${kiekPratimu === 1 ? 'pratimas' : 'pratimai'}`);

    return `
      <a class="card program-card" href="programa.html?id=${encodeURIComponent(p.id)}">
        <h3>${esc(p.title)}</h3>
        <div class="meta">
          <div class="row">
            ${zymos.length
              ? zymos.map((z) => `<span class="chip chip-quiet">${esc(z)}</span>`).join('')
              : '<span class="chip chip-quiet">Turinys ruošiamas</span>'}
          </div>
          <p class="muted" style="font-size:.8125rem;margin-top:8px">
            ${p.starts_on ? 'Pradžia ' + esc(data(p.starts_on)) : 'Priskirta ' + esc(data(p.assigned_at))}
          </p>
        </div>
      </a>`;
  }).join('');
}
</script>
</body>
</html>
