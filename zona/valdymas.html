<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valdymas | Butkus Coaching</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101010">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stilius.css?v=20261009">

<!--
  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.
  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo
  duomenų trečiai šaliai. Paprastas skriptas įvykdomas anksčiau už modulį,
  tad app.js jį jau randa.
  Atnaujinimas: curl -sL -o zona/vendor/supabase-2.116.0.umd.js \n                  https://cdn.jsdelivr.net/npm/@supabase/supabase-js@VERSIJA
-->
<script src="vendor/supabase-2.116.0.umd.js"></script>
<style>
  .nuotrauku-galerija {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(96px, 100%), 1fr));
    gap: var(--s-100); margin-top: var(--s-100);
  }
  .nuotrauku-galerija a { display: block; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; }
  .nuotrauku-galerija img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 150ms var(--ease-out); }
  .nuotrauku-galerija img:hover { opacity: .85; }
</style>
</head>
<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Valdymas</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <h1>Valdymas</h1>
      <p>Programos, klientai, kvietimai ir savaitinės ataskaitos vienoje vietoje.</p>
    </div>

    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>

    <div id="skydelis" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-kortele="programos" aria-selected="true">Programos</button>
        <button class="tab" role="tab" type="button" data-kortele="klientai"  aria-selected="false">Klientai</button>
        <button class="tab" role="tab" type="button" data-kortele="kvietimai" aria-selected="false">Kvietimai</button>
        <button class="tab" role="tab" type="button" data-kortele="patikrinimai" aria-selected="false">Patikrinimai</button>
        <button class="tab" role="tab" type="button" data-kortele="uzduotys" aria-selected="false">Užduotys</button>
      </div>

      <p class="note" id="pranesimas" hidden></p>

      <section id="kortele-programos"></section>
      <section id="kortele-klientai"  hidden></section>
      <section id="kortele-kvietimai" hidden></section>
      <section id="kortele-patikrinimai" hidden></section>
      <section id="kortele-uzduotys" hidden></section>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, valdymas</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, $$, esc, data, klaidaLT, pranesk, valyk, reikiaSesijos, rodykNav,
  atsitiktinis, absoliutus, BUSENOS, zodis, nuotraukuNuorodos,
} from './app.js?v=20261009';
import { piesUzduotis } from './valdymas-uzduotys.js?v=20261009';

let profiliai = [];
let savasId = null;
let programos = [];
let kvietimai = [];
let priskyrimai = [];
let patikrinimai = [];

paleisk();

async function paleisk() {
  const s = await reikiaSesijos({ tikTreneriui: true });
  if (!s) return;
  rodykNav(s.profilis, 'valdymas.html', true);
  savasId = s.vartotojas.id;

  for (const t of $$('.tab')) {
    t.addEventListener('click', () => rodykKortele(t.dataset.kortele));
  }

  await perkrauk();

  $('#kraunasi').hidden = true;
  $('#skydelis').hidden = false;
}

async function perkrauk() {
  const [p1, p2, p3, p4, p5] = await Promise.all([
    db.from('profiles').select('id, email, full_name, phone, status, plan_type, uzduotys_ijungtos, created_at').order('created_at', { ascending: false }),
    db.from('programs').select('id, title, summary, status, created_at, updated_at').order('updated_at', { ascending: false }),
    db.from('invites').select('id, token, email, full_name, note, used_by, used_at, expires_at, plan_type, created_at').order('created_at', { ascending: false }),
    db.from('client_programs').select('id, program_id, client_id, title, status, starts_on, assigned_at'),
    db.from('checkins').select('*').order('created_at', { ascending: false }),
  ]);

  const pirmaKlaida = p1.error || p2.error || p3.error || p4.error || p5.error;
  if (pirmaKlaida) {
    pranesk($('#pranesimas'), klaidaLT(pirmaKlaida), 'error');
  }

  profiliai    = p1.data || [];
  programos    = p2.data || [];
  kvietimai    = p3.data || [];
  priskyrimai  = p4.data || [];
  patikrinimai = p5.data || [];

  piesProgramas();
  piesKlientus();
  piesKvietimus();
  piesPatikrinimus();
  piesUzduotis(profiliai, savasId);
}

function rodykKortele(vardas) {
  for (const t of $$('.tab')) {
    t.setAttribute('aria-selected', String(t.dataset.kortele === vardas));
  }
  for (const k of ['programos', 'klientai', 'kvietimai', 'patikrinimai', 'uzduotys']) {
    $('#kortele-' + k).hidden = k !== vardas;
  }
}

// =============================================================================
//  PROGRAMOS
// =============================================================================
function piesProgramas() {
  const eilutes = programos.map((p) => {
    const kiek = priskyrimai.filter((a) => a.program_id === p.id && a.status === 'active').length;
    return `
      <tr>
        <td>
          <strong>${esc(p.title)}</strong>
          ${p.summary ? `<div class="muted" style="font-size:.8125rem">${esc(p.summary.slice(0, 90))}${p.summary.length > 90 ? '…' : ''}</div>` : ''}
        </td>
        <td><span class="chip ${p.status === 'published' ? 'chip-ok' : 'chip-quiet'}">${esc(p.status === 'published' ? 'Paskelbta' : p.status === 'archived' ? 'Archyve' : 'Juodraštis')}</span></td>
        <td>${kiek}</td>
        <td>${esc(data(p.updated_at))}</td>
        <td>
          <div class="row">
            <a class="btn btn-ghost btn-sm" href="redaguoti.html?id=${encodeURIComponent(p.id)}">Redaguoti</a>
            <button class="btn btn-danger btn-sm trinti-programa" type="button" data-id="${esc(p.id)}" data-vardas="${esc(p.title)}">Trinti</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  $('#kortele-programos').innerHTML = `
    <div class="card" style="margin-bottom:var(--s-300)">
      <div class="card-head">
        <h2>Nauja programa</h2>
      </div>
      <form id="forma-programa" novalidate>
        <div class="field">
          <label for="p-pavadinimas">Pavadinimas</label>
          <input id="p-pavadinimas" type="text" required placeholder="Pavyzdžiui, 12 savaičių jėgos blokas">
        </div>
        <div class="field">
          <label for="p-aprasas">Trumpas aprašas</label>
          <textarea id="p-aprasas" placeholder="Ką klientas ras šioje programoje."></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Sukurti ir redaguoti</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-head"><h2>Visos programos</h2><span class="row-end muted">${programos.length}</span></div>
      ${programos.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Programa</th><th>Būsena</th><th>Klientų</th><th>Atnaujinta</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Programų dar nėra. Sukurk pirmą viršuje.</p>'}
    </div>`;

  $('#forma-programa').addEventListener('submit', sukurkPrograma);
  for (const b of $$('.trinti-programa')) b.addEventListener('click', () => trinkPrograma(b.dataset.id, b.dataset.vardas));
}

async function sukurkPrograma(ev) {
  ev.preventDefault();
  const pavadinimas = $('#p-pavadinimas').value.trim();
  if (!pavadinimas) {
    pranesk($('#pranesimas'), 'Įrašyk programos pavadinimą.', 'error');
    return;
  }

  const { data: nauja, error } = await db
    .from('programs')
    .insert({ title: pavadinimas, summary: $('#p-aprasas').value.trim() })
    .select('id')
    .single();

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  location.href = 'redaguoti.html?id=' + encodeURIComponent(nauja.id);
}

async function trinkPrograma(id, vardas) {
  // Dienos ir pratimai turi on delete cascade ryšį su programa. Klientų
  // kopijos (client_programs) nuo šablono nepriklauso -- program_id ten tik
  // paliekamas tuščias, o kliento kopija ir jos istorija lieka nepaliesta.
  if (!confirm(`Ištrinti programą "${vardas}"?\n\nKartu dings jos dienos ir pratimai. Klientams jau priskirtos kopijos ir jų įrašyta treniruočių istorija liks nepaliestos. To atstatyti nebus galima.`)) return;

  const { error } = await db.from('programs').delete().eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Programa ištrinta.', 'ok');
  await perkrauk();
}

/** Paketo žyma klientų ir kvietimų lentelėse -- viena vieta trims tipams. */
function paketoText(planType) {
  if (planType === 'tik_programa') return 'Tik programa';
  if (planType === 'tik_uzduotys') return 'Tik užduotys';
  return 'Pilnas';
}

// =============================================================================
//  KLIENTAI
// =============================================================================
function piesKlientus() {
  const klientai = profiliai.filter((p) => p.id !== savasId);

  const eilutes = klientai.map((k) => {
    const savos = priskyrimai.filter((a) => a.client_id === k.id && a.status === 'active');
    const pavadinimai = savos.map((a) => a.title).filter(Boolean);

    return `
      <tr>
        <td>
          <strong>${esc(k.full_name || 'Be vardo')}</strong>
          <div class="muted" style="font-size:.8125rem">${esc(k.email || '')}</div>
          ${k.phone ? `<div class="muted" style="font-size:.8125rem">${esc(k.phone)}</div>` : ''}
        </td>
        <td><span class="chip ${k.status === 'active' ? 'chip-ok' : k.status === 'blocked' ? 'chip-danger' : 'chip-quiet'}">${esc(BUSENOS[k.status] || k.status)}</span></td>
        <td><span class="chip chip-quiet">${paketoText(k.plan_type)}</span></td>
        <td>${k.uzduotys_ijungtos ? '<span class="chip chip-ok">Įjungtos</span>' : '<span class="chip chip-quiet">Išjungtos</span>'}</td>
        <td>${pavadinimai.length ? pavadinimai.map((t) => `<div>${esc(t)}</div>`).join('') : '<span class="muted">nėra</span>'}</td>
        <td>${esc(data(k.created_at))}</td>
        <td>
          <div class="row">
            <button class="btn btn-ghost btn-sm uzd-jungiklis" type="button" data-id="${esc(k.id)}" data-ijungta="${k.uzduotys_ijungtos ? '0' : '1'}">${k.uzduotys_ijungtos ? 'Išjungti užduotis' : 'Įjungti užduotis'}</button>
            <button class="btn btn-ghost btn-sm zr-programos" type="button" data-id="${esc(k.id)}"${priskyrimai.some((a) => a.client_id === k.id) ? '' : ' disabled'}>Programos</button>
            ${k.status === 'blocked'
              ? `<button class="btn btn-ghost btn-sm busena" type="button" data-id="${esc(k.id)}" data-busena="active">Grąžinti prieigą</button>`
              : `<button class="btn btn-danger btn-sm busena" type="button" data-id="${esc(k.id)}" data-busena="blocked">Sustabdyti</button>`}
          </div>
        </td>
      </tr>`;
  }).join('');

  $('#kortele-klientai').innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2>Klientai</h2>
        <span class="row-end muted">${klientai.length}</span>
      </div>
      <p class="muted" style="margin-bottom:var(--s-200)">
        Programos priskiriamos programos redagavimo lange, skiltyje Priskyrimai.
      </p>
      ${klientai.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Žmogus</th><th>Būsena</th><th>Paketas</th><th>Užduotys</th><th>Programos</th><th>Užsiregistravo</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Klientų dar nėra. Sukurk kvietimą skiltyje Kvietimai.</p>'}
    </div>

    <div id="klientu-programu-detale"></div>
    <div id="klientu-pratimu-detale"></div>

    <div class="card" style="margin-top:var(--s-300)">
      <p class="muted" style="font-size:.875rem;margin:0">
        Trenerio teisės suteikiamos tik per Supabase SQL redaktorių, iš šio puslapio to padaryti negalima.
        Taip klientas niekada negali pasikelti sau teisių.
      </p>
    </div>`;

  for (const b of $$('.busena')) {
    b.addEventListener('click', () => keiskBusena(b.dataset.id, b.dataset.busena));
  }
  for (const b of $$('.uzd-jungiklis')) {
    b.addEventListener('click', () => keiskUzduotis(b.dataset.id, b.dataset.ijungta === '1'));
  }
  for (const b of $$('.zr-programos')) {
    b.addEventListener('click', () => rodykKlientoProgramas(b.dataset.id));
  }
}

async function keiskBusena(id, busena) {
  // Būsena keičiama per funkciją, o ne tiesiogiai: status stulpelio rašymo
  // teisių neturi net treneris, kad klientas negalėtų atblokuoti savęs pats.
  const { error } = await db.rpc('admin_set_status', { p_client: id, p_status: busena });
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), busena === 'blocked' ? 'Prieiga sustabdyta.' : 'Prieiga grąžinta.', 'ok');
  await perkrauk();
}

async function keiskUzduotis(id, ijungta) {
  const { error } = await db.rpc('admin_set_uzduotys', { p_client: id, p_ijungta: ijungta });
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), ijungta ? 'Užduotys klientui įjungtos.' : 'Užduotys klientui išjungtos.', 'ok');
  await perkrauk();
}

// Kliento visos programos kopijos (aktyvios ir baigtos), su galimybe
// nereikalingą (pvz. bandomąją) visam laikui ištrinti. Tai skiriasi nuo
// "Atimti" priskyrimų skiltyje -- ten tik pažymima 'finished' ir istorija
// lieka, o čia eilutė (ir per cascade jos dienos/pratimai/įrašai) dingsta.
function rodykKlientoProgramas(clientId) {
  const klientas = profiliai.find((p) => p.id === clientId);
  if (!klientas) return;
  const savos = priskyrimai.filter((a) => a.client_id === clientId)
    .sort((a, b) => new Date(b.assigned_at) - new Date(a.assigned_at));

  const eilutes = savos.map((a) => `
    <tr>
      <td>${esc(a.title)}</td>
      <td><span class="chip ${a.status === 'active' ? 'chip-ok' : 'chip-quiet'}">${a.status === 'active' ? 'Aktyvi' : a.status === 'finished' ? 'Baigta' : esc(a.status)}</span></td>
      <td>${a.starts_on ? esc(data(a.starts_on)) : esc(data(a.assigned_at))}</td>
      <td>
        <div class="row">
          <a class="btn btn-ghost btn-sm" href="istorija.html?id=${encodeURIComponent(a.id)}">Istorija</a>
          <button class="btn btn-ghost btn-sm redaguoti-kliento-pratimus" type="button" data-id="${esc(a.id)}">Pratimai</button>
          <button class="btn btn-danger btn-sm trinti-kliento-programa" type="button" data-id="${esc(a.id)}" data-vardas="${esc(a.title)}">Trinti</button>
        </div>
      </td>
    </tr>`).join('');

  $('#klientu-programu-detale').innerHTML = `
    <div class="card" style="margin-top:var(--s-300)">
      <div class="card-head">
        <h2>${esc(klientas.full_name || klientas.email)} -- programos</h2>
        <span class="row-end muted">${savos.length}</span>
      </div>
      ${savos.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Programa</th><th>Būsena</th><th>Pradžia</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Programų nėra.</p>'}
    </div>`;

  for (const b of $$('.trinti-kliento-programa')) {
    b.addEventListener('click', () => trinkKlientoPrograma(b.dataset.id, b.dataset.vardas, clientId));
  }
  for (const b of $$('.redaguoti-kliento-pratimus')) {
    b.addEventListener('click', () => redaguokKlientoPratimus(b.dataset.id));
  }
  $('#klientu-programu-detale').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// =============================================================================
//  KLIENTO PRISKIRTOS PROGRAMOS KOPIJOS PRATIMŲ TAISYMAS
//  Priskyrimo metu kliento kopija "sušąla" -- vėlesni šablono pakeitimai jos
//  nebepasiekia. Čia leidžiama taisyti tik tai, kas realiai prireikia po
//  priskyrimo (įrašymo tipą ir video nuorodą), be viso priskyrimo kartojimo,
//  kuris sukurtų naują kopiją ir nutrauktų ryšį su jau įrašyta istorija.
// =============================================================================
async function redaguokKlientoPratimus(clientProgramId) {
  const vieta = $('#klientu-pratimu-detale');
  vieta.innerHTML = '<div class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>';
  vieta.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const { data: dienos, error: dKlaida } = await db
    .from('client_days').select('id, title, position').eq('client_program_id', clientProgramId).order('position', { ascending: true });
  if (dKlaida) {
    vieta.innerHTML = `<div class="note note-error">${esc(klaidaLT(dKlaida))}</div>`;
    return;
  }

  const dienuId = (dienos || []).map((d) => d.id);
  const { data: pratimai, error: pKlaida } = dienuId.length
    ? await db.from('client_exercises').select('*').in('client_day_id', dienuId).order('position', { ascending: true })
    : { data: [] };
  if (pKlaida) {
    vieta.innerHTML = `<div class="note note-error">${esc(klaidaLT(pKlaida))}</div>`;
    return;
  }

  vieta.innerHTML = `
    <div class="card" style="margin-top:var(--s-300)">
      <div class="card-head">
        <h2>Pratimų taisymas</h2>
        <button class="btn btn-ghost btn-sm row-end" type="button" id="uzdaryti-kliento-pratimus">Uždaryti</button>
      </div>
      <p class="muted" style="font-size:.875rem">
        Čia taisomas tik šio kliento jau priskirtas egzempliorius -- šablonas ir kiti klientai nepasikeičia.
      </p>
      ${(dienos || []).map((d) => {
        const savi = (pratimai || []).filter((p) => p.client_day_id === d.id);
        return `
          <div style="margin-top:var(--s-300)">
            <h3 style="font-size:1.0625rem">${esc(d.title)}</h3>
            ${savi.length ? savi.map((p) => klientoPratimoRedagavimas(p)).join('') : '<p class="muted" style="font-size:.875rem">Pratimų nėra.</p>'}
          </div>`;
      }).join('')}
    </div>`;

  $('#uzdaryti-kliento-pratimus').addEventListener('click', () => { vieta.innerHTML = ''; });
  for (const f of $$('.forma-kliento-pratimas')) f.addEventListener('submit', issaugokKlientoPratima);
}

function klientoPratimoRedagavimas(p) {
  return `
    <form class="forma-kliento-pratimas" data-id="${esc(p.id)}" novalidate
      style="margin-top:var(--s-200);padding-top:var(--s-200);border-top:1px solid var(--hair-ink)">
      <div class="field-row">
        <div class="field" style="flex:0 0 auto">
          <label style="font-weight:700">${esc(p.title)}</label>
        </div>
        <div class="field">
          <label for="kp-tipas-${esc(p.id)}">Įrašymo tipas</label>
          <select id="kp-tipas-${esc(p.id)}" name="log_type">
            <option value="svoris"${p.log_type === 'svoris' || !p.log_type ? ' selected' : ''}>Svoris ir kartai</option>
            <option value="kartai"${p.log_type === 'kartai' ? ' selected' : ''}>Tik kartai (be svorio)</option>
            <option value="laikas"${p.log_type === 'laikas' ? ' selected' : ''}>Laikas (sekundėmis)</option>
          </select>
        </div>
        <div class="field">
          <label for="kp-video-${esc(p.id)}">Vaizdo nuoroda <span class="hint" style="display:inline">(neprivaloma)</span></label>
          <input id="kp-video-${esc(p.id)}" name="video" type="url" placeholder="YouTube arba Vimeo nuoroda" value="${esc(p.video_url || '')}">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost btn-sm" type="submit">Išsaugoti</button>
        <p class="note" id="kp-statusas-${esc(p.id)}" hidden></p>
      </div>
    </form>`;
}

async function issaugokKlientoPratima(ev) {
  ev.preventDefault();
  const forma = ev.currentTarget;
  const id = forma.dataset.id;
  const fd = new FormData(forma);
  const busena = $('#kp-statusas-' + id);

  const { error } = await db.from('client_exercises').update({
    log_type: String(fd.get('log_type') || 'svoris'),
    video_url: String(fd.get('video') || '').trim() || null,
  }).eq('id', id);

  if (error) {
    pranesk(busena, klaidaLT(error), 'error');
    return;
  }
  pranesk(busena, 'Išsaugota ✓', 'ok');
  clearTimeout(forma._laikmatis);
  forma._laikmatis = setTimeout(() => valyk(busena), 4000);
}

async function trinkKlientoPrograma(id, vardas, clientId) {
  if (!confirm(`Ištrinti "${vardas}" kopiją visam laikui?\n\nKartu dings jos dienos, pratimai ir visa įrašyta treniruočių istorija. To atstatyti nebus galima.`)) return;

  const { error } = await db.from('client_programs').delete().eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Programa ištrinta.', 'ok');
  await perkrauk();
  rodykKlientoProgramas(clientId);
}

// =============================================================================
//  KVIETIMAI
// =============================================================================
function piesKvietimus() {
  const eilutes = kvietimai.map((k) => {
    const panaudotas = Boolean(k.used_by);
    const pasibaiges = !panaudotas && k.expires_at && new Date(k.expires_at) <= new Date();
    const nuoroda = kvietimoNuoroda(k.token);

    let zyma = '<span class="chip chip-ok">Galioja</span>';
    if (panaudotas) zyma = '<span class="chip chip-quiet">Panaudotas</span>';
    else if (pasibaiges) zyma = '<span class="chip chip-danger">Nebegalioja</span>';

    return `
      <tr>
        <td>
          <strong>${esc(k.full_name || 'Be vardo')}</strong>
          <div class="muted" style="font-size:.8125rem">${esc(k.email || 'be el. pašto')}</div>
          ${k.note ? `<div class="muted" style="font-size:.8125rem">${esc(k.note)}</div>` : ''}
        </td>
        <td>${zyma}</td>
        <td><span class="chip chip-quiet">${paketoText(k.plan_type)}</span></td>
        <td>${k.expires_at ? esc(data(k.expires_at)) : '<span class="muted">neribotas</span>'}</td>
        <td>${esc(data(k.created_at))}</td>
        <td>
          <div class="row">
            ${!panaudotas && !pasibaiges
              ? `<button class="btn btn-ghost btn-sm kopijuoti" type="button" data-nuoroda="${esc(nuoroda)}">Kopijuoti nuorodą</button>`
              : ''}
            <button class="btn btn-danger btn-sm trinti-kvietima" type="button" data-id="${esc(k.id)}">Trinti</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  $('#kortele-kvietimai').innerHTML = `
    <div class="card" style="margin-bottom:var(--s-300)">
      <div class="card-head"><h2>Naujas kvietimas</h2></div>
      <p class="muted" style="margin-bottom:var(--s-300)">
        Sukūrus kvietimą gausi asmeninę nuorodą. Nusiųsk ją žmogui, ir jis pats susikurs paskyrą.
        Nuoroda veikia vieną kartą.
      </p>
      <form id="forma-kvietimas" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="k-vardas">Vardas ir pavardė</label>
            <input id="k-vardas" type="text" placeholder="Vardenis Pavardenis">
          </div>
          <div class="field">
            <label for="k-pastas">El. paštas</label>
            <input id="k-pastas" type="email" placeholder="vardas@pastas.lt">
            <span class="hint">Jei įrašysi, registruojantis adreso pakeisti nebus galima.</span>
          </div>
          <div class="field">
            <label for="k-galioja">Galioja dienų</label>
            <input id="k-galioja" type="number" min="1" max="365" value="30">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="k-paketas">Paketas</label>
            <select id="k-paketas">
              <option value="pilnas">Pilnas koučingas -- programa, istorija ir savaitinė ataskaita</option>
              <option value="tik_programa">Tik programa -- programa ir istorija, be savaitinės ataskaitos</option>
              <option value="tik_uzduotys">Tik užduotys -- be programos, be istorijos</option>
            </select>
          </div>
          <div class="field">
            <label for="k-pastaba">Pastaba sau</label>
            <input id="k-pastaba" type="text" placeholder="Neprivaloma">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Sukurti kvietimą</button>
        </div>
      </form>
      <div id="nauja-nuoroda" hidden style="margin-top:var(--s-300)"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Visi kvietimai</h2><span class="row-end muted">${kvietimai.length}</span></div>
      ${kvietimai.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Kam</th><th>Būsena</th><th>Paketas</th><th>Galioja iki</th><th>Sukurta</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Kvietimų dar nėra.</p>'}
    </div>`;

  $('#forma-kvietimas').addEventListener('submit', sukurkKvietima);
  for (const b of $$('.kopijuoti')) b.addEventListener('click', () => kopijuok(b, b.dataset.nuoroda));
  for (const b of $$('.trinti-kvietima')) b.addEventListener('click', () => trinkKvietima(b.dataset.id));
}

function kvietimoNuoroda(token) {
  return absoliutus('registracija.html') + '?kvietimas=' + encodeURIComponent(token);
}

async function sukurkKvietima(ev) {
  ev.preventDefault();

  const dienos = Number($('#k-galioja').value);
  const galioja = Number.isFinite(dienos) && dienos > 0
    ? new Date(Date.now() + dienos * 24 * 60 * 60 * 1000).toISOString()
    : null;

  const token = atsitiktinis(36);

  const { error } = await db.from('invites').insert({
    token,
    email: $('#k-pastas').value.trim() || null,
    full_name: $('#k-vardas').value.trim() || null,
    note: $('#k-pastaba').value.trim() || null,
    expires_at: galioja,
    plan_type: $('#k-paketas').value,
  });

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }

  const nuoroda = kvietimoNuoroda(token);
  const langelis = $('#nauja-nuoroda');
  langelis.hidden = false;
  langelis.innerHTML = `
    <div class="note note-ok">
      <strong>Kvietimas paruoštas.</strong> Nusiųsk šią nuorodą žmogui.
      <div class="field" style="margin-top:var(--s-200)">
        <input id="nuorodos-laukas" type="text" readonly value="${esc(nuoroda)}">
      </div>
      <div class="form-actions" style="margin-top:var(--s-200)">
        <button class="btn btn-ghost btn-sm" type="button" id="kopijuoti-nauja">Kopijuoti</button>
      </div>
    </div>`;

  $('#kopijuoti-nauja').addEventListener('click', (e) => kopijuok(e.currentTarget, nuoroda));
  $('#forma-kvietimas').reset();
  $('#k-galioja').value = '30';

  await perkrauk();
  // perkrauk perpiešia kortelę, todėl nuorodą parodome dar kartą.
  const naujas = $('#nauja-nuoroda');
  naujas.hidden = false;
  naujas.innerHTML = langelis.innerHTML;
  $('#kopijuoti-nauja').addEventListener('click', (e) => kopijuok(e.currentTarget, nuoroda));
}

async function kopijuok(mygtukas, tekstas) {
  const senas = mygtukas.textContent;
  try {
    await navigator.clipboard.writeText(tekstas);
    mygtukas.textContent = 'Nukopijuota';
    setTimeout(() => { mygtukas.textContent = senas; }, 1800);
    return;
  } catch {
    // Kai kurios naršyklės neleidžia rašyti į iškarpinę be papildomo leidimo.
    // Tada parodome būtent šios eilutės nuorodą ir ją pažymime, kad žmogus
    // galėtų nukopijuoti ranka.
    let laukas = mygtukas.parentElement?.querySelector('.rankinis-laukas');
    if (!laukas) {
      laukas = document.createElement('input');
      laukas.type = 'text';
      laukas.readOnly = true;
      laukas.className = 'rankinis-laukas';
      laukas.style.cssText = 'width:100%;margin-top:8px;font-size:.8125rem;padding:6px 8px;border:1px solid rgba(16,16,16,.2);border-radius:6px';
      mygtukas.parentElement?.appendChild(laukas);
    }
    laukas.value = tekstas;
    laukas.select();
    mygtukas.textContent = 'Kopijuok ranka';
  }
  setTimeout(() => { mygtukas.textContent = senas; }, 3000);
}

async function trinkKvietima(id) {
  if (!confirm('Ištrinti kvietimą? Nuoroda nustos veikti.')) return;
  const { error } = await db.from('invites').delete().eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Kvietimas ištrintas.', 'ok');
  await perkrauk();
}

// =============================================================================
//  PATIKRINIMAI
//
//  Savaitinės kliento ataskaitos suvestinė kortelė. Ataskaitą klientas pildo
//  prisijungęs (mano.html), tad kiekviena eilutė jau turi user_id, ir
//  priskyrimas čia yra tikslus, o ne spėjimas pagal el. paštą.
// =============================================================================
function klientoPatikrinimai(klientas) {
  return patikrinimai.filter((c) => c.user_id === klientas.id);
}

function piesPatikrinimus() {
  const klientai = profiliai.filter((p) => p.id !== savasId);

  const eilutes = klientai.map((k) => {
    const savi = klientoPatikrinimai(k);
    const paskutinis = savi[0];
    return `
      <tr>
        <td>
          <strong>${esc(k.full_name || 'Be vardo')}</strong>
          <div class="muted" style="font-size:.8125rem">${esc(k.email || '')}</div>
        </td>
        <td>${savi.length}</td>
        <td>${paskutinis ? esc(data(paskutinis.created_at)) : '<span class="muted">nėra</span>'}</td>
        <td>
          <button class="btn btn-ghost btn-sm zr-patikrinimai" type="button" data-id="${esc(k.id)}"${savi.length ? '' : ' disabled'}>Žiūrėti</button>
        </td>
      </tr>`;
  }).join('');

  $('#kortele-patikrinimai').innerHTML = `
    <div class="card">
      <div class="card-head"><h2>Klientų ataskaitos</h2><span class="row-end muted">${klientai.length}</span></div>
      <p class="muted" style="margin-bottom:var(--s-200)">
        Kiekvieną sekmadienį klientas užpildo savaitinę ataskaitą svetainėje. Čia matai visą jos istoriją, kliento el. paštu susietą su jo paskyra.
      </p>
      ${klientai.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Žmogus</th><th>Ataskaitų</th><th>Paskutinė</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Klientų dar nėra.</p>'}
    </div>
    <div id="patikrinimu-detale"></div>`;

  for (const b of $$('.zr-patikrinimai')) {
    b.addEventListener('click', () => rodykKlientoPatikrinimus(b.dataset.id));
  }
}

async function rodykKlientoPatikrinimus(clientId) {
  const klientas = profiliai.find((p) => p.id === clientId);
  if (!klientas) return;
  const savi = klientoPatikrinimai(klientas);

  const visiKeliai = savi.flatMap((c) => c.photo_paths || []);
  const nuorodos = await nuotraukuNuorodos(visiKeliai);

  const kortos = savi.map((c) => `
    <div class="card" style="margin-top:var(--s-200)">
      <div class="card-head">
        <h3 style="margin:0">${esc(c.program_week || 'Savaitė nenurodyta')}</h3>
        <span class="row-end muted">${esc(data(c.created_at, true))}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:var(--s-100) var(--s-300);font-size:.9375rem;margin-top:var(--s-100)">
        <div><span class="muted">Treniruotės</span><br>${esc(c.sessions_completed)}</div>
        <div><span class="muted">Pastangos</span><br>${esc(c.effort_rating)}/10</div>
        <div><span class="muted">Skausmas</span><br>${esc(c.pain_status)}</div>
        <div><span class="muted">Svoris</span><br>${esc(c.weight_kg)} kg</div>
        <div><span class="muted">Miegas</span><br>${esc(c.sleep_hours)}, kokybė ${esc(c.sleep_quality)}/10</div>
        ${c.nutrition_adherence != null ? `<div><span class="muted">Mityba</span><br>laikymasis ${esc(c.nutrition_adherence)}/10${c.protein_intake ? `, baltymai ${esc(c.protein_intake)}` : ''}</div>` : ''}
        <div><span class="muted">Energija</span><br>${esc(c.energy_level)}/10</div>
        <div><span class="muted">Stresas</span><br>${esc(c.stress_level)}/10</div>
        <div><span class="muted">Progresas</span><br>${esc(c.progress_feeling)}/10</div>
        ${c.avg_daily_steps ? `<div><span class="muted">Žingsniai</span><br>${esc(c.avg_daily_steps)}</div>` : ''}
      </div>
      ${(c.photo_paths || []).length ? `
        <div class="nuotrauku-galerija">
          ${c.photo_paths.map((kelias) => nuorodos.get(kelias)
            ? `<a href="${esc(nuorodos.get(kelias))}" target="_blank" rel="noopener"><img src="${esc(nuorodos.get(kelias))}" alt="Progreso nuotrauka" loading="lazy"></a>`
            : '').join('')}
        </div>` : ''}
      <details style="margin-top:var(--s-200)">
        <summary class="muted" style="cursor:pointer;font-size:.875rem">Visas tekstas</summary>
        <div style="margin-top:var(--s-100);display:flex;flex-direction:column;gap:var(--s-100);font-size:.9375rem">
          ${c.pain_detail ? `<div><strong>Skausmo detalės</strong><br>${esc(c.pain_detail)}</div>` : ''}
          ${c.sleep_disruptions ? `<div><strong>Miego trikdžiai</strong><br>${esc(c.sleep_disruptions)}</div>` : ''}
          ${c.nutrition_struggles ? `<div><strong>Mitybos sunkumai</strong><br>${esc(c.nutrition_struggles)}</div>` : ''}
          ${c.stress_source ? `<div><strong>Streso šaltinis</strong><br>${esc(c.stress_source)}</div>` : ''}
          <div><strong>Kuo didžiuojasi</strong><br>${esc(c.proud_of)}</div>
          <div><strong>Didžiausias iššūkis</strong><br>${esc(c.biggest_challenge)}</div>
          ${c.additional_notes ? `<div><strong>Papildomai</strong><br>${esc(c.additional_notes)}</div>` : ''}
          ${c.program_adjustment ? `<div><strong>Siūlomi pakeitimai</strong><br>${esc(c.program_adjustment)}</div>` : ''}
        </div>
      </details>
    </div>`).join('');

  $('#patikrinimu-detale').innerHTML = `
    <div class="page-head" style="margin-top:var(--s-300);margin-bottom:0">
      <h2>${esc(klientas.full_name || klientas.email)}</h2>
      <p>${savi.length} ${zodis(savi.length, 'ataskaita', 'ataskaitos', 'ataskaitų')}.</p>
    </div>
    ${kortos || '<p class="muted">Ataskaitų nėra.</p>'}`;

  $('#patikrinimu-detale').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
