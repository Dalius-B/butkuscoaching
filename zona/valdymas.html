<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valdymas | Butkus Coaching</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101010">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stilius.css?v=20261024">

<!--
  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.
  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo
  duomenų trečiai šaliai. Paprastas skriptas įvykdomas anksčiau už modulį,
  tad app.js jį jau randa.
  Atnaujinimas: curl -sL -o zona/vendor/supabase-2.116.0.umd.js \n                  https://cdn.jsdelivr.net/npm/@supabase/supabase-js@VERSIJA
-->
<script src="vendor/supabase-2.116.0.umd.js"></script>
<style>
  .nuotrauku-galerija {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(96px, 100%), 1fr));
    gap: var(--s-100); margin-top: var(--s-100);
  }
  .nuotrauku-galerija a { display: block; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; }
  .nuotrauku-galerija img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 150ms var(--ease-out); }
  .nuotrauku-galerija img:hover { opacity: .85; }

  /* Kliento priskirtos programos kopijos pratimų eilutė — tas pats
     vaizdas kaip redaguoti.html šablono sąraše, bet be tempimo (čia
     tvarką keisti pakanka mygtukais, programa paprastai trumpa). */
  .pratimo-eilute {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--s-100) var(--s-200);
    padding: var(--s-100) 0; border-top: 1px solid var(--hair-ink);
  }
  .pratimo-eilute:first-child { border-top: 0; }
  .forma-redaguoti-pratima, .forma-kliento-pratimas { flex-wrap: nowrap; }
  .pratimo-meta { display: flex; flex-wrap: wrap; gap: var(--s-100); margin-top: 4px; }
  .pratimo-eilute-info { flex: 1 1 180px; min-width: 0; }
  .pratimo-eilute-valdymas { display: flex; align-items: center; gap: var(--s-100); flex-wrap: wrap; flex: none; margin-left: auto; }
  .tvarkos-mygtukai { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .tvarkos-mygtukai button {
    width: 26px; height: 22px; padding: 0; line-height: 1; font-size: .75rem;
    border: 1px solid rgba(16,16,16,0.20); border-radius: var(--r-sm); background: var(--white); cursor: pointer;
  }
  .tvarkos-mygtukai button:hover:not(:disabled) { border-color: rgba(16,16,16,0.42); }
  .tvarkos-mygtukai button:disabled { opacity: .3; cursor: default; }
  .pratimo-eilute.supersete { border-left: 3px solid var(--volt); padding-left: var(--s-100); margin-left: -1px; }
  .pratimo-eilute.paslepta { opacity: .55; }
  .superseto-zenklas {
    display: inline-block; font-size: .6875rem; font-weight: 700; letter-spacing: .04em;
    color: var(--ink); background: var(--volt); border-radius: var(--r-sm); padding: 1px 6px; margin-left: 4px;
  }
</style>
</head>
<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Valdymas</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <h1>Valdymas</h1>
      <p>Programos, klientai, kvietimai ir savaitinės ataskaitos vienoje vietoje.</p>
    </div>

    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>

    <div id="skydelis" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-kortele="programos" aria-selected="true">Programos</button>
        <button class="tab" role="tab" type="button" data-kortele="klientai"  aria-selected="false">Klientai</button>
        <button class="tab" role="tab" type="button" data-kortele="kvietimai" aria-selected="false">Kvietimai</button>
        <button class="tab" role="tab" type="button" data-kortele="patikrinimai" aria-selected="false">Patikrinimai</button>
        <button class="tab" role="tab" type="button" data-kortele="uzduotys" aria-selected="false">Užduotys</button>
        <button class="tab" role="tab" type="button" data-kortele="biblioteka" aria-selected="false">Biblioteka</button>
        <button class="tab" role="tab" type="button" data-kortele="atsiliepimai" aria-selected="false">Atsiliepimai</button>
      </div>

      <p class="note" id="pranesimas" hidden></p>

      <section id="kortele-programos"></section>
      <section id="kortele-klientai"  hidden></section>
      <section id="kortele-kvietimai" hidden></section>
      <section id="kortele-patikrinimai" hidden></section>
      <section id="kortele-uzduotys" hidden></section>
      <section id="kortele-biblioteka" hidden></section>
      <section id="kortele-atsiliepimai" hidden></section>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, valdymas</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, $$, esc, data, klaidaLT, pranesk, valyk, reikiaSesijos, rodykNav,
  atsitiktinis, absoliutus, BUSENOS, zodis, nuotraukuNuorodos, apskaiciuokSupersetuZenklus,
  ikelkBibliotekosFaila, trinkBibliotekosFaila, BIBLIOTEKOS_KIBIRAS, BIBLIOTEKOS_MAX_MB,
  atsiliepimoNuotraukuUrl, trinkAtsiliepimoNuotrauka,
} from './app.js?v=20261024';
import { piesUzduotis } from './valdymas-uzduotys.js?v=20261024';

let profiliai = [];
let savasId = null;
let programos = [];
let kvietimai = [];
let priskyrimai = [];
let patikrinimai = [];
let treniruociuIrasai = [];
let biblioteka = [];
let redaguojamoBibliotekosIrasoId = null;
let atsiliepimai = [];

// Kliento priskirtos programos kopijos redagavimo būsena.
let redaguojamosKlientoProgramosId = null;
let klientoDienos = [];
let klientoPratimai = [];
let redaguojamosKlientoDienosId = null;
let redaguojamoKlientoPratimoId = null;
let pridedamosKlientoDienosId = null;

paleisk();

async function paleisk() {
  const s = await reikiaSesijos({ tikTreneriui: true });
  if (!s) return;
  rodykNav(s.profilis, 'valdymas.html', true);
  savasId = s.vartotojas.id;

  for (const t of $$('.tab')) {
    t.addEventListener('click', () => rodykKortele(t.dataset.kortele));
  }

  await perkrauk();

  // Atėjus iš kliento profilio (klientas.html) nuorodos "Tvarkyti" — iškart
  // atidaro Klientai skiltį ir to kliento programų sąrašą, kad nereikėtų
  // ieškoti jo iš naujo lentelėje.
  const atidarytiKlienta = new URLSearchParams(location.search).get('klientas');
  if (atidarytiKlienta) {
    rodykKortele('klientai');
    rodykKlientoProgramas(atidarytiKlienta);
  }

  $('#kraunasi').hidden = true;
  $('#skydelis').hidden = false;
}

async function perkrauk() {
  const [p1, p2, p3, p4, p5, p6, p7, p8] = await Promise.all([
    db.from('profiles').select('id, email, full_name, phone, status, plan_type, uzduotys_ijungtos, created_at').order('created_at', { ascending: false }),
    db.from('programs').select('id, title, summary, status, created_at, updated_at').order('updated_at', { ascending: false }),
    db.from('invites').select('id, token, email, full_name, note, used_by, used_at, expires_at, plan_type, created_at').order('created_at', { ascending: false }),
    db.from('client_programs').select('id, program_id, client_id, title, status, starts_on, assigned_at'),
    db.from('checkins').select('*').order('created_at', { ascending: false }),
    db.from('library_items').select('*').order('position', { ascending: true }),
    db.from('testimonials').select('*').order('created_at', { ascending: false }),
    // Tik client_id ir data — "Paskutinė treniruotė" skiltyje reikia tik
    // naujausio seto laiko, o ne visos istorijos (ta jau skaičiuojama
    // istorija.html per konkrečią programą).
    db.from('exercise_logs').select('client_id, logged_at').order('logged_at', { ascending: false }),
  ]);

  const pirmaKlaida = p1.error || p2.error || p3.error || p4.error || p5.error || p6.error || p7.error || p8.error;
  if (pirmaKlaida) {
    pranesk($('#pranesimas'), klaidaLT(pirmaKlaida), 'error');
  }

  profiliai       = p1.data || [];
  programos       = p2.data || [];
  kvietimai       = p3.data || [];
  priskyrimai     = p4.data || [];
  patikrinimai    = p5.data || [];
  biblioteka      = p6.data || [];
  atsiliepimai    = p7.data || [];
  treniruociuIrasai = p8.data || [];

  piesProgramas();
  piesKlientus();
  piesKvietimus();
  piesPatikrinimus();
  piesUzduotis(profiliai, savasId);
  piesBiblioteka();
  piesAtsiliepimus();
}

function rodykKortele(vardas) {
  for (const t of $$('.tab')) {
    t.setAttribute('aria-selected', String(t.dataset.kortele === vardas));
  }
  for (const k of ['programos', 'klientai', 'kvietimai', 'patikrinimai', 'uzduotys', 'biblioteka', 'atsiliepimai']) {
    $('#kortele-' + k).hidden = k !== vardas;
  }
}

// =============================================================================
//  PROGRAMOS
// =============================================================================
function piesProgramas() {
  const eilutes = programos.map((p) => {
    const kiek = priskyrimai.filter((a) => a.program_id === p.id && a.status === 'active').length;
    return `
      <tr>
        <td>
          <strong>${esc(p.title)}</strong>
          ${p.summary ? `<div class="muted" style="font-size:.8125rem">${esc(p.summary.slice(0, 90))}${p.summary.length > 90 ? '…' : ''}</div>` : ''}
        </td>
        <td data-label="Būsena"><span class="chip ${p.status === 'published' ? 'chip-ok' : 'chip-quiet'}">${esc(p.status === 'published' ? 'Paskelbta' : p.status === 'archived' ? 'Archyve' : 'Juodraštis')}</span></td>
        <td data-label="Klientų">${kiek}</td>
        <td data-label="Atnaujinta">${esc(data(p.updated_at))}</td>
        <td data-label="">
          <div class="row">
            <a class="btn btn-ghost btn-sm" href="redaguoti.html?id=${encodeURIComponent(p.id)}">Redaguoti</a>
            <button class="btn btn-danger btn-sm trinti-programa" type="button" data-id="${esc(p.id)}" data-vardas="${esc(p.title)}">Trinti</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  $('#kortele-programos').innerHTML = `
    <div class="card" style="margin-bottom:var(--s-300)">
      <div class="card-head">
        <h2>Nauja programa</h2>
      </div>
      <form id="forma-programa" novalidate>
        <div class="field">
          <label for="p-pavadinimas">Pavadinimas</label>
          <input id="p-pavadinimas" type="text" required placeholder="Pavyzdžiui, 12 savaičių jėgos blokas">
        </div>
        <div class="field">
          <label for="p-aprasas">Trumpas aprašas</label>
          <textarea id="p-aprasas" placeholder="Ką klientas ras šioje programoje."></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Sukurti ir redaguoti</button>
        </div>
      </form>
    </div>

    <div class="card">
      <details>
        <summary class="card-head" style="cursor:pointer;list-style:none">
          <h2 style="display:inline">Visos programos</h2>
          <span class="row-end muted">${programos.length}</span>
        </summary>
        <p class="muted" style="font-size:.8125rem;margin:var(--s-200) 0">
          Būsena nurodo, ar programą gali priskirti NAUJAM klientui — klientai, kurie programą jau turi
          priskirtą, mato savo kopiją nepriklausomai nuo šios būsenos (ir jei ją pakeisi į Juodraštis ar
          Archyve, jau priskirtiems klientams niekas nepasikeičia).
        </p>
        ${programos.length ? `
          <div class="table-wrap table-kortelese">
            <table>
              <thead><tr><th>Programa</th><th>Būsena</th><th>Klientų</th><th>Atnaujinta</th><th></th></tr></thead>
              <tbody>${eilutes}</tbody>
            </table>
          </div>` : '<p class="muted">Programų dar nėra. Sukurk pirmą viršuje.</p>'}
      </details>
    </div>`;

  $('#forma-programa').addEventListener('submit', sukurkPrograma);
  for (const b of $$('.trinti-programa')) b.addEventListener('click', () => trinkPrograma(b.dataset.id, b.dataset.vardas));
}

async function sukurkPrograma(ev) {
  ev.preventDefault();
  const pavadinimas = $('#p-pavadinimas').value.trim();
  if (!pavadinimas) {
    pranesk($('#pranesimas'), 'Įrašyk programos pavadinimą.', 'error');
    return;
  }

  const { data: nauja, error } = await db
    .from('programs')
    .insert({ title: pavadinimas, summary: $('#p-aprasas').value.trim() })
    .select('id')
    .single();

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  location.href = 'redaguoti.html?id=' + encodeURIComponent(nauja.id);
}

async function trinkPrograma(id, vardas) {
  // Dienos ir pratimai turi on delete cascade ryšį su programa. Klientų
  // kopijos (client_programs) nuo šablono nepriklauso — program_id ten tik
  // paliekamas tuščias, o kliento kopija ir jos istorija lieka nepaliesta.
  if (!confirm(`Ištrinti programą "${vardas}"?\n\nKartu dings jos dienos ir pratimai. Klientams jau priskirtos kopijos ir jų įrašyta treniruočių istorija liks nepaliestos. To atstatyti nebus galima.`)) return;

  const { error } = await db.from('programs').delete().eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Programa ištrinta.', 'ok');
  await perkrauk();
}

/** Paketo žyma klientų ir kvietimų lentelėse — viena vieta trims tipams. */
function paketoText(planType) {
  if (planType === 'tik_programa') return 'Tik programa';
  if (planType === 'tik_uzduotys') return 'Tik užduotys';
  return 'Pilnas';
}

// =============================================================================
//  KLIENTAI
// =============================================================================
function piesKlientus() {
  const klientai = profiliai.filter((p) => p.id !== savasId);

  const eilutes = klientai.map((k) => {
    const savos = priskyrimai.filter((a) => a.client_id === k.id && a.status === 'active');
    const paskutinisIrasas = treniruociuIrasai.find((i) => i.client_id === k.id);

    return `
      <tr>
        <td>
          <a href="klientas.html?id=${esc(k.id)}" style="font-weight:700;text-decoration:underline">${esc(k.full_name || 'Be vardo')}</a>
          <div class="muted" style="font-size:.8125rem">${esc(k.email || '')}</div>
          ${k.phone ? `<div class="muted" style="font-size:.8125rem">${esc(k.phone)}</div>` : ''}
        </td>
        <td data-label="Būsena"><span class="chip ${k.status === 'active' ? 'chip-ok' : k.status === 'blocked' ? 'chip-danger' : 'chip-quiet'}">${esc(BUSENOS[k.status] || k.status)}</span></td>
        <td data-label="Paketas"><span class="chip chip-quiet">${paketoText(k.plan_type)}</span></td>
        <td data-label="Programos">${savos.length
          ? savos.map((a) => `
              <div>
                <a href="istorija.html?id=${esc(a.id)}">${esc(a.title)}</a>
                <button class="btn-link redaguoti-pratimus-tiesiai" type="button" data-id="${esc(a.id)}">redaguoti</button>
              </div>`).join('')
          : '<span class="muted">nėra</span>'}</td>
        <td data-label="Paskutinė treniruotė">${paskutinisIrasas ? esc(data(paskutinisIrasas.logged_at)) : '<span class="muted">nėra</span>'}</td>
        <td data-label="">
          <div class="row">
            <a class="btn btn-primary btn-sm" href="klientas.html?id=${esc(k.id)}">Profilis</a>
            ${k.status === 'blocked'
              ? `<button class="btn btn-ghost btn-sm busena" type="button" data-id="${esc(k.id)}" data-busena="active">Grąžinti prieigą</button>`
              : `<button class="btn btn-danger btn-sm busena" type="button" data-id="${esc(k.id)}" data-busena="blocked">Sustabdyti</button>`}
          </div>
        </td>
      </tr>`;
  }).join('');

  $('#kortele-klientai').innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2>Klientai</h2>
        <span class="row-end muted">${klientai.length}</span>
      </div>
      <p class="muted" style="margin-bottom:var(--s-200)">
        Programos priskiriamos programos redagavimo lange, skiltyje Priskyrimai. Užduotys ir programų
        tvarkymas — kliento profilyje.
      </p>
      ${klientai.length ? `
        <div class="table-wrap table-kortelese">
          <table>
            <thead><tr><th>Žmogus</th><th>Būsena</th><th>Paketas</th><th>Programos</th><th>Paskutinė treniruotė</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Klientų dar nėra. Sukurk kvietimą skiltyje Kvietimai.</p>'}
    </div>

    <div id="klientu-programu-detale"></div>
    <div id="klientu-pratimu-detale"></div>

    <div class="card" style="margin-top:var(--s-300)">
      <p class="muted" style="font-size:.875rem;margin:0">
        Trenerio teisės suteikiamos tik per Supabase SQL redaktorių, iš šio puslapio to padaryti negalima.
        Taip klientas niekada negali pasikelti sau teisių.
      </p>
    </div>`;

  for (const b of $$('.busena')) {
    b.addEventListener('click', () => keiskBusena(b.dataset.id, b.dataset.busena));
  }
  for (const b of $$('.redaguoti-pratimus-tiesiai')) {
    b.addEventListener('click', () => redaguokKlientoPratimus(b.dataset.id));
  }
}

async function keiskBusena(id, busena) {
  // Būsena keičiama per funkciją, o ne tiesiogiai: status stulpelio rašymo
  // teisių neturi net treneris, kad klientas negalėtų atblokuoti savęs pats.
  const { error } = await db.rpc('admin_set_status', { p_client: id, p_status: busena });
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), busena === 'blocked' ? 'Prieiga sustabdyta.' : 'Prieiga grąžinta.', 'ok');
  await perkrauk();
}

// Kliento visos programos kopijos (aktyvios ir baigtos), su galimybe
// nereikalingą (pvz. bandomąją) visam laikui ištrinti. Tai skiriasi nuo
// "Atimti" priskyrimų skiltyje — ten tik pažymima 'finished' ir istorija
// lieka, o čia eilutė (ir per cascade jos dienos/pratimai/įrašai) dingsta.
function rodykKlientoProgramas(clientId) {
  const klientas = profiliai.find((p) => p.id === clientId);
  if (!klientas) return;
  const savos = priskyrimai.filter((a) => a.client_id === clientId)
    .sort((a, b) => new Date(b.assigned_at) - new Date(a.assigned_at));

  const eilutes = savos.map((a) => `
    <tr>
      <td>${esc(a.title)}</td>
      <td data-label="Būsena"><span class="chip ${a.status === 'active' ? 'chip-ok' : 'chip-quiet'}">${a.status === 'active' ? 'Aktyvi' : a.status === 'finished' ? 'Baigta' : esc(a.status)}</span></td>
      <td data-label="Pradžia">${a.starts_on ? esc(data(a.starts_on)) : esc(data(a.assigned_at))}</td>
      <td data-label="">
        <div class="row">
          <a class="btn btn-ghost btn-sm" href="istorija.html?id=${encodeURIComponent(a.id)}">Istorija</a>
          <button class="btn btn-ghost btn-sm redaguoti-kliento-pratimus" type="button" data-id="${esc(a.id)}">Pratimai</button>
          <button class="btn btn-ghost btn-sm pervadinti-kliento-programa" type="button" data-id="${esc(a.id)}" data-vardas="${esc(a.title)}">Pervadinti</button>
          <button class="btn btn-danger btn-sm trinti-kliento-programa" type="button" data-id="${esc(a.id)}" data-vardas="${esc(a.title)}">Trinti</button>
        </div>
      </td>
    </tr>`).join('');

  $('#klientu-programu-detale').innerHTML = `
    <div class="card" style="margin-top:var(--s-300)">
      <div class="card-head">
        <h2>${esc(klientas.full_name || klientas.email)} — programos</h2>
        <span class="row-end muted">${savos.length}</span>
      </div>
      ${savos.length ? `
        <div class="table-wrap table-kortelese">
          <table>
            <thead><tr><th>Programa</th><th>Būsena</th><th>Pradžia</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Programų nėra.</p>'}
    </div>`;

  for (const b of $$('.trinti-kliento-programa')) {
    b.addEventListener('click', () => trinkKlientoPrograma(b.dataset.id, b.dataset.vardas, clientId));
  }
  for (const b of $$('.redaguoti-kliento-pratimus')) {
    b.addEventListener('click', () => redaguokKlientoPratimus(b.dataset.id));
  }
  for (const b of $$('.pervadinti-kliento-programa')) {
    b.addEventListener('click', () => pervadinkKlientoPrograma(b.dataset.id, b.dataset.vardas, clientId));
  }
  $('#klientu-programu-detale').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/** Pervadinimas nepaliečia client_days/client_exercises/exercise_logs —
 * tik pačios kopijos pavadinimo, tad kliento istorija nenukenčia. */
async function pervadinkKlientoPrograma(id, senasPavadinimas, clientId) {
  const naujas = prompt('Naujas programos pavadinimas:', senasPavadinimas);
  if (naujas === null) return;
  const apkarpytas = naujas.trim();
  if (!apkarpytas || apkarpytas === senasPavadinimas) return;

  const { error } = await db.from('client_programs').update({ title: apkarpytas }).eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Pavadinimas atnaujintas.', 'ok');
  await perkrauk();
  rodykKlientoProgramas(clientId);
}

// =============================================================================
//  KLIENTO PRISKIRTOS PROGRAMOS KOPIJOS TAISYMAS
//  Priskyrimo metu kliento kopija "sušąla" — vėlesni šablono pakeitimai jos
//  nebepasiekia. Čia leidžiama taisyti patį kliento egzempliorių (pratimų
//  laukus, tvarką, dienos pavadinimą, pridėti ar ištrinti pratimą), be viso
//  priskyrimo kartojimo, kuris sukurtų naują kopiją ir nutrauktų ryšį su jau
//  įrašyta istorija — kiti klientai ir šablonas lieka nepaliesti.
// =============================================================================
async function redaguokKlientoPratimus(clientProgramId) {
  redaguojamosKlientoProgramosId = clientProgramId;
  redaguojamosKlientoDienosId = null;
  redaguojamoKlientoPratimoId = null;
  pridedamosKlientoDienosId = null;
  await ikelkIrPiesKlientoPratimus();
}

async function ikelkIrPiesKlientoPratimus() {
  const vieta = $('#klientu-pratimu-detale');
  vieta.innerHTML = '<div class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>';
  vieta.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const clientProgramId = redaguojamosKlientoProgramosId;
  const { data: dienos, error: dKlaida } = await db
    .from('client_days').select('id, title, notes, position').eq('client_program_id', clientProgramId).order('position', { ascending: true });
  if (dKlaida) {
    vieta.innerHTML = `<div class="note note-error">${esc(klaidaLT(dKlaida))}</div>`;
    return;
  }
  klientoDienos = dienos || [];

  const dienuId = klientoDienos.map((d) => d.id);
  const { data: pratimai, error: pKlaida } = dienuId.length
    ? await db.from('client_exercises').select('*').in('client_day_id', dienuId).order('position', { ascending: true })
    : { data: [] };
  if (pKlaida) {
    vieta.innerHTML = `<div class="note note-error">${esc(klaidaLT(pKlaida))}</div>`;
    return;
  }
  klientoPratimai = pratimai || [];

  piesKlientoPratimus();
}

      </p>
      ${klientoDienos.map((d) => {

/** Paslepia arba vėl parodo klientui vieną jo programos pratimą, nieko
 * netrindama — eilutė ir visa jos exercise_logs istorija lieka, tik
 * programa.html jos nebeberodo kaip einamo pratimo. Žr. supabase/
 * pratimo-slepimas.sql. */
async function keiskKlientoPratimoMatoma(id, slepti) {
  const { error } = await db.from('client_exercises').update({ is_hidden: slepti }).eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  const p = klientoPratimai.find((x) => x.id === id);
  if (p) p.is_hidden = slepti;
  piesKlientoPratimus();
}

async function pridekKlientoPratima(ev) {
  ev.preventDefault();
  const forma = ev.currentTarget;
  const dienaId = forma.dataset.diena;
  const fd = new FormData(forma);
  const pavadinimas = String(fd.get('title') || '').trim();

  if (!pavadinimas) {
    pranesk($('#pranesimas'), 'Įrašyk pratimo pavadinimą.', 'error');
    return;
  }

  // Skaičiuojame pagal didžiausią esamą position, ne pagal kiekį — jei
  // tarp esamų pratimų jau yra spraga (pvz. vienas ištrintas viduryje),
  // vien kiekis duotų tą pačią position reikšmę, kaip jau turi kitas
  // pratimas.
  const siejePratimai = klientoPratimai.filter((p) => p.client_day_id === dienaId);
  const naujaPozicija = siejePratimai.length ? Math.max(...siejePratimai.map((p) => p.position)) + 1 : 0;

  const { error } = await db.from('client_exercises').insert({
    client_day_id: dienaId,
    title: pavadinimas,
    target_sets: fd.get('sets') ? Number(fd.get('sets')) : null,
    target_reps: String(fd.get('reps') || '').trim() || null,
    target_load: String(fd.get('load') || '').trim() || null,
    rest_seconds: fd.get('rest') ? Number(fd.get('rest')) : null,
    notes: String(fd.get('notes') || '').trim(),
    video_url: String(fd.get('video') || '').trim() || null,
    superset_with_previous: fd.get('superset') === 'on',
    log_type: String(fd.get('log_type') || 'svoris'),
    position: naujaPozicija,
  });

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pridedamosKlientoDienosId = null;
  pranesk($('#pranesimas'), 'Pratimas pridėtas.', 'ok');
  await ikelkIrPiesKlientoPratimus();
}

async function trinkKlientoPratima(id, vardas) {
  if (!confirm(`Ištrinti pratimą "${vardas}" iš šio kliento programos?\n\nKliento jau įrašyta šio pratimo istorija (setai) dings kartu. To atstatyti nebus galima.`)) return;

  const { error } = await db.from('client_exercises').delete().eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Pratimas ištrintas.', 'ok');
  await ikelkIrPiesKlientoPratimus();
}

async function perkelkKlientoPratima(pratimoId, kryptis) {
  const p = klientoPratimai.find((x) => x.id === pratimoId);
  if (!p) return;
  const savi = klientoPratimai.filter((x) => x.client_day_id === p.client_day_id).sort((a, b) => a.position - b.position);
  const i = savi.findIndex((x) => x.id === pratimoId);
  const j = i + kryptis;
  if (j < 0 || j >= savi.length) return;

  [savi[i], savi[j]] = [savi[j], savi[i]];
  const tvarkaId = savi.map((x) => x.id);

  const atnaujinimai = tvarkaId.map((id, idx) => db.from('client_exercises').update({ position: idx }).eq('id', id));
  const rezultatai = await Promise.all(atnaujinimai);
  const klaida = rezultatai.find((r) => r.error)?.error;
  if (klaida) {
    pranesk($('#pranesimas'), klaidaLT(klaida), 'error');
    return;
  }
  tvarkaId.forEach((id, idx) => {
    const x = klientoPratimai.find((y) => y.id === id);
    if (x) x.position = idx;
  });
  // Pačių .position reikšmių pakeitimo neužtenka — piešimas filtruoja
  // masyvą jo DABARTINE tvarka, ne pagal position, tad be perrikiavimo
  // mygtukai atnaujintų duomenų bazę, bet ekranas liktų nepasikeitęs.
  klientoPratimai.sort((a, b) => a.position - b.position);
  piesKlientoPratimus();
}

async function trinkKlientoPrograma(id, vardas, clientId) {

    return;
  }
  pranesk($('#pranesimas'), 'Programa ištrinta.', 'ok');

  rodykKlientoProgramas(clientId);
}

function kvietimoNuoroda(token) {
  return absoliutus('registracija.html') + '?kvietimas=' + encodeURIComponent(token);
}

async function sukurkKvietima(ev) {
  ev.preventDefault();

  const dienos = Number($('#k-galioja').value);
  const galioja = Number.isFinite(dienos) && dienos > 0
    ? new Date(Date.now() + dienos * 24 * 60 * 60 * 1000).toISOString()
    : null;

  const token = atsitiktinis(36);

  const { error } = await db.from('invites').insert({
    token,
    email: $('#k-pastas').value.trim() || null,
    full_name: $('#k-vardas').value.trim() || null,
    note: $('#k-pastaba').value.trim() || null,
    expires_at: galioja,
    plan_type: $('#k-paketas').value,
  });

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }

  const nuoroda = kvietimoNuoroda(token);
  const langelis = $('#nauja-nuoroda');
  langelis.hidden = false;
  langelis.innerHTML = `
    <div class="note note-ok">
      <strong>Kvietimas paruoštas.</strong> Nusiųsk šią nuorodą žmogui.
      <div class="field" style="margin-top:var(--s-200)">
        <input id="nuorodos-laukas" type="text" readonly value="${esc(nuoroda)}">
      </div>
      <div class="form-actions" style="margin-top:var(--s-200)">
        <button class="btn btn-ghost btn-sm" type="button" id="kopijuoti-nauja">Kopijuoti</button>
      </div>
    </div>`;

  $('#kopijuoti-nauja').addEventListener('click', (e) => kopijuok(e.currentTarget, nuoroda));
  $('#forma-kvietimas').reset();
  $('#k-galioja').value = '30';

  await perkrauk();
  // perkrauk perpiešia kortelę, todėl nuorodą parodome dar kartą.
  const naujas = $('#nauja-nuoroda');
  naujas.hidden = false;
  naujas.innerHTML = langelis.innerHTML;
  $('#kopijuoti-nauja').addEventListener('click', (e) => kopijuok(e.currentTarget, nuoroda));
}

async function kopijuok(mygtukas, tekstas) {
  const senas = mygtukas.textContent;
  try {
    await navigator.clipboard.writeText(tekstas);
    mygtukas.textContent = 'Nukopijuota';
    setTimeout(() => { mygtukas.textContent = senas; }, 1800);
    return;
  } catch {
    // Kai kurios naršyklės neleidžia rašyti į iškarpinę be papildomo leidimo.
    // Tada parodome būtent šios eilutės nuorodą ir ją pažymime, kad žmogus
    // galėtų nukopijuoti ranka.
    let laukas = mygtukas.parentElement?.querySelector('.rankinis-laukas');
    if (!laukas) {
      laukas = document.createElement('input');
      laukas.type = 'text';
      laukas.readOnly = true;
      laukas.className = 'rankinis-laukas';
      laukas.style.cssText = 'width:100%;margin-top:8px;font-size:.8125rem;padding:6px 8px;border:1px solid rgba(16,16,16,.2);border-radius:6px';
      mygtukas.parentElement?.appendChild(laukas);
    }
    laukas.value = tekstas;
    laukas.select();
    mygtukas.textContent = 'Kopijuok ranka';
  }
  setTimeout(() => { mygtukas.textContent = senas; }, 3000);
}

  }
  for (const f of $$('.forma-redaguoti-biblioteka')) f.addEventListener('submit', issaugokBibliotekosRedagavima);
  for (const b of $$('.trinti-biblioteka')) {
    b.addEventListener('click', () => trinkBibliotekosIrasa(b.dataset.id, b.dataset.vardas));
  }

  $('#forma-biblioteka')?.addEventListener('submit', prideBibliotekosIrasa);
}

function bibliotekosRedagavimoForma(irasas) {
  return `
    <form class="pratimo-eilute forma-redaguoti-biblioteka forma-kliento-pratimas" data-id="${esc(irasas.id)}" novalidate style="flex-direction:column;align-items:stretch;gap:var(--s-200)">
      <div class="field-row">
        <div class="field">
          <label for="rb-pavadinimas-${esc(irasas.id)}">Pavadinimas</label>
          <input id="rb-pavadinimas-${esc(irasas.id)}" name="title" type="text" required value="${esc(irasas.title)}">
        </div>
        <div class="field">
          <label for="rb-kategorija-${esc(irasas.id)}">Kategorija</label>
          <input id="rb-kategorija-${esc(irasas.id)}" name="category" type="text" value="${esc(irasas.category || '')}">
        </div>
      </div>
      <div class="field">
        <label for="rb-aprasas-${esc(irasas.id)}">Aprašas</label>
        <textarea id="rb-aprasas-${esc(irasas.id)}" name="description">${esc(irasas.description || '')}</textarea>
      </div>
      <div class="field">
        <label for="rb-nuoroda-${esc(irasas.id)}">Nuoroda</label>
        <input id="rb-nuoroda-${esc(irasas.id)}" name="url" type="url" value="${esc(irasas.external_url || '')}">
      </div>
      ${irasas.file_path ? '<p class="hint">Failo pakeisti čia negalima — ištrink įrašą ir pridėk iš naujo su nauju failu.</p>' : ''}
      <div class="form-actions">
        <button class="btn btn-primary btn-sm" type="submit">Išsaugoti</button>
        <button class="btn btn-ghost btn-sm atsaukti-biblioteka" type="button">Atšaukti</button>
      </div>
    </form>`;
}

async function prideBibliotekosIrasa(ev) {
  ev.preventDefault();
  const forma = ev.currentTarget;
  const btn = ev.submitter;
  const fd = new FormData(forma);
  const pavadinimas = String(fd.get('title') || '').trim();
  const nuoroda = String(fd.get('url') || '').trim();
  const failas = $('#b-failas')?.files?.[0] || null;

  if (!pavadinimas) {
    pranesk($('#pranesimas'), 'Įrašyk pavadinimą.', 'error');
    return;
  }
  if (!failas && !nuoroda) {
    pranesk($('#pranesimas'), 'Pridėk failą arba nuorodą.', 'error');
    return;
  }
  if (nuoroda && !/^https:\/\//i.test(nuoroda)) {
    pranesk($('#pranesimas'), 'Nuoroda turi prasidėti https://.', 'error');
    return;
  }
  if (failas && failas.size > BIBLIOTEKOS_MAX_MB * 1024 * 1024) {
    pranesk($('#pranesimas'), `Failas per didelis — riba ${BIBLIOTEKOS_MAX_MB} MB.`, 'error');
    return;
  }

  if (btn?.disabled) return;
  if (btn) btn.disabled = true;

  let kelias = null;
  if (failas) {
    try {
      kelias = await ikelkBibliotekosFaila(failas);
    } catch (err) {
      pranesk($('#pranesimas'), klaidaLT(err), 'error');
      if (btn) btn.disabled = false;
      return;
    }
  }

  const { error } = await db.from('library_items').insert({
    title: pavadinimas,
    description: String(fd.get('description') || '').trim(),
    category: String(fd.get('category') || '').trim(),
    file_path: kelias,
    external_url: nuoroda || null,
    position: biblioteka.length,
  });

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    if (btn) btn.disabled = false;
    return;
  }
  pranesk($('#pranesimas'), 'Įrašas pridėtas.', 'ok');
  await perkrauk();
}

async function issaugokBibliotekosRedagavima(ev) {
  ev.preventDefault();
  const forma = ev.currentTarget;
  const id = forma.dataset.id;
  const fd = new FormData(forma);
  const pavadinimas = String(fd.get('title') || '').trim();
  const nuoroda = String(fd.get('url') || '').trim();
  const irasas = biblioteka.find((b) => b.id === id);

  if (!pavadinimas) {
    pranesk($('#pranesimas'), 'Įrašyk pavadinimą.', 'error');
    return;
  }
  if (!irasas?.file_path && !nuoroda) {
    pranesk($('#pranesimas'), 'Įrašas turi turėti failą arba nuorodą.', 'error');
    return;
  }
  if (nuoroda && !/^https:\/\//i.test(nuoroda)) {
    pranesk($('#pranesimas'), 'Nuoroda turi prasidėti https://.', 'error');
    return;
  }

  const btn = ev.submitter;
  if (btn?.disabled) return;
  if (btn) btn.disabled = true;

  const { error } = await db.from('library_items').update({
    title: pavadinimas,
    category: String(fd.get('category') || '').trim(),
    description: String(fd.get('description') || '').trim(),
    external_url: nuoroda || null,
  }).eq('id', id);

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    if (btn) btn.disabled = false;
    return;
  }
  redaguojamoBibliotekosIrasoId = null;
  pranesk($('#pranesimas'), 'Įrašas atnaujintas.', 'ok');
  await perkrauk();
}

async function trinkBibliotekosIrasa(id, vardas) {
  if (!confirm(`Ištrinti įrašą "${vardas}"?`)) return;
  const irasas = biblioteka.find((b) => b.id === id);
  const { error } = await db.from('library_items').delete().eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  if (irasas?.file_path) await trinkBibliotekosFaila(irasas.file_path);
  await perkrauk();
}

async function perkelkBibliotekosIrasa(id, kryptis) {
  const surikiuota = [...biblioteka].sort((a, b) => a.position - b.position);
  const idx = surikiuota.findIndex((b) => b.id === id);
  const naujasIdx = idx + kryptis;
  if (idx < 0 || naujasIdx < 0 || naujasIdx >= surikiuota.length) return;

  [surikiuota[idx], surikiuota[naujasIdx]] = [surikiuota[naujasIdx], surikiuota[idx]];

  const atnaujinimai = surikiuota.map((b, i) => db.from('library_items').update({ position: i }).eq('id', b.id));
  const rezultatai = await Promise.all(atnaujinimai);
  const klaida = rezultatai.find((r) => r.error)?.error;
  if (klaida) {
    pranesk($('#pranesimas'), klaidaLT(klaida), 'error');
    return;
  }
  surikiuota.forEach((b, i) => { b.position = i; });
  biblioteka = surikiuota;
  piesBiblioteka();
}

// =============================================================================
//  ATSILIEPIMAI — klientų iš zona/atsiliepimas.html pateikti atsiliepimai,
//  rodomi viešai pagrindiniame puslapyje tik po trenerio patvirtinimo.
// =============================================================================
function piesAtsiliepimus() {
  if (!atsiliepimai.length) {
    $('#kortele-atsiliepimai').innerHTML = `
      <div class="card"><p class="muted">Atsiliepimų dar nėra — klientai juos rašo skiltyje „Atsiliepimas“ savo zonoje.</p></div>`;
    return;
  }

  const laukiantys = atsiliepimai.filter((a) => a.status === 'pending');
  const paskelbti   = atsiliepimai.filter((a) => a.status === 'published');
  const atmesti     = atsiliepimai.filter((a) => a.status === 'rejected');

  const grupe = (pavadinimas, sarasas) => sarasas.length ? `
    <div class="card-head" style="margin-top:var(--s-400)"><h2>${esc(pavadinimas)}</h2><span class="row-end muted">${sarasas.length}</span></div>
    <div style="display:flex;flex-direction:column;gap:var(--s-200)">
      ${sarasas.map(atsiliepimoKortele).join('')}
    </div>` : '';

  $('#kortele-atsiliepimai').innerHTML = `
    ${grupe('Laukia patvirtinimo', laukiantys)}
    ${grupe('Paskelbti', paskelbti)}
    ${grupe('Atmesti', atmesti)}`;

  for (const b of $$('.patvirtinti-atsiliepima')) {
    b.addEventListener('click', () => keiskAtsiliepimoBusena(b.dataset.id, 'published'));
  }
  for (const b of $$('.atmesti-atsiliepima')) {
    b.addEventListener('click', () => keiskAtsiliepimoBusena(b.dataset.id, 'rejected'));
  }
  for (const b of $$('.atsaukti-paskelbima')) {
    b.addEventListener('click', () => keiskAtsiliepimoBusena(b.dataset.id, 'pending'));
  }
  for (const b of $$('.trinti-atsiliepima')) {
    b.addEventListener('click', () => trinkAtsiliepima(b.dataset.id));
  }
}

function atsiliepimoKortele(a) {
  const klientas = profiliai.find((p) => p.id === a.client_id);
  const vardas = klientas?.full_name?.trim() || klientas?.email || 'Buvęs klientas';
  const zvaigzdutes = '★'.repeat(a.rating) + '☆'.repeat(5 - a.rating);
  const nuorodos = atsiliepimoNuotraukuUrl(a.photo_paths || []);

  const veiksmai = a.status === 'pending'
    ? `<button class="btn btn-primary btn-sm patvirtinti-atsiliepima" type="button" data-id="${esc(a.id)}">Patvirtinti</button>
       <button class="btn btn-ghost btn-sm atmesti-atsiliepima" type="button" data-id="${esc(a.id)}">Atmesti</button>`
    : a.status === 'published'
      ? `<button class="btn btn-ghost btn-sm atsaukti-paskelbima" type="button" data-id="${esc(a.id)}">Atšaukti paskelbimą</button>`
      : `<button class="btn btn-ghost btn-sm patvirtinti-atsiliepima" type="button" data-id="${esc(a.id)}">Paskelbti vis tiek</button>`;

  return `
    <div class="card">
      <div class="card-head">
        <h3 style="margin:0">${esc(vardas)}</h3>
        <span class="row-end muted">${esc(data(a.created_at))}</span>
      </div>
      <p aria-label="${a.rating} iš 5 žvaigždučių" style="font-size:1.25rem;letter-spacing:2px;color:var(--volt);margin-top:4px">${zvaigzdutes}</p>
      <p style="margin-top:var(--s-100);white-space:pre-wrap">${esc(a.body)}</p>
      ${nuorodos.length ? `
        <div class="nuotrauku-galerija">
          ${nuorodos.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Atsiliepimo nuotrauka" loading="lazy"></a>`).join('')}
        </div>` : ''}
      <div class="form-actions">
        ${veiksmai}
        <button class="btn btn-danger btn-sm trinti-atsiliepima" type="button" data-id="${esc(a.id)}">Trinti</button>
      </div>
    </div>`;
}

async function keiskAtsiliepimoBusena(id, busena) {
  const laukai = { status: busena };
  if (busena === 'published') laukai.published_at = new Date().toISOString();
  const { error } = await db.from('testimonials').update(laukai).eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  await perkrauk();
}

async function trinkAtsiliepima(id) {
  if (!confirm('Ištrinti šį atsiliepimą?')) return;
  const irasas = atsiliepimai.find((a) => a.id === id);
  const { error } = await db.from('testimonials').delete().eq('id', id);
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  for (const kelias of irasas?.photo_paths || []) await trinkAtsiliepimoNuotrauka(kelias);
  await perkrauk();
}
</script>
