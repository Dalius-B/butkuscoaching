</main>

<dialog id="video-dialogas" aria-labelledby="video-antraste">

    <div class="video-wrap" id="video-vieta"></div>
    <div class="form-actions">
      <a class="btn btn-ghost btn-sm" id="video-nuoroda" href="#" target="_blank" rel="noopener"></a>

    </div>

</dialog>

<footer class="foot">

    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script>
// Apsauga nuo "amžino" kraunasi: jei po kelių sekundžių puslapis vis dar
// rodo tik įkrovimo ratuką (pvz. telefono naršyklė pasiėmė pusiau senus
// failus), parodome paaiškinimą ir mygtuką, kuris įkelia naujausią versiją.
setTimeout(function () {
  var v = document.getElementById('turinys-vidus');
  if (!v || !v.querySelector('.loading')) return;
  v.innerHTML = '<div class="note note-error">Puslapis neįsikėlė iki galo. Dažniausiai taip nutinka, kai telefonas rodo seną versiją.'
    + ' Paspausk mygtuką. Jei nepadeda, atidaryk nuorodą naršyklėje (Chrome ar Safari), o ne Messenger ar kitoje programėlėje.</div>'
    + '<div class="form-actions"><button class="btn btn-primary" type="button" id="perkrauti">Įkelti iš naujo</button></div>';
  document.getElementById('perkrauti').addEventListener('click', function () {
    location.replace(location.pathname + '?naujas=' + Date.now());
  });
}, 10000);
</script>
<script type="module">
import {
  db, $, $$, esc, klaidaLT, reikiaSesijos, rodykNav, panaudokLaukiantiKvietima,
} from './app.js?v=20261114';
import {
  T, KATEGORIJOS, SAVAITES_DIENOS, dataSuDiena, dataTrumpa,
} from './tekstai.js?v=20261114';
import {
  siandienLT, privalomosDienai, papildomosDienai, apskaiciuok, tikslas, videoIterpimas,
  savaitesPazanga, savaitesPirmadienis, savaitesDiena, pridek,
} from './uzduociu-logika.js?v=20261114';

const vidus = $('#turinys-vidus');
let siandien = siandienLT();
let paskutinisKrovimas = 0;

let profilis = null;
let uzduotys = [];
let atlikimai = [];
let uzrasai = [];            // nuotaikos ir trenerio žinutės (paskutinės dienos)
let nuotaikaVeikia = true;   // false, jei lentelės dar nėra (SQL nepaleistas)
let laikinasTekstas = null;  // dar neišsaugotas nuotaikos tekstas, kad jo nepaliktų perpiešiant
let nuotaikaBusena = '';
let atsakymasAtidarytas = false;  // ar atidarytas atsakymo Daliui laukas
let atsakymoTekstas = '';     // 'issaugota' | 'klaida' | ''
let sesijosId = null;
let bukle = false; // ar šiuo metu vyksta įrašymas
let toastLaikas = null;

paleisk();

async function paleisk() {
  const s = await reikiaSesijos();
  if (!s) return;
  profilis = s.profilis;
  // Naujas klientas, kurio kvietimas dar nepanaudotas, aktyvuojamas čia.
  if (await panaudokLaukiantiKvietima(profilis)) {
    const { data: naujas } = await db.from('profiles')
      .select('id, email, full_name, phone, status, plan_type, uzduotys_ijungtos, created_at')
      .eq('id', s.vartotojas.id).maybeSingle();
    if (naujas) profilis = naujas;
  }
  sesijosId = s.vartotojas.id;
  rodykNav(profilis, 'uzduotys.html', s.arTreneris);

  if (s.klaida) {
    vidus.innerHTML = `<div class="note note-error">${esc(klaidaLT(s.klaida))}</div>`;
    return;
  }
  // Treneris užduotis tvarko valdymo skydelyje, o ne čia.
  if (s.arTreneris) { location.replace('valdymas.html'); return; }
  // Privati skiltis: neįjungtas klientas grąžinamas į savo programą.
  if (!profilis?.uzduotys_ijungtos) {
    vidus.innerHTML = `
      <div class="empty">
        <h2>${esc(T.puslapis)}</h2>
        <p>${esc(T.neprieigos)}</p>
        <div class="form-actions" style="justify-content:center"><a class="btn btn-ghost" href="mano.html">Mano programa</a></div>
      </div>`;
    return;
  }

  if (profilis.status === 'pending') {
    vidus.innerHTML = `
      <div class="empty">
        <h2>Paskyra dar nepatvirtinta</h2>
        <p>Kai tik Dalius patvirtins tavo paskyrą, čia atsiras užduotys. Jei tai užtrunka, parašyk jam.</p>
      </div>`;
    return;
  }

  await ikelk();
  // Telefone puslapis dažnai lieka atidarytas ištisas dienas. Sugrįžus prie jo
  // užduotys perkraunamos, kad matytųsi nauja diena ir naujos užduotys.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') atnaujink();
  });
  window.addEventListener('pageshow', (ev) => { if (ev.persisted) atnaujink(true); });
}

function atnaujink(butinai = false) {
  const kita = siandienLT();
  if (!butinai && kita === siandien && Date.now() - paskutinisKrovimas < 60000) return;
  if (bukle) return;
  siandien = kita;
  ikelk(true);
}

async function ikelk(tyliai = false) {
  const [u, a, n] = await Promise.all([
    db.from('client_challenges')
      .select('id, title, description, category, is_bonus, weekdays, active, position, created_at, target, unit, step, video_url')
      .eq('active', true)
      .order('position', { ascending: true })
      .order('created_at', { ascending: true }),
    db.from('challenge_completions')
      .select('id, challenge_id, day, xp, amount')
      .gte('day', pridek(siandien, -40))
      .order('day', { ascending: true }),
    db.from('day_notes')
      .select('*')
      .gte('day', pridek(siandien, -14))
      .order('day', { ascending: true }),
  ]);
  const klaida = u.error || a.error;
  if (klaida && tyliai) return; // fone nepavykęs atnaujinimas nieko neišvalo
  if (klaida) {
    vidus.innerHTML = `
      <div class="note note-error">${esc(klaidaLT(klaida))}</div>
      <div class="form-actions"><button class="btn btn-ghost" type="button" id="dar-karta">${esc(T.bandytiDarKarta)}</button></div>`;
    $('#dar-karta').addEventListener('click', () => { vidus.innerHTML = ''; ikelk(); });
    return;
  }
  uzduotys = u.data || [];
  atlikimai = a.data || [];
  // Nuotaikos lentelė gali dar neegzistuoti: tada tiesiog nerodome nuotaikos bloko.
  nuotaikaVeikia = !n.error;
  uzrasai = n.data || [];
  paskutinisKrovimas = Date.now();
  pieskVisa();
}

// -----------------------------------------------------------------------------
//  Piešimas
// -----------------------------------------------------------------------------
function pieskVisa() {
  const st = apskaiciuok(uzduotys, atlikimai, siandien);
  const reikia = privalomosDienai(uzduotys, siandien);
  const papildomos = papildomosDienai(uzduotys, siandien);
  const padaryta = reikia.filter((u) => st.padaryta(u, siandien)).length;
  const liko = reikia.length - padaryta;
  const diena = reikia.length > 0 && liko === 0;
  const vardas = profilis?.full_name?.trim().split(' ')[0] || '';

  // Juosta pildosi ir dalinai atliktomis užduotimis (pvz. 3 iš 10 stiklinių).
  const dalis = reikia.reduce((n, u) => n + Math.min(1, (st.kiekis.get(`${u.id}|${siandien}`) || 0) / tikslas(u)), 0);
  const procentas = reikia.length ? Math.round((dalis / reikia.length) * 100) : 0;

  let santrauka;
  if (!reikia.length && !papildomos.length) santrauka = '';
  else if (!reikia.length) santrauka = T.tikPapildomos;
  else if (diena) santrauka = T.visosAtliktos;
  else santrauka = T.darLiko(liko) + '.';

  const sav = savaitesPazanga(uzduotys, atlikimai, savaitesPirmadienis(siandien), siandien);
  const DIENU_TRUMP = ['Pr', 'An', 'Tr', 'Ke', 'Pe', 'Še', 'Se'];
  const savaitesTaskai = sav.dienos.map((x, i) => `
    <span class="sav-diena ${x.busena}${x.d === siandien ? ' siandien' : ''}" title="${esc(dataTrumpa(x.d))}">
      <span class="sav-zenklas" aria-hidden="true">${x.busena === 'pilna' ? '✓' : ''}</span>
      <span class="sav-pav">${DIENU_TRUMP[i]}</span>
    </span>`).join('');

  const hero = `
    <section class="uzd-hero" aria-labelledby="uzd-antraste">
      <p class="label">${esc(dataSuDiena(siandien))}</p>
      <h1 id="uzd-antraste">${esc(T.labas(vardas))}</h1>
      ${uzduotys.length ? `
      <div class="uzd-savaite">
        <div class="uzd-savaite-virsus">
          <span>${esc(T.sisSavaite)}</span>
          ${sav.proc !== null ? `<strong>${esc(T.savaiteProc(sav.proc))}</strong>` : ''}
        </div>
        ${sav.proc !== null ? `
          <div class="uzd-juosta uzd-juosta-didele" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${sav.proc}" aria-label="${esc(T.sisSavaite)}">
            <i style="width:${sav.proc}%"></i>
          </div>` : `<span class="uzd-mazas">${esc(T.savaiteNauja)}</span>`}
        <div class="sav-juosta" aria-hidden="false">${savaitesTaskai}</div>
      </div>` : ''}
    </section>`;

  const dienosBaneris = diena ? `
    <div class="uzd-baneris" role="status">
      <span class="uzd-baneris-ikona" aria-hidden="true">🎉</span>
      <div><strong>${esc(T.dienaBaigta)}</strong><span>${esc(T.visosAtliktos)}</span></div>
    </div>` : '';

  let siandienHtml;
  if (!uzduotys.length) {
    siandienHtml = `
      <div class="empty">
        <h2>${esc(T.tuscia)}</h2>
        <p>${esc(T.tusciaTekstas)}</p>
      </div>`;
  } else {
    siandienHtml = `
      <section class="card uzd-blokas" aria-labelledby="uzd-siandien">
        <div class="card-head">
          <h2 id="uzd-siandien">${esc(T.siandienosUzduotys)}</h2>
          ${reikia.length ? `<span class="row-end muted">${esc(T.atlikoIs(padaryta, reikia.length))}</span>` : ''}
        </div>
        ${reikia.length ? `
          <div class="uzd-juosta uzd-juosta-didele" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${procentas}" aria-label="${esc(T.pazanga)}">
            <i style="width:${procentas}%"></i>
          </div>
          <p class="muted uzd-santrauka">${esc(santrauka)}</p>
          <ul class="uzd-sarasas">${reikia.map((u) => uzduotiesEilute(u, st)).join('')}</ul>`
          : `<div class="empty" style="margin-top:var(--s-200)"><h2>${esc(T.poilsioDiena)}</h2><p>${esc(T.poilsioTekstas)}</p></div>`}
      </section>`;
  }

  const papildomosHtml = papildomos.length ? `
    <section class="card uzd-blokas" aria-labelledby="uzd-papildomos">
      <div class="card-head"><h2 id="uzd-papildomos">${esc(T.papildomosUzduotys)}</h2></div>
      <p class="muted" style="margin-bottom:var(--s-200)">${esc(T.papildomosPaaiskinimas)}</p>
      <ul class="uzd-sarasas">${papildomos.map((u) => uzduotiesEilute(u, st)).join('')}</ul>
    </section>` : '';

  vidus.innerHTML = `
    ${hero}
    ${dienosBaneris}
    <div class="uzd-vienas">
      ${zinuteHtml()}
      ${nuotaikaHtml()}
      ${siandienHtml}
      ${papildomosHtml}
      ${artimiausiosHtml()}
    </div>`;

  for (const b of $$('.uzd-mygtukas')) {
    b.addEventListener('click', () => keisk(b.dataset.id, 1));
  }
  for (const b of $$('.uzd-video')) {
    b.addEventListener('click', () => atidarykVideo(b.dataset.id));
  }
  for (const b of $$('.uzd-kiekio-mygtukas')) {
    b.addEventListener('click', () => keisk(b.dataset.id, Number(b.dataset.kryptis)));
  }
  for (const b of $$('.nuotaika-mygtukas')) {
    b.addEventListener('click', () => issaugokNuotaika({ mood: Number(b.dataset.v) }));
  }
  $('#zinute-perskaiciau')?.addEventListener('click', (e) => zinutesRpc('perskaiciau_zinute', { p_day: e.currentTarget.dataset.diena }, T.zinuteNebera));
  $('#zinute-atsakyti')?.addEventListener('click', () => { atsakymasAtidarytas = true; pieskVisa(); $('#zinute-atsakymo-tekstas')?.focus(); });
  $('#zinute-atsaukti')?.addEventListener('click', () => { atsakymasAtidarytas = false; atsakymoTekstas = ''; pieskVisa(); });
  $('#zinute-atsakymo-tekstas')?.addEventListener('input', (e) => { atsakymoTekstas = e.target.value; });
  $('#zinute-siusti')?.addEventListener('click', (e) => {
    const tekstas = ($('#zinute-atsakymo-tekstas').value || '').trim();
    if (!tekstas) { rodykToast(T.atsakymoLaukas, true); return; }
    zinutesRpc('atsakyti_treneriui', { p_day: e.currentTarget.dataset.diena, p_text: tekstas }, T.atsakymasIssiustas);
  });
  $('#nuotaika-tekstas')?.addEventListener('input', (e) => { laikinasTekstas = e.target.value; });
  $('#nuotaika-issaugoti')?.addEventListener('click', () => {
    issaugokNuotaika({ note: ($('#nuotaika-tekstas').value || '').trim() });
  });
}

// -----------------------------------------------------------------------------
//  Žinutė nuo trenerio, nuotaika, artimiausios dienos
// -----------------------------------------------------------------------------
function zinuteHtml() {
  // Naujausia dar neperskaityta trenerio žinutė per paskutines 7 dienas.
  const ribot = pridek(siandien, -7);
  const zinute = [...uzrasai].reverse().find((n) => n.coach_reply && !n.coach_reply_read_at && n.day >= ribot);
  if (!zinute) return '';
  return `
    <section class="uzd-zinute" aria-label="${esc(T.zinuteNuoDaliaus)}">
      <span class="uzd-zinute-ikona" aria-hidden="true">💬</span>
      <div class="uzd-zinute-turinys">
        <strong>${esc(T.zinuteNuoDaliaus)}</strong>
        <p>${esc(zinute.coach_reply)}</p>
        <span class="muted">${esc(dataTrumpa(zinute.day))}</span>
        ${atsakymasAtidarytas ? `
        <div class="uzd-zinute-atsakymas">
          <label for="zinute-atsakymo-tekstas" class="sr-only">${esc(T.atsakymoLaukas)}</label>
          <textarea id="zinute-atsakymo-tekstas" maxlength="300" rows="3" placeholder="${esc(T.atsakymoLaukas)}">${esc(atsakymoTekstas)}</textarea>
          <div class="uzd-zinute-veiksmai">
            <button class="btn btn-primary btn-sm" type="button" id="zinute-siusti" data-diena="${esc(zinute.day)}">${esc(T.atsakymasSiusti)}</button>
            <button class="btn btn-ghost btn-sm" type="button" id="zinute-atsaukti">Atšaukti</button>
          </div>
        </div>` : `
        <div class="uzd-zinute-veiksmai">
          <button class="btn btn-ghost btn-sm" type="button" id="zinute-perskaiciau" data-diena="${esc(zinute.day)}">${esc(T.perskaiciau)}</button>
          <button class="btn btn-ghost btn-sm" type="button" id="zinute-atsakyti">${esc(T.atsakyti)}</button>
        </div>`}
      </div>
    </section>`;
}

async function zinutesRpc(funkcija, argumentai, pavykus) {
  if (bukle) return;
  bukle = true;
  try {
    const { error } = await db.rpc(funkcija, argumentai);
    if (error) throw error;
    const eilute = uzrasai.find((n) => n.day === argumentai.p_day);
    if (eilute) {
      eilute.coach_reply_read_at = new Date().toISOString();
      if (funkcija === 'atsakyti_treneriui') eilute.client_reply = argumentai.p_text;
    }
    atsakymasAtidarytas = false;
    atsakymoTekstas = '';
    rodykToast(pavykus);
  } catch (klaida) {
    const trukstaFunkcijos = klaida?.code === 'PGRST202' || String(klaida?.message || '').includes('Could not find the function');
    rodykToast(trukstaFunkcijos ? T.funkcijaNeijungta : (klaidaLT(klaida) || T.klaidaIsaugoti), true);
  } finally {
    bukle = false;
  }
  pieskVisa();
}

function nuotaikaHtml() {
  if (!nuotaikaVeikia || !uzduotys.length) return '';
  const siandienos = uzrasai.find((n) => n.day === siandien);
  const mood = siandienos?.mood || 0;
  const tekstas = laikinasTekstas ?? siandienos?.note ?? '';
  const mygtukai = T.nuotaikos.map((n) => `
    <button class="nuotaika-mygtukas${mood === n.v ? ' pasirinkta' : ''}" type="button" data-v="${n.v}"
      aria-pressed="${mood === n.v}" aria-label="${esc(n.pavadinimas)}">
      <span class="nuotaika-ikona" aria-hidden="true">${n.ikona}</span>
      <span class="nuotaika-pav">${esc(n.pavadinimas)}</span>
    </button>`).join('');
  return `
    <section class="card uzd-blokas nuotaika" aria-labelledby="nuotaika-antraste">
      <h2 id="nuotaika-antraste">${esc(T.nuotaikaKlausimas)}</h2>
      <div class="nuotaika-eilute" role="group" aria-label="${esc(T.nuotaikaKlausimas)}">${mygtukai}</div>
      ${mood || tekstas ? `
      <div class="field" style="margin-top:var(--s-200)">
        <label for="nuotaika-tekstas" class="sr-only">${esc(T.nuotaikaTekstas)}</label>
        <textarea id="nuotaika-tekstas" maxlength="500" rows="3" placeholder="${esc(T.nuotaikaTekstas)}">${esc(tekstas)}</textarea>
      </div>
      <div class="nuotaika-veiksmai">
        <button class="btn btn-ghost btn-sm" type="button" id="nuotaika-issaugoti">${esc(T.nuotaikaIssaugoti)}</button>
        <span class="muted" aria-live="polite">${nuotaikaBusena === 'issaugota' ? esc(T.nuotaikaIssaugota) : nuotaikaBusena === 'klaida' ? esc(T.nuotaikaKlaida) : ''}</span>
      </div>` : ''}
    </section>`;
}

async function issaugokNuotaika(dalis) {
  if (bukle) return;
  bukle = true;
  nuotaikaBusena = '';
  const stulpeliai = '*';
  try {
    const keisti = (id) => db.from('day_notes').update(dalis).eq('id', id).select(stulpeliai).single();
    const esamas = uzrasai.find((n) => n.day === siandien && n.id);
    let atsakas;
    if (esamas) {
      atsakas = await keisti(esamas.id);
    } else {
      atsakas = await db.from('day_notes')
        .insert({ client_id: sesijosId, day: siandien, ...dalis })
        .select(stulpeliai).single();
      // Eilutė jau gali būti (pvz. treneris ką tik atsakė): tada ją tiesiog atnaujiname.
      if (atsakas.error?.code === '23505') {
        const { data: rasta } = await db.from('day_notes').select('id')
          .eq('client_id', sesijosId).eq('day', siandien).maybeSingle();
        if (rasta?.id) atsakas = await keisti(rasta.id);
      }
    }
    if (atsakas.error) throw atsakas.error;
    const irasas = atsakas.data;
    uzrasai = [...uzrasai.filter((n) => n.day !== siandien), irasas].sort((a, b) => a.day.localeCompare(b.day));
    if ('note' in dalis) laikinasTekstas = null;
    nuotaikaBusena = 'note' in dalis ? 'issaugota' : '';
    rodykToast(T.nuotaikaIssaugota);
  } catch (klaida) {
    nuotaikaBusena = 'klaida';
    console.warn('Nuotaikos klaida:', klaida);
    // Klaida visada matoma, net jei teksto laukas dar neatsidarė.
    rodykToast(T.nuotaikaKlaida, true);
  } finally {
    bukle = false;
  }
  pieskVisa();
}

function artimiausiosHtml() {
  if (!uzduotys.length) return '';
  const dienos = [];
  for (let i = 1; i <= 6; i += 1) {
    const d = pridek(siandien, i);
    const privalomos = privalomosDienai(uzduotys, d);
    const papild = papildomosDienai(uzduotys, d);
    dienos.push(`
      <div class="art-diena">
        <h3>${i === 1 ? `${esc(T.rytoj)}, ${esc(SAVAITES_DIENOS[savaitesDiena(d)].toLowerCase())}` : esc(SAVAITES_DIENOS[savaitesDiena(d)])} <span class="muted">${esc(dataTrumpa(d))}</span></h3>
        ${privalomos.length || papild.length ? `
        <ul>
          ${privalomos.map((u) => `<li>${esc(u.title)}</li>`).join('')}
          ${papild.map((u) => `<li class="muted">${esc(u.title)} <span class="chip chip-quiet">${esc(T.papildoma)}</span></li>`).join('')}
        </ul>` : `<p class="muted">${esc(T.poilsisZodis)}</p>`}
      </div>`);
  }
  return `
    <details class="card card-tight art-blokas">
      <summary>${esc(T.artimiausiosDienos)}</summary>
      <div class="art-dienos">${dienos.join('')}</div>
    </details>`;
}

const sk = (n) => Number(n).toLocaleString('lt-LT');

function kiekioTekstas(u, kiek) {
  return `${sk(kiek)} / ${sk(tikslas(u))}${u.unit ? ' ' + u.unit : ''}`;
}

function videoMygtukas(u) {
  if (!videoIterpimas(u.video_url)) return '';
  return `
      <div class="uzd-video-eilute">
        <button class="btn btn-ghost btn-sm uzd-video" type="button" data-id="${esc(u.id)}">&#9654; ${esc(T.zidetiVideo)}</button>
      </div>`;
}

function atidarykVideo(id) {
  const u = uzduotys.find((x) => x.id === id);
  const adresas = videoIterpimas(u?.video_url);
  if (!adresas) return;
  $('#video-antraste').textContent = u.title;
  $('#video-vieta').innerHTML = `<iframe src="${esc(adresas)}" title="${esc(u.title)}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  const nuoroda = $('#video-nuoroda');
  nuoroda.href = u.video_url;
  nuoroda.textContent = T.videoNaujameLange;
  $('#video-uzdaryti').textContent = T.uzdaryti;
  $('#video-dialogas').showModal();
}

const videoDialogas = $('#video-dialogas');
// Uždarius langą grotuvas pašalinamas, kad video nustotų groti.
videoDialogas.addEventListener('close', () => { $('#video-vieta').innerHTML = ''; });
$('#video-uzdaryti').addEventListener('click', () => videoDialogas.close());
videoDialogas.addEventListener('click', (ev) => { if (ev.target === videoDialogas) videoDialogas.close(); });

function uzduotiesEilute(u, st) {
  const kiek = st.kiekis.get(`${u.id}|${siandien}`) || 0;
  const padaryta = kiek >= tikslas(u);
  const kat = KATEGORIJOS[u.category] || KATEGORIJOS.iprociai;
  const zymos = `
    <span class="uzd-zymos">
      <span class="chip chip-quiet">${kat.ikona} ${esc(kat.pavadinimas)}</span>
      ${u.is_bonus ? `<span class="chip chip-volt">${esc(T.papildoma)}</span>` : ''}
      ${padaryta ? `<span class="chip chip-ok">${esc(T.atlikta)}</span>` : ''}
    </span>`;

  // Paprasta užduotis: vienas paspaudimas.
  if (tikslas(u) === 1) {
    return `
    <li class="uzd-eilute${padaryta ? ' padaryta' : ''}">
      <button class="uzd-mygtukas" type="button" data-id="${esc(u.id)}"
        aria-pressed="${padaryta}" aria-label="${esc(u.title + '. ' + (padaryta ? T.atsaukti : T.pazymeti))}">
        <span class="uzd-zenklas" aria-hidden="true">${padaryta ? '✓' : ''}</span>
        <span class="uzd-tekstas">
          <strong>${esc(u.title)}</strong>
          ${u.description ? `<span class="uzd-aprasas">${esc(u.description)}</span>` : ''}
          ${zymos}
        </span>
      </button>
      ${videoMygtukas(u)}
    </li>`;
  }

  // Užduotis su kiekiu: pridedama dalimis per dieną.
  const proc = Math.min(100, Math.round((kiek / tikslas(u)) * 100));
  const zingsnis = Math.min(u.step || 1, tikslas(u));
  return `
    <li class="uzd-eilute uzd-su-kiekiu${padaryta ? ' padaryta' : ''}">
      <div class="uzd-mygtukas uzd-mygtukas-kiekis">
        <span class="uzd-zenklas" aria-hidden="true">${padaryta ? '✓' : ''}</span>
        <span class="uzd-tekstas">
          <strong>${esc(u.title)}</strong>
          ${u.description ? `<span class="uzd-aprasas">${esc(u.description)}</span>` : ''}
          <span class="uzd-juosta uzd-juosta-didele uzd-juosta-maza" role="progressbar" aria-valuemin="0" aria-valuemax="${tikslas(u)}" aria-valuenow="${Math.min(kiek, tikslas(u))}" aria-label="${esc(u.title)}">
            <i style="width:${proc}%"></i>
          </span>
          <span class="uzd-kiekis-eilute">
            <button class="uzd-kiekio-mygtukas" type="button" data-id="${esc(u.id)}" data-kryptis="-1"
              aria-label="${esc(T.sumazinti + ': ' + u.title)}"${kiek <= 0 ? ' disabled' : ''}>−${zingsnis > 1 ? esc(sk(zingsnis)) : ''}</button>
            <span class="uzd-kiekis" aria-live="polite">${esc(kiekioTekstas(u, kiek))}</span>
            <button class="uzd-kiekio-mygtukas uzd-prideti" type="button" data-id="${esc(u.id)}" data-kryptis="1"
              aria-label="${esc(T.prideti + ': ' + u.title)}"${padaryta ? ' disabled' : ''}>+${esc(sk(zingsnis))}</button>
          </span>
          ${zymos}
        </span>
      </div>
      ${videoMygtukas(u)}
    </li>`;
}

// -----------------------------------------------------------------------------
//  Žymėjimas
// -----------------------------------------------------------------------------
async function keisk(id, kryptis) {
  if (bukle) return;
  const u = uzduotys.find((x) => x.id === id);
  if (!u) return;
  bukle = true;

  const esamas = atlikimai.find((x) => x.challenge_id === id && x.day === siandien);
  const buvo = esamas?.amount || 0;
  const tiksl = tikslas(u);
  // Paprasta užduotis tik įsijungia ir išsijungia, kitos keičiasi po žingsnį.
  const nauja = tiksl === 1
    ? (buvo >= 1 ? 0 : 1)
    : Math.max(0, Math.min(tiksl, buvo + kryptis * (u.step || 1)));
  if (nauja === buvo) { bukle = false; return; }

  const buvoPilna = apskaiciuok(uzduotys, atlikimai, siandien).pilnos.has(siandien);
  const stulpeliai = 'id, challenge_id, day, xp, amount';

  try {
    if (nauja === 0) {
      const { error } = await db.from('challenge_completions').delete().eq('id', esamas.id);
      if (error) throw error;
      atlikimai = atlikimai.filter((x) => x.id !== esamas.id);
    } else if (esamas) {
      const { data: atnaujinta, error } = await db.from('challenge_completions')
        .update({ amount: nauja }).eq('id', esamas.id).select(stulpeliai).single();
      if (error) throw error;
      atlikimai = atlikimai.map((x) => (x.id === esamas.id ? atnaujinta : x));
    } else {
      const { data: naujas, error } = await db.from('challenge_completions')
        .insert({ client_id: sesijosId, challenge_id: id, day: siandien, amount: nauja })
        .select(stulpeliai).single();
      if (error) throw error;
      atlikimai = [...atlikimai, naujas];
    }

    const dabar = apskaiciuok(uzduotys, atlikimai, siandien);
    if (nauja === 0) rodykToast(T.zymejimasAtsauktas);
    else if (nauja >= tiksl && buvo < tiksl) {
      rodykToast(dabar.pilnos.has(siandien) && !buvoPilna
        ? `${T.dienaBaigta} 🎉`
        : T.uzduotisAtlikta);
    } else rodykToast(`${T.pazymeta}: ${kiekioTekstas(u, nauja)}`);
    pieskVisa();
  } catch (klaida) {
    rodykToast(klaidaLT(klaida) || T.klaidaIsaugoti, true);
  } finally {
    bukle = false;
  }
}

function rodykToast(tekstas, klaida = false) {
  const el = $('#toast');
  el.textContent = tekstas;
  el.className = 'toast' + (klaida ? ' toast-klaida' : '');
  el.hidden = false;
  clearTimeout(toastLaikas);
  toastLaikas = setTimeout(() => { el.hidden = true; }, 3200);
}
</script>
