<!--

  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo

<style>
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
    gap: var(--s-200);
  }
  .stat-kortele {
    padding: var(--s-200) var(--s-300); background: var(--surface); border-radius: var(--r-md);
  }
  .stat-kortele .stat-etikete { font-size: .8125rem; color: var(--ink-soft); }
  .stat-kortele .stat-reiksme { font-size: 1.75rem; font-weight: 700; font-stretch: 104%; margin-top: 2px; }
  .stat-kortele .stat-papildomai { font-size: .8125rem; color: var(--ink-soft); margin-top: 2px; }

  .svorio-grafikas { width: 100%; height: auto; margin-top: var(--s-300); }
  .svorio-grafikas .linija { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .svorio-grafikas .taskas { fill: var(--white); stroke: var(--ink); stroke-width: 2; }
  .svorio-grafikas .gardelė { stroke: var(--hair-ink); stroke-width: 1; }
  .svorio-grafikas .asies-tekstas { font-size: 11px; fill: var(--ink-soft); font-family: var(--display); }
  .svorio-grafikas .verte-tekstas { font-size: 12px; font-weight: 700; fill: var(--ink); font-family: var(--display); }

  .nuotrauku-galerija {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(96px, 100%), 1fr));
    gap: var(--s-100); margin-top: var(--s-100);
  }
  .nuotrauku-galerija a { display: block; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; }
  .nuotrauku-galerija img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 150ms var(--ease-out); }
  .nuotrauku-galerija img:hover { opacity: .85; }

  /* Ataskaitų sąrašas: viena savaitė -- viena eilutė, paspaudus atsiveria
     detalės. <details>/<summary> duoda sulankstymą be papildomo JS, o
     summary vidus stilizuotas kaip lentelės eilutė su stulpeliais. */
  .ataskaitu-lentele { border-top: 1px solid var(--hair-ink); }
  .ataskaitu-antraste {
    display: flex; gap: var(--s-200); padding: 0 var(--s-200) var(--s-75);
    font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-soft);
  }
  .ataskaitos-eilute { border-bottom: 1px solid var(--hair-ink); }
  .ataskaitos-eilute summary {
    display: flex; align-items: center; gap: var(--s-200);
    padding: var(--s-100) var(--s-200); cursor: pointer; list-style: none;
  }
  .ataskaitos-eilute summary::-webkit-details-marker { display: none; }
  .ataskaitos-eilute summary:hover { background: rgba(16,16,16,0.03); }
  .at-stulpelis { min-width: 0; }
  .at-savaite   { flex: 1.3 1 120px; font-weight: 700; }
  .at-data      { flex: 1 1 110px; color: var(--ink-soft); font-size: .875rem; }
  .at-svoris    { flex: 0.8 1 80px; }
  .at-progresas { flex: 0.8 1 80px; }
  .at-nuotraukos{ flex: 0.6 1 50px; color: var(--ink-soft); font-size: .875rem; }
  .at-rodykle   { flex: none; margin-left: auto; color: var(--ink-soft); transition: transform 150ms var(--ease-out); }
  .ataskaitos-eilute[open] .at-rodykle { transform: rotate(180deg); }
  .at-etikete { display: none; font-size: .6875rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .ataskaitos-detale { padding: 0 var(--s-200) var(--s-300); }

  @media (max-width: 640px) {
    .ataskaitu-antraste { display: none; }
    .ataskaitos-eilute summary { flex-wrap: wrap; row-gap: var(--s-75); }
    .at-stulpelis { flex: 1 1 42%; }
    .at-savaite { flex-basis: 100%; }
    .at-etikete { display: block; }
  }
</style>

<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Valdymas</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <p><a class="btn btn-ghost btn-sm" href="valdymas.html">&larr; Valdymas</a></p>

    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>
    <p class="note" id="pranesimas" hidden></p>

    <div id="skydelis" hidden>
      <div class="page-head" id="antrastes-vieta"></div>
      <div id="statistika-vieta"></div>
      <div class="card-head" style="margin-top:var(--s-500)"><h2>Programos</h2></div>
      <div id="programu-vieta"></div>
      <div class="card-head" style="margin-top:var(--s-500)"><h2>Savaitinės ataskaitos</h2></div>
      <div id="patikrinimu-vieta"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, valdymas</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, $$, esc, data, klaidaLT, pranesk, reikiaSesijos, rodykNav,
  BUSENOS, zodis, nuotraukuNuorodos,
} from './app.js?v=20261015';

const clientId = new URLSearchParams(location.search).get('id');

let klientas = null;
let checkinai = [];
let programos = [];

paleisk();

async function paleisk() {
  const s = await reikiaSesijos({ tikTreneriui: true });
  if (!s) return;
  rodykNav(s.profilis, 'valdymas.html', true);

  if (!clientId) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), 'Trūksta kliento adreso. Grįžk į valdymą ir pasirink klientą iš sąrašo.', 'error');
    return;
  }

  await ikelk();

  $('#kraunasi').hidden = true;
  if (klientas) $('#skydelis').hidden = false;
}

async function ikelk() {
  const [p1, p2, p3] = await Promise.all([
    db.from('profiles').select('id, email, full_name, phone, status, plan_type, uzduotys_ijungtos, created_at').eq('id', clientId).maybeSingle(),
    db.from('checkins').select('*').eq('user_id', clientId).order('created_at', { ascending: true }),
    db.from('client_programs').select('id, program_id, title, status, starts_on, assigned_at').eq('client_id', clientId).order('assigned_at', { ascending: false }),
  ]);

  if (p1.error || !p1.data) {
    pranesk($('#pranesimas'), p1.error ? klaidaLT(p1.error) : 'Kliento nerasta.', 'error');
    return;
  }

  klientas   = p1.data;
  checkinai  = p2.data || [];
  programos  = p3.data || [];

  document.title = (klientas.full_name || klientas.email) + ' | Butkus Coaching';

  piesAntraste();
  piesStatistika();
  await piesProgramas();
  piesPatikrinimus();
}

function paketoText(planType) {
  if (planType === 'tik_programa') return 'Tik programa';
  if (planType === 'tik_uzduotys') return 'Tik užduotys';
  return 'Pilnas';
}

// =============================================================================
//  ANTRAŠTĖ: vardas, būsena, greiti veiksmai
// =============================================================================
function piesAntraste() {
  $('#antrastes-vieta').innerHTML = `
    <h1>${esc(klientas.full_name || 'Be vardo')}</h1>
    <p>
      ${esc(klientas.email || '')}${klientas.phone ? ' &middot; ' + esc(klientas.phone) : ''}
      &middot; Užsiregistravo ${esc(data(klientas.created_at))}
    </p>
    <div class="row" style="margin-top:var(--s-200)">
      <span class="chip ${klientas.status === 'active' ? 'chip-ok' : klientas.status === 'blocked' ? 'chip-danger' : 'chip-quiet'}">${esc(BUSENOS[klientas.status] || klientas.status)}</span>
      <span class="chip chip-quiet">${esc(paketoText(klientas.plan_type))}</span>
      <span class="chip ${klientas.uzduotys_ijungtos ? 'chip-ok' : 'chip-quiet'}">${klientas.uzduotys_ijungtos ? 'Užduotys įjungtos' : 'Užduotys išjungtos'}</span>
      <button class="btn btn-ghost btn-sm" type="button" id="uzd-jungiklis">${klientas.uzduotys_ijungtos ? 'Išjungti užduotis' : 'Įjungti užduotis'}</button>
      ${klientas.status === 'blocked'
        ? '<button class="btn btn-ghost btn-sm" type="button" id="busenos-mygtukas" data-busena="active">Grąžinti prieigą</button>'
        : '<button class="btn btn-danger btn-sm" type="button" id="busenos-mygtukas" data-busena="blocked">Sustabdyti</button>'}
    </div>`;

  $('#uzd-jungiklis').addEventListener('click', () => keiskUzduotis(!klientas.uzduotys_ijungtos));
  $('#busenos-mygtukas').addEventListener('click', (ev) => keiskBusena(ev.currentTarget.dataset.busena));
}

async function keiskBusena(busena) {
  const { error } = await db.rpc('admin_set_status', { p_client: clientId, p_status: busena });
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), busena === 'blocked' ? 'Prieiga sustabdyta.' : 'Prieiga grąžinta.', 'ok');
  await ikelk();
}

async function keiskUzduotis(ijungta) {
  const { error } = await db.rpc('admin_set_uzduotys', { p_client: clientId, p_ijungta: ijungta });
  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), ijungta ? 'Užduotys klientui įjungtos.' : 'Užduotys klientui išjungtos.', 'ok');
  await ikelk();
}

// =============================================================================
//  SVORIO STATISTIKA IR GRAFIKAS
//  Pradžios/dabartinis svoris imami iš savaitinių ataskaitų -- atskiro
//  "svorio" lauko profilyje nėra, o ataskaitos yra vienintelis vietis, kur
//  klientas savo svorį reguliariai įveda.
// =============================================================================
function piesStatistika() {
  const vieta = $('#statistika-vieta');
  const suSvoriu = checkinai.filter((c) => c.weight_kg != null);

  if (!suSvoriu.length) {
    vieta.innerHTML = '<p class="muted">Svorio duomenų dar nėra -- jie atsiras, kai klientas pateiks pirmą savaitinę ataskaitą.</p>';
    return;
  }

  const pirmas = suSvoriu[0];
  const paskutinis = suSvoriu[suSvoriu.length - 1];
  const pokytis = paskutinis.weight_kg - pirmas.weight_kg;
  const pokycioTekstas = `${pokytis > 0 ? '+' : ''}${pokytis.toFixed(1)} kg nuo pradžios`;

  vieta.innerHTML = `
    <div class="stat-grid">
      <div class="stat-kortele">
        <div class="stat-etikete">Pradžios svoris</div>
        <div class="stat-reiksme">${pirmas.weight_kg} kg</div>
        <div class="stat-papildomai">${esc(data(pirmas.created_at))}</div>
      </div>
      <div class="stat-kortele">
        <div class="stat-etikete">Dabartinis svoris</div>
        <div class="stat-reiksme">${paskutinis.weight_kg} kg</div>
        <div class="stat-papildomai">${esc(data(paskutinis.created_at))}</div>
      </div>
      <div class="stat-kortele">
        <div class="stat-etikete">Pokytis</div>
        <div class="stat-reiksme">${suSvoriu.length > 1 ? esc(pokycioTekstas) : '--'}</div>
        <div class="stat-papildomai">${suSvoriu.length} ${zodis(suSvoriu.length, 'ataskaita', 'ataskaitos', 'ataskaitų')} su svoriu</div>
      </div>
    </div>
    <div id="grafiko-vieta"></div>`;

  if (suSvoriu.length > 1) piesGrafika(suSvoriu);
}

function piesGrafika(taskai) {
  const plotis = 640;
  const aukstis = 180;
  const paraste = { k: 36, d: 20, v: 16, a: 20 };

  const svoriai = taskai.map((t) => t.weight_kg);
  let min = Math.min(...svoriai);
  let max = Math.max(...svoriai);
  if (min === max) { min -= 1; max += 1; }
  // Šiek tiek vietos virš/po duomenų, kad taškai nelimptų prie pat krašto.
  const uzpildas = (max - min) * 0.12;
  min -= uzpildas;
  max += uzpildas;

  const vidX = (plotis - paraste.k - paraste.d);
  const vidY = (aukstis - paraste.v - paraste.a);
  const x = (i) => paraste.k + (taskai.length > 1 ? (i / (taskai.length - 1)) * vidX : vidX / 2);
  const y = (sv) => paraste.v + vidY - ((sv - min) / (max - min)) * vidY;

  const linija = taskai.map((t, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(t.weight_kg).toFixed(1)}`).join(' ');

  // Trys horizontalios gardelės: min, vidurys, max -- pakanka orientacijai,
  // be reikalo neperkraunant grafiko skaičiais.
  const gardeles = [min + (max - min), min + (max - min) / 2, min]
    .map((sv) => `
      <line class="gardelė" x1="${paraste.k}" x2="${plotis - paraste.d}" y1="${y(sv).toFixed(1)}" y2="${y(sv).toFixed(1)}"></line>
      <text class="asies-tekstas" x="${paraste.k - 8}" y="${(y(sv) + 4).toFixed(1)}" text-anchor="end">${sv.toFixed(0)}</text>`)
    .join('');

  const taskaiSvg = taskai.map((t, i) => `<circle class="taskas" cx="${x(i).toFixed(1)}" cy="${y(t.weight_kg).toFixed(1)}" r="3.5"><title>${esc(data(t.created_at))}: ${t.weight_kg} kg</title></circle>`).join('');

  // Tiesioginiai užrašai tik pirmam ir paskutiniam taškui -- tarpiniai jau
  // pasiekiami per pelės užvedimą (title), skaičiais neperkraunant vaizdo.
  const pirmasLabel = `<text class="verte-tekstas" x="${x(0).toFixed(1)}" y="${(y(taskai[0].weight_kg) - 10).toFixed(1)}" text-anchor="start">${taskai[0].weight_kg}</text>`;
  const paskutinisLabel = `<text class="verte-tekstas" x="${x(taskai.length - 1).toFixed(1)}" y="${(y(taskai[taskai.length - 1].weight_kg) - 10).toFixed(1)}" text-anchor="end">${taskai[taskai.length - 1].weight_kg}</text>`;

  $('#grafiko-vieta').innerHTML = `
    <svg class="svorio-grafikas" viewBox="0 0 ${plotis} ${aukstis}" role="img" aria-label="Svorio kitimas nuo ${esc(data(taskai[0].created_at))} iki ${esc(data(taskai[taskai.length - 1].created_at))}">
      ${gardeles}
      <path class="linija" d="${linija}"></path>
      ${taskaiSvg}
      ${pirmasLabel}
      ${paskutinisLabel}
      <text class="asies-tekstas" x="${paraste.k}" y="${aukstis - 4}" text-anchor="start">${esc(data(taskai[0].created_at))}</text>
      <text class="asies-tekstas" x="${plotis - paraste.d}" y="${aukstis - 4}" text-anchor="end">${esc(data(taskai[taskai.length - 1].created_at))}</text>
    </svg>`;
}

// =============================================================================
//  PROGRAMOS
// =============================================================================
async function piesProgramas() {
  const vieta = $('#programu-vieta');
  if (!programos.length) {
    vieta.innerHTML = '<p class="muted">Programų dar nepriskirta.</p>';
    return;
  }

  const idSarasas = programos.map((p) => p.id);
  const { data: dienos } = await db.from('client_days').select('id, client_program_id').in('client_program_id', idSarasas);
  const dienuId = (dienos || []).map((d) => d.id);
  const { data: pratimai } = dienuId.length
    ? await db.from('client_exercises').select('id, client_day_id').in('client_day_id', dienuId)
    : { data: [] };

  const dienuSkaicius = new Map();
  for (const d of dienos || []) dienuSkaicius.set(d.client_program_id, (dienuSkaicius.get(d.client_program_id) || 0) + 1);
  const dienaPrieProgramos = new Map((dienos || []).map((d) => [d.id, d.client_program_id]));
  const pratimuSkaicius = new Map();
  for (const p of pratimai || []) {
    const progId = dienaPrieProgramos.get(p.client_day_id);
    if (!progId) continue;
    pratimuSkaicius.set(progId, (pratimuSkaicius.get(progId) || 0) + 1);
  }

  const eilutes = programos.map((p) => `
    <tr>
      <td data-label="Programa">${esc(p.title)}</td>
      <td data-label="Būsena"><span class="chip ${p.status === 'active' ? 'chip-ok' : 'chip-quiet'}">${p.status === 'active' ? 'Aktyvi' : p.status === 'finished' ? 'Baigta' : esc(p.status)}</span></td>
      <td data-label="Pradžia">${p.starts_on ? esc(data(p.starts_on)) : esc(data(p.assigned_at))}</td>
      <td data-label="Turinys">${dienuSkaicius.get(p.id) || 0} d. &middot; ${pratimuSkaicius.get(p.id) || 0} pr.</td>
      <td data-label="">
        <div class="row">
          <a class="btn btn-ghost btn-sm" href="istorija.html?id=${encodeURIComponent(p.id)}">Istorija</a>
          <a class="btn btn-ghost btn-sm" href="valdymas.html?klientas=${encodeURIComponent(clientId)}">Tvarkyti</a>
        </div>
      </td>
    </tr>`).join('');

  vieta.innerHTML = `
    <div class="table-wrap table-kortelese">
      <table>
        <thead><tr><th>Programa</th><th>Būsena</th><th>Pradžia</th><th>Turinys</th><th></th></tr></thead>
        <tbody>${eilutes}</tbody>
      </table>
    </div>`;
}

// =============================================================================
//  SAVAITINĖS ATASKAITOS -- ta pati kortelių forma, kaip Valdymas / Patikrinimai
// =============================================================================
async function piesPatikrinimus() {
  const vieta = $('#patikrinimu-vieta');
  if (!checkinai.length) {
    vieta.innerHTML = '<p class="muted">Ataskaitų dar nėra.</p>';
    return;
  }

  // Naujausios viršuje.
  const savi = [...checkinai].reverse();
  const visiKeliai = savi.flatMap((c) => c.photo_paths || []);
  const nuorodos = await nuotraukuNuorodos(visiKeliai);

  const eilutes = savi.map((c) => `
    <details class="ataskaitos-eilute">
      <summary>
        <span class="at-stulpelis at-savaite">${esc(c.program_week || 'Savaitė nenurodyta')}</span>
        <span class="at-stulpelis at-data"><span class="at-etikete">Data</span>${esc(data(c.created_at))}</span>
        <span class="at-stulpelis at-svoris"><span class="at-etikete">Svoris</span>${c.weight_kg != null ? esc(c.weight_kg) + ' kg' : '—'}</span>
        <span class="at-stulpelis at-progresas"><span class="at-etikete">Progresas</span>${c.progress_feeling != null ? esc(c.progress_feeling) + '/10' : '—'}</span>
        <span class="at-stulpelis at-nuotraukos">${(c.photo_paths || []).length ? `📷 ${c.photo_paths.length}` : ''}</span>
        <span class="at-rodykle" aria-hidden="true">&#9660;</span>
      </summary>
      <div class="ataskaitos-detale">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:var(--s-100) var(--s-300);font-size:.9375rem;margin-top:var(--s-100)">
          <div><span class="muted">Treniruotės</span><br>${esc(c.sessions_completed)}</div>
          <div><span class="muted">Pastangos</span><br>${esc(c.effort_rating)}/10</div>
          <div><span class="muted">Skausmas</span><br>${esc(c.pain_status)}</div>
          <div><span class="muted">Miegas</span><br>${esc(c.sleep_hours)}, kokybė ${esc(c.sleep_quality)}/10</div>
          ${c.nutrition_adherence != null ? `<div><span class="muted">Mityba</span><br>laikymasis ${esc(c.nutrition_adherence)}/10${c.protein_intake ? `, baltymai ${esc(c.protein_intake)}` : ''}</div>` : ''}
          <div><span class="muted">Energija</span><br>${esc(c.energy_level)}/10</div>
          <div><span class="muted">Stresas</span><br>${esc(c.stress_level)}/10</div>
          ${c.avg_daily_steps ? `<div><span class="muted">Žingsniai</span><br>${esc(c.avg_daily_steps)}</div>` : ''}
        </div>
        ${(c.photo_paths || []).length ? `
          <div class="nuotrauku-galerija">
            ${c.photo_paths.map((kelias) => nuorodos.get(kelias)
              ? `<a href="${esc(nuorodos.get(kelias))}" target="_blank" rel="noopener"><img src="${esc(nuorodos.get(kelias))}" alt="Progreso nuotrauka" loading="lazy"></a>`
              : '').join('')}
          </div>` : ''}
        <div style="margin-top:var(--s-200);display:flex;flex-direction:column;gap:var(--s-100);font-size:.9375rem">
          ${c.pain_detail ? `<div><strong>Skausmo detalės</strong><br>${esc(c.pain_detail)}</div>` : ''}
          ${c.sleep_disruptions ? `<div><strong>Miego trikdžiai</strong><br>${esc(c.sleep_disruptions)}</div>` : ''}
          ${c.nutrition_struggles ? `<div><strong>Mitybos sunkumai</strong><br>${esc(c.nutrition_struggles)}</div>` : ''}
          ${c.stress_source ? `<div><strong>Streso šaltinis</strong><br>${esc(c.stress_source)}</div>` : ''}
          <div><strong>Kuo didžiuojasi</strong><br>${esc(c.proud_of)}</div>
          <div><strong>Didžiausias iššūkis</strong><br>${esc(c.biggest_challenge)}</div>
          ${c.additional_notes ? `<div><strong>Papildomai</strong><br>${esc(c.additional_notes)}</div>` : ''}
          ${c.program_adjustment ? `<div><strong>Siūlomi pakeitimai</strong><br>${esc(c.program_adjustment)}</div>` : ''}
        </div>
      </div>
    </details>`).join('');

  vieta.innerHTML = `
    <div class="ataskaitu-lentele">
      <div class="ataskaitu-antraste">
        <span class="at-savaite">Savaitė</span>
        <span class="at-data">Data</span>
        <span class="at-svoris">Svoris</span>
        <span class="at-progresas">Progresas</span>
        <span class="at-nuotraukos"></span>
        <span style="flex:none;width:16px"></span>
      </div>
      ${eilutes}
    </div>`;
}
</script>
</body>
</html>
