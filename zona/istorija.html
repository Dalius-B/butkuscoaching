  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.

<style>
  /* Dienos filtras — vienas iš kelių treniruočių dienos pavadinimų (Leg
     Day, Upper Body...), kad klientas galėtų susiaurinti sąrašą iki vienos
     dienos, bet pagal nutylėjimą matytų viską chronologine tvarka. */
  #dienos-filtras { margin-bottom: var(--s-300); }

  .sesija-kortele { padding: 0; overflow: hidden; }
  .sesija-kortele + .sesija-kortele { margin-top: var(--s-200); }
  .sesija-antraste {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-200);
    padding: var(--s-300) var(--s-400); cursor: pointer; list-style: none;
  }
  .sesija-antraste::-webkit-details-marker { display: none; }
  .sesija-antraste-kaire { display: flex; align-items: baseline; gap: var(--s-150); flex-wrap: wrap; min-width: 0; }
  .sesija-antraste h3 { margin: 0; font-size: 1.0625rem; }
  .sesija-diena { font-size: .8125rem; color: var(--ink-soft); }
  .sesija-antraste .rodykle {
    flex: none; width: 20px; height: 20px; transition: rotate 180ms var(--ease-out);
    stroke: var(--ink-soft);
  }
  .sesija-kortele[open] .sesija-antraste .rodykle { rotate: 180deg; }
  .sesija-turinys { padding: 0 var(--s-400) var(--s-400); }

  table.istorija { width: 100%; border-collapse: collapse; }
  table.istorija th {
    text-align: left; font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-soft); padding: 0 var(--s-100) var(--s-75); border-bottom: 1px solid var(--hair-ink);
  }
  table.istorija td { padding: var(--s-100); border-bottom: 1px solid var(--hair-ink); font-size: .9375rem; vertical-align: top; }
  table.istorija tr:last-child td { border-bottom: 0; }
  table.istorija td.setai { font-variant-numeric: tabular-nums; }
  table.istorija td.pastaba { color: var(--ink-soft); font-size: .875rem; }

  #rodinys-pratimas .field { max-width: 360px; }

  /* Lentelė — pratimas × data tinklelis, tik treneriui (žr. piesLentele()).
     Neišvengiamai plati (viena data = vienas stulpelis), tad pirmas
     stulpelis (pratimo pavadinimas) lieka matomas slenkant į šoną. */
  .lenteles-diena + .lenteles-diena { margin-top: var(--s-600); }
  .lenteles-diena-antraste {
    font-size: .8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-soft); padding-bottom: var(--s-200); margin-bottom: var(--s-200);
    border-bottom: 1px solid var(--hair-ink);
  }
  table.lentele th, table.lentele td { white-space: nowrap; }
  table.lentele thead th { font-size: .75rem; }
  table.lentele tbody th { text-align: left; font-size: .9375rem; font-weight: 700; }
  table.lentele tbody th, table.lentele thead th:first-child {
    position: sticky; left: 0; background: var(--paper); z-index: 1;
  }
  /* Pastabos ženkliukas lentelėje — tilptų ir svoris, ir pastaba kiekvienam
     langeliui, tad pastaba lieka paslėpta už title patarimo, o ne užima vietą. */
  .lentele-pastaba { cursor: help; font-size: .8125rem; }
  .lentele-redaguoti { text-decoration: none; opacity: .6; }
  .lentele-redaguoti:hover { opacity: 1; }

  /* Progreso grafikas — vieno pratimo geriausias kiekvienos sesijos
     rezultatas (svoris, trukmė arba kartai, priklausomai nuo pratimo tipo)
     per laiką, kad progresas matytųsi iš karto, o ne reikėtų lyginti
     skaičius per kelias dešimtis lentelės eilučių. */
  .progreso-grafikas { width: 100%; height: auto; margin: var(--s-300) 0; }
  .progreso-grafikas .pg-linija { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .progreso-grafikas .pg-taskas { fill: var(--white); stroke: var(--ink); stroke-width: 2; }
  .progreso-grafikas .pg-gardele { stroke: var(--hair-ink); stroke-width: 1; }
  .progreso-grafikas .pg-asies-tekstas { font-size: 11px; fill: var(--ink-soft); font-family: var(--display); }
  .progreso-grafikas .pg-verte-tekstas { font-size: 12px; font-weight: 700; fill: var(--ink); font-family: var(--display); }

  /* Asmeniniai rekordai — du kompaktiški skaitliukai virš istorijos
     lentelės, kad klientas iš karto matytų savo geriausią rezultatą, o ne
     turėtų ieškoti jo pats per visą lentelę. */
  .pb-tinklelis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: var(--s-200); margin: var(--s-300) 0; }
  .pb-korta { background: var(--surface); border-radius: var(--r-md); padding: var(--s-200) var(--s-300); }
  .pb-etikete { display: block; font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
  .pb-reiksme { display: block; font-size: 1.375rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pb-reiksme small { font-size: .8125rem; font-weight: 400; color: var(--ink-soft); }
  .pb-data { display: block; font-size: .75rem; color: var(--ink-soft); margin-top: 2px; }

  @media (max-width: 620px) {
    .sesija-antraste { padding: var(--s-200) var(--s-300); }
    .sesija-turinys { padding: 0 var(--s-300) var(--s-300); }
  }
</style>
</head>
<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="mano.html">Butkus<i>/</i>Coaching<small>Klientų zona</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <p><a class="btn btn-ghost btn-sm" id="atgal-nuoroda" href="mano.html">&larr; Programa</a></p>
      <h1 id="antraste">Istorija</h1>
      <p id="paantraste"></p>
      <p id="ankstesnes-zyma" hidden style="margin-top:var(--s-100)"><span class="chip chip-quiet">Ankstesnė programa</span></p>
    </div>
    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>
    <p class="note" id="pranesimas" hidden></p>

    <div id="skydelis" hidden>
      <div class="tabs" role="tablist" id="rodinio-tabs">
        <button class="tab" role="tab" type="button" data-rodinys="diena" aria-selected="true">Pagal datą</button>
        <button class="tab" role="tab" type="button" data-rodinys="pratimas" aria-selected="false">Pagal pratimą</button>
        <button class="tab" role="tab" type="button" data-rodinys="lentele" aria-selected="false" id="lenteles-mygtukas" hidden>Lentelė</button>
      </div>

      <div id="rodinys-diena">
        <div class="chips" id="dienos-filtras" role="radiogroup" aria-label="Filtruoti pagal treniruočių dieną"></div>
        <div id="sesiju-sarasas"></div>
      </div>

      <div id="rodinys-pratimas" hidden>
        <div class="field">
          <label for="pratimo-pasirinkimas">Pratimas</label>
          <select id="pratimo-pasirinkimas"></select>
        </div>
        <div id="pratimo-progresas" style="margin-top:var(--s-300)"></div>
      </div>

      <div id="rodinys-lentele" hidden></div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, Dalius Butkus</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import { db, $, $$, esc, data, klaidaLT, pranesk, reikiaSesijos, rodykNav, formatuokTrukme } from './app.js?v=20261031c';

const programId = new URLSearchParams(location.search).get('id');

paleisk();

async function paleisk() {
  const s = await reikiaSesijos();
  if (!s) return;
  rodykNav(s.profilis, 'mano.html', s.arTreneris);

  if (!programId) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), 'Trūksta programos adreso. Grįžk į savo programų sąrašą.', 'error');
    return;
  }
  if (s.arTreneris) {
    $('#atgal-nuoroda').href = 'valdymas.html';
    $('#atgal-nuoroda').textContent = '← Valdymas';
  } else {
    $('#atgal-nuoroda').href = 'programa.html?id=' + encodeURIComponent(programId);
  }

  await ikelk(s.arTreneris);
}

async function ikelk(arTreneris) {
  const { data: programa, error: pKlaida } = await db
    .from('client_programs').select('id, title, status, client_id').eq('id', programId).maybeSingle();

  if (pKlaida || !programa) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), pKlaida ? klaidaLT(pKlaida) : 'Šios programos nematai arba jos nebėra.', 'error');
    return;
  }

  // Treneriui rodomas kliento vardas — jis gali žiūrėti bet kurio
  // kliento istoriją, tad be vardo neaišku, kieno duomenis mato. "Atgal"
  // nuoroda tada veda į to konkretaus kliento profilį, o ne bendrą valdymą.
  let antrastesTekstas = programa.title;
  if (arTreneris) {
    const { data: klientas } = await db
      .from('profiles').select('full_name, email').eq('id', programa.client_id).maybeSingle();
    const vardas = klientas?.full_name?.trim() || klientas?.email || 'Klientas';
    antrastesTekstas = `${programa.title} — ${vardas}`;
    $('#atgal-nuoroda').href = 'klientas.html?id=' + encodeURIComponent(programa.client_id);
    $('#atgal-nuoroda').textContent = '← ' + vardas;
  }
  $('#paantraste').textContent = antrastesTekstas;
  document.title = 'Istorija: ' + programa.title + ' | Butkus Coaching';

  if (programa.status === 'finished') {
    $('#ankstesnes-zyma').hidden = false;
    if (!arTreneris) {
      $('#atgal-nuoroda').href = 'mano.html';
      $('#atgal-nuoroda').textContent = '← Mano programos';
    }
  }

  const { data: dienos, error: dKlaida } = await db
    .from('client_days').select('id, title, position').eq('client_program_id', programId).order('position', { ascending: true });
  if (dKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(dKlaida), 'error');
    return;
  }

  const dienuId = (dienos || []).map((d) => d.id);
  const { data: pratimai, error: prKlaida } = dienuId.length
    ? await db.from('client_exercises').select('id, title, client_day_id, position').in('client_day_id', dienuId).order('position', { ascending: true })
    : { data: [] };
  if (prKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(prKlaida), 'error');
    return;
  }

  const pratimuId = (pratimai || []).map((p) => p.id);
  const { data: irasai, error: iKlaida } = pratimuId.length
    ? await db.from('exercise_logs').select('*').eq('client_id', programa.client_id).in('client_exercise_id', pratimuId).order('logged_at', { ascending: false })
    : { data: [] };
  if (iKlaida) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), klaidaLT(iKlaida), 'error');
    return;
  }

  $('#kraunasi').hidden = true;
  paruoskRodinius(dienos || [], pratimai || [], irasai || [], arTreneris, programa.client_id);
}

function paruoskRodinius(dienos, pratimai, irasai, arTreneris, klientoId) {
  if (!irasai.length) {
    $('#pranesimas').hidden = true;
    $('#skydelis').hidden = true;
    $('#turinys').querySelector('.page').insertAdjacentHTML('beforeend',
      '<div class="empty"><h2>Kol kas tuščia</h2><p>Kai pradėsi žymėti setus programoje, jų istorija rodysis čia.</p></div>');
    return;
  }

  $('#skydelis').hidden = false;
  const pratimoInfo = new Map(pratimai.map((p) => [p.id, { pavadinimas: p.title, dienaId: p.client_day_id, pozicija: p.position }]));

  piesPagalDiena(dienos, pratimai, irasai, pratimoInfo);
  piesPagalPratima(pratimoInfo, irasai);

  // Lentelės rodinys — pratimas × data tinklelis, skirtas tik treneriui:
  // klientui tai per daug skaičių vienu metu, o treneriui tai tiksliausias
  // būdas palyginti kelias savaites iš karto.
  if (arTreneris) {
    $('#lenteles-mygtukas').hidden = false;
    piesLentele(dienos, irasai, pratimoInfo, klientoId);
  }

  for (const t of $$('#rodinio-tabs .tab')) {
    t.addEventListener('click', () => perjunkRodini(t.dataset.rodinys));
  }
}

function perjunkRodini(vardas) {
  for (const t of $$('#rodinio-tabs .tab')) t.setAttribute('aria-selected', String(t.dataset.rodinys === vardas));
  $('#rodinys-diena').hidden = vardas !== 'diena';
  $('#rodinys-pratimas').hidden = vardas !== 'pratimas';
  $('#rodinys-lentele').hidden = vardas !== 'lentele';
}

// =============================================================================
//  PAGAL DATĄ — viena plokščia sesijų juosta, naujausios viršuje, su
//  pasirenkamu treniruočių dienos filtru. Anksčiau sesijos buvo pirmiausia
//  suskirstytos pagal dienos pavadinimą (Leg Day, Upper Body...), tad
//  atsiverdavo "paskutinė" kortelė kiekvienoje dienos grupėje — telefone tai
//  reiškė kelias atviras korteles išbarstytas per visą puslapį, o ne vieną
//  aiškų "štai kas buvo paskiausiai".
// =============================================================================
function piesPagalDiena(dienos, pratimai, irasai, pratimoInfo) {
  const dienuPavadinimai = new Map(dienos.map((d) => [d.id, d.title]));

  // Raktas — (data, dienos id), nes tą pačią kalendorinę dieną klientas
  // retkarčiais gali būti atlikęs daugiau nei vienos treniruočių dienos
  // pratimus; tada tai dvi atskiros kortelės, o ne viena sumaišyta.
  const sesijos = new Map();
  for (const i of irasai) {
    const dienaId = pratimoInfo.get(i.client_exercise_id)?.dienaId;
    if (!dienaId) continue;
    const ymd = new Date(i.logged_at).toISOString().slice(0, 10);
    const raktas = ymd + '|' + dienaId;
    if (!sesijos.has(raktas)) sesijos.set(raktas, { ymd, dienaId, eilutes: [] });
    sesijos.get(raktas).eilutes.push(i);
  }

  const isrikiuotos = Array.from(sesijos.values())
    .sort((a, b) => b.ymd.localeCompare(a.ymd));

  // Filtro mygtukai tik toms dienoms, kurios iš tikrųjų turi istorijos —
  // dienai be nė vieno įrašo filtras tiesiog rodytų tuščią sąrašą.
  const naudotosDienuId = Array.from(new Set(isrikiuotos.map((s) => s.dienaId)));
  const filtroVieta = $('#dienos-filtras');
  filtroVieta.innerHTML = [
    `<label class="chip-opt"><input type="radio" name="dienos-filtras-pasirinkimas" value="" checked><span>Visos dienos</span></label>`,
    ...naudotosDienuId.map((id) => `<label class="chip-opt"><input type="radio" name="dienos-filtras-pasirinkimas" value="${esc(id)}"><span>${esc(dienuPavadinimai.get(id) || '')}</span></label>`),
  ].join('');
  filtroVieta.hidden = naudotosDienuId.length < 2;

  $('#sesiju-sarasas').innerHTML = isrikiuotos
    .map((s, idx) => sesijosKortele(s.eilutes, pratimoInfo, idx === 0, s.dienaId, dienuPavadinimai.get(s.dienaId) || ''))
    .join('');

  for (const r of $$('#dienos-filtras input')) {
    r.addEventListener('change', () => taikykDienosFiltra(r.value));
  }
}

function taikykDienosFiltra(dienaId) {
  for (const kortele of $$('#sesiju-sarasas .sesija-kortele')) {
    kortele.hidden = Boolean(dienaId) && kortele.dataset.dienaId !== dienaId;
  }
}

function sesijosKortele(eilutes, pratimoInfo, atidaryta, dienaId, dienosPavadinimas) {
  // Viena sesijos diena gali turėti kelis to pačio pratimo setus (setas 1,
  // setas 2 ...) — juos sugrupuojame į vieną eilutę, kad "viena eilutė =
  // vienas pratimas", o ne kartojame pratimo pavadinimą per kelias eilutes.
  const pagalPratima = new Map();
  for (const i of eilutes) {
    if (!pagalPratima.has(i.client_exercise_id)) pagalPratima.set(i.client_exercise_id, []);
    pagalPratima.get(i.client_exercise_id).push(i);
  }

  // Rikiuojama pagal pratimo poziciją programoje, ne pagal tai, kurio
  // pratimo setas tą dieną buvo įvestas pirmas — kitaip eilių tvarka
  // skiriasi nuo sesijos iki sesijos, nors pratimų tvarka programoje ta pati.
  const eilutesHtml = Array.from(pagalPratima.entries())
    .sort((a, b) => (pratimoInfo.get(a[0])?.pozicija ?? Infinity) - (pratimoInfo.get(b[0])?.pozicija ?? Infinity))
    .map(([pratimoId, setai]) => {
      const info = pratimoInfo.get(pratimoId) || { pavadinimas: '(pratimas ištrintas)' };
      return `
        <tr>
          <td><strong>${esc(info.pavadinimas)}</strong></td>
          <td class="setai">${esc(setuTekstas(setai))}</td>
          <td class="pastaba">${esc(pastabosTekstas(setai))}</td>
        </tr>`;
    }).join('');

  return `
    <details class="card sesija-kortele" data-diena-id="${esc(dienaId)}"${atidaryta ? ' open' : ''}>
      <summary class="sesija-antraste">
        <span class="sesija-antraste-kaire">
          <h3>${esc(data(eilutes[0].logged_at))}</h3>
          <span class="sesija-diena">${esc(dienosPavadinimas)}</span>
        </span>
        <svg class="rodykle" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="sesija-turinys">
        <div class="table-wrap">
          <table class="istorija">
            <thead><tr><th>Pratimas</th><th>Setai</th><th>Pastaba</th></tr></thead>
            <tbody>${eilutesHtml}</tbody>
          </table>
        </div>
      </div>
    </details>`;
}

// =============================================================================
//  PAGAL PRATIMĄ — visa vieno pratimo (pvz. Squat) istorija chronologiškai,
//  kad klientas iš karto matytų savo progresą, o ne rausiantis po dešimtis
//  sesijų kortelių.
// =============================================================================
function piesPagalPratima(pratimoInfo, irasai) {
  const pagalPavadinima = new Map();
  for (const i of irasai) {
    const pavadinimas = pratimoInfo.get(i.client_exercise_id)?.pavadinimas || '(pratimas ištrintas)';
    const raktas = pavadinimas.trim().toLowerCase();
    if (!pagalPavadinima.has(raktas)) pagalPavadinima.set(raktas, { pavadinimas, irasai: [] });
    pagalPavadinima.get(raktas).irasai.push(i);
  }

  const isrikiuoti = Array.from(pagalPavadinima.entries()).sort((a, b) => a[1].pavadinimas.localeCompare(b[1].pavadinimas, 'lt'));

  const pasirinkimas = $('#pratimo-pasirinkimas');
  pasirinkimas.innerHTML = isrikiuoti.map(([raktas, v]) => `<option value="${esc(raktas)}">${esc(v.pavadinimas)}</option>`).join('');
  pasirinkimas.addEventListener('change', () => piesPratimoProgresa(pagalPavadinima, pasirinkimas.value));
  if (isrikiuoti.length) piesPratimoProgresa(pagalPavadinima, isrikiuoti[0][0]);
}

function piesPratimoProgresa(pagalPavadinima, raktas) {
  const vieta = $('#pratimo-progresas');
  const grupe = pagalPavadinima.get(raktas);
  if (!grupe) { vieta.innerHTML = ''; return; }

  const sesijos = new Map();
  for (const i of grupe.irasai) {
    const raktasData = new Date(i.logged_at).toISOString().slice(0, 10);
    if (!sesijos.has(raktasData)) sesijos.set(raktasData, []);
    sesijos.get(raktasData).push(i);
  }

  const eilutesHtml = Array.from(sesijos.values()).map((setai) => `
    <tr>
      <td>${esc(data(setai[0].logged_at))}</td>
      <td class="setai">${esc(setuTekstas(setai))}</td>
      <td class="pastaba">${esc(pastabosTekstas(setai))}</td>
    </tr>`).join('');

  vieta.innerHTML = `
    ${pbBlokas(grupe.irasai)}
    <div id="grafiko-vieta"></div>
    <div class="table-wrap">
      <table class="istorija">
        <thead><tr><th>Data</th><th>Setai</th><th>Pastaba</th></tr></thead>
        <tbody>${eilutesHtml}</tbody>
      </table>
    </div>`;

  // Seniausia sesija kairėje, naujausia dešinėje — kryptis, kuria progresas
  // iš tikrųjų juda, o ne lentelės "naujausia viršuje" tvarka.
  const taskai = Array.from(sesijos.entries())
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([, setai]) => ({ data: setai[0].logged_at, ...sesijosGrafikoReiksme(setai) }))
    .filter((t) => t.reiksme != null);

  if (taskai.length > 1) piesProgresoGrafika(taskai);
}

/** Vienos sesijos geriausias rezultatas tam pratimui — sunkiausias svoris tą
 * dieną, arba (jei pratimas be svorio) ilgiausia trukmė, arba daugiausiai
 * kartų. Ta pati pirmenybės tvarka kaip pbSantrauka(), tik vienai dienai. */
function sesijosGrafikoReiksme(setai) {
  const suSvoriu = setai.filter((s) => s.weight_kg != null);
  if (suSvoriu.length) {
    const geriausias = suSvoriu.reduce((a, b) => (b.weight_kg > a.weight_kg
      || (b.weight_kg === a.weight_kg && (b.reps ?? 0) > (a.reps ?? 0))) ? b : a);
    return { reiksme: geriausias.weight_kg, vienetas: 'kg' };
  }
  const suTrukme = setai.filter((s) => s.duration_seconds != null);
  if (suTrukme.length) {
    const geriausias = suTrukme.reduce((a, b) => (b.duration_seconds > a.duration_seconds) ? b : a);
    return { reiksme: geriausias.duration_seconds, vienetas: 's' };
  }
  const suKartais = setai.filter((s) => s.reps != null);
  if (suKartais.length) {
    const geriausias = suKartais.reduce((a, b) => (b.reps > a.reps) ? b : a);
    return { reiksme: geriausias.reps, vienetas: 'k.' };
  }
  return { reiksme: null, vienetas: '' };
}

function piesProgresoGrafika(taskai) {
  const plotis = 640;
  const aukstis = 180;
  const paraste = { k: 36, d: 20, v: 16, a: 20 };
  const vienetas = taskai[0].vienetas;

  const reiksmes = taskai.map((t) => t.reiksme);
  let min = Math.min(...reiksmes);
  let max = Math.max(...reiksmes);
  if (min === max) { min -= 1; max += 1; }
  // Šiek tiek vietos virš/po duomenų, kad taškai nelimptų prie pat krašto.
  const uzpildas = (max - min) * 0.12;
  min -= uzpildas;
  max += uzpildas;

  const vidX = (plotis - paraste.k - paraste.d);
  const vidY = (aukstis - paraste.v - paraste.a);
  const x = (i) => paraste.k + (taskai.length > 1 ? (i / (taskai.length - 1)) * vidX : vidX / 2);
  const y = (r) => paraste.v + vidY - ((r - min) / (max - min)) * vidY;

  const linija = taskai.map((t, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(t.reiksme).toFixed(1)}`).join(' ');

  // Trys horizontalios gardelės: min, vidurys, max — pakanka orientacijai,
  // be reikalo neperkraunant grafiko skaičiais.
  const gardeles = [min + (max - min), min + (max - min) / 2, min]
    .map((r) => `
      <line class="pg-gardele" x1="${paraste.k}" x2="${plotis - paraste.d}" y1="${y(r).toFixed(1)}" y2="${y(r).toFixed(1)}"></line>
      <text class="pg-asies-tekstas" x="${paraste.k - 8}" y="${(y(r) + 4).toFixed(1)}" text-anchor="end">${r.toFixed(0)}</text>`)
    .join('');

  const taskaiSvg = taskai.map((t, i) => `<circle class="pg-taskas" cx="${x(i).toFixed(1)}" cy="${y(t.reiksme).toFixed(1)}" r="3.5"><title>${esc(data(t.data))}: ${t.reiksme}${vienetas}</title></circle>`).join('');

  // Tiesioginiai užrašai tik pirmam ir paskutiniam taškui — tarpiniai jau
  // pasiekiami per pelės užvedimą (title), skaičiais neperkraunant vaizdo.
  const pirmasLabel = `<text class="pg-verte-tekstas" x="${x(0).toFixed(1)}" y="${(y(taskai[0].reiksme) - 10).toFixed(1)}" text-anchor="start">${taskai[0].reiksme}${vienetas}</text>`;
  const paskutinisLabel = `<text class="pg-verte-tekstas" x="${x(taskai.length - 1).toFixed(1)}" y="${(y(taskai[taskai.length - 1].reiksme) - 10).toFixed(1)}" text-anchor="end">${taskai[taskai.length - 1].reiksme}${vienetas}</text>`;

  $('#grafiko-vieta').innerHTML = `
    <svg class="progreso-grafikas" viewBox="0 0 ${plotis} ${aukstis}" role="img" aria-label="Progresas nuo ${esc(data(taskai[0].data))} iki ${esc(data(taskai[taskai.length - 1].data))}">
      ${gardeles}
      <path class="pg-linija" d="${linija}"></path>
      ${taskaiSvg}
      ${pirmasLabel}
      ${paskutinisLabel}
      <text class="pg-asies-tekstas" x="${paraste.k}" y="${aukstis - 4}" text-anchor="start">${esc(data(taskai[0].data))}</text>
      <text class="pg-asies-tekstas" x="${plotis - paraste.d}" y="${aukstis - 4}" text-anchor="end">${esc(data(taskai[taskai.length - 1].data))}</text>
    </svg>`;
}

/** Sunkiausias kada nors pakeltas svoris ir daugiausiai kada nors padarytų
 * vieno seto kartų — ne visos istorijos vidurkis, o rekordinė reikšmė. */
function pbSantrauka(irasai) {
  let pbSvoris = null;
  let pbKartai = null;
  let pbTrukme = null;
  for (const i of irasai) {
    if (i.weight_kg != null && (!pbSvoris || i.weight_kg > pbSvoris.weight_kg
      || (i.weight_kg === pbSvoris.weight_kg && (i.reps ?? 0) > (pbSvoris.reps ?? 0)))) {
      pbSvoris = i;
    }
    if (i.reps != null && (!pbKartai || i.reps > pbKartai.reps
      || (i.reps === pbKartai.reps && (i.weight_kg ?? 0) > (pbKartai.weight_kg ?? 0)))) {
      pbKartai = i;
    }
    if (i.duration_seconds != null && (!pbTrukme || i.duration_seconds > pbTrukme.duration_seconds)) {
      pbTrukme = i;
    }
  }
  return { pbSvoris, pbKartai, pbTrukme };
}

function pbBlokas(irasai) {
  const { pbSvoris, pbKartai, pbTrukme } = pbSantrauka(irasai);
  if (!pbSvoris && !pbKartai && !pbTrukme) return '';

  const kortos = [];
  if (pbSvoris) {
    kortos.push(`
      <div class="pb-korta">
        <span class="pb-etikete">PB svoris</span>
        <strong class="pb-reiksme">${pbSvoris.weight_kg}kg <small>&times; ${pbSvoris.reps ?? '–'}</small></strong>
        <span class="pb-data">${esc(data(pbSvoris.logged_at))}</span>
      </div>`);
  }
  if (pbKartai) {
    kortos.push(`
      <div class="pb-korta">
        <span class="pb-etikete">PB kartai</span>
        <strong class="pb-reiksme">${pbKartai.reps}${pbKartai.weight_kg != null ? ` <small>&times; ${pbKartai.weight_kg}kg</small>` : ''}</strong>
        <span class="pb-data">${esc(data(pbKartai.logged_at))}</span>
      </div>`);
  }
  if (pbTrukme) {
    kortos.push(`
      <div class="pb-korta">
        <span class="pb-etikete">PB trukmė</span>
        <strong class="pb-reiksme">${esc(formatuokTrukme(pbTrukme.duration_seconds))}</strong>
        <span class="pb-data">${esc(data(pbTrukme.logged_at))}</span>
      </div>`);
  }
  return `<div class="pb-tinklelis">${kortos.join('')}</div>`;
}

function setuTekstas(setai) {
  return setai.slice().sort((a, b) => (a.set_index ?? 0) - (b.set_index ?? 0))
    .map((s) => vienoSetoTekstas(s)).join(' | ');
}

/** Vieno seto tekstas priklauso nuo to, kas jame įrašyta — svoris+kartai,
 * vien kartai (be svorio pratimai), ar trukmė (laikas, pvz. planka). */
function vienoSetoTekstas(s) {
  if (s.duration_seconds != null) return formatuokTrukme(s.duration_seconds);
  if (s.weight_kg != null) return `${s.weight_kg}kg × ${s.reps ?? '–'}`;
  if (s.reps != null) return `${s.reps} k.`;
  return '–';
}

function pastabosTekstas(setai) {
  return setai.map((s) => s.notes).find(Boolean) || '';
}

// =============================================================================
//  LENTELĖ — pratimas × data tinklelis, treniruočių dienai. Tik treneriui:
//  tiksliausias būdas palyginti kelias savaites iš karto, bet per daug
//  skaičių vienu metu klientui, kuriam skirtas Pagal datą / Pagal pratimą
//  rodinys su diagrama.
// =============================================================================
function piesLentele(dienos, irasai, pratimoInfo, klientoId) {
  const vieta = $('#rodinys-lentele');
  const dienosSuIrasais = dienos.filter((d) => irasai.some((i) => pratimoInfo.get(i.client_exercise_id)?.dienaId === d.id));

  vieta.innerHTML = dienosSuIrasais.length
    ? dienosSuIrasais.map((d) => lentelesDienai(d, irasai, pratimoInfo, klientoId)).join('')
    : '<p class="muted">Kol kas tuščia.</p>';
}

function lentelesDienai(d, visiIrasai, pratimoInfo, klientoId) {
  const dIrasai = visiIrasai.filter((i) => pratimoInfo.get(i.client_exercise_id)?.dienaId === d.id);

  // ymd -> { pavyzdys: tikras logged_at (antraštei formatuoti), langeliai: pratimoId -> setai[] }
  const pagalData = new Map();
  for (const i of dIrasai) {
    const ymd = new Date(i.logged_at).toISOString().slice(0, 10);
    if (!pagalData.has(ymd)) pagalData.set(ymd, { pavyzdys: i.logged_at, langeliai: new Map() });
    const langeliai = pagalData.get(ymd).langeliai;
    if (!langeliai.has(i.client_exercise_id)) langeliai.set(i.client_exercise_id, []);
    langeliai.get(i.client_exercise_id).push(i);
  }

  // Seniausia data kairėje, naujausia dešinėje — ta pati kryptis kaip
  // progreso grafike, kad progresas skaitytųsi natūraliai iš kairės.
  const datos = Array.from(pagalData.keys()).sort();

  const dPratimai = Array.from(pratimoInfo.entries())
    .filter(([, info]) => info.dienaId === d.id)
    .sort((a, b) => (a[1].pozicija ?? Infinity) - (b[1].pozicija ?? Infinity));

  const antrastes = datos.map((ymd) => `<th>${esc(data(pagalData.get(ymd).pavyzdys))}</th>`).join('');

  const eilutes = dPratimai.map(([pratimoId, info]) => {
    const langeliai = datos.map((ymd) => {
      const setai = pagalData.get(ymd).langeliai.get(pratimoId);
      if (!setai) return '<td><span class="muted">—</span></td>';
      const pastaba = pastabosTekstas(setai);
      return `<td>${esc(setuTekstas(setai))}${pastaba ? ` <span class="lentele-pastaba" title="${esc(pastaba)}">&#128172;</span>` : ''}</td>`;
    }).join('');
    const redagavimoNuoroda = `valdymas.html?klientas=${encodeURIComponent(klientoId)}&programa=${encodeURIComponent(programId)}&pratimas=${encodeURIComponent(pratimoId)}`;
    return `<tr><th scope="row">${esc(info.pavadinimas)} <a class="lentele-redaguoti" href="${redagavimoNuoroda}" title="Redaguoti pratimą">&#9998;</a></th>${langeliai}</tr>`;
  }).join('');

  return `
    <section class="lenteles-diena">
      <h2 class="lenteles-diena-antraste">${esc(d.title)}</h2>
      <div class="table-wrap lentele-wrap">
        <table class="istorija lentele">
          <thead><tr><th></th>${antrastes}</tr></thead>
          <tbody>${eilutes}</tbody>
        </table>
      </div>
    </section>`;
}
</script>
