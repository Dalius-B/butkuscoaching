<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programos redagavimas | Butkus Coaching</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101010">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stilius.css?v=20261007">

<!--
  Supabase biblioteka guli kartu su projektu, o ne svetimame CDN.
  Taip zona veikia ir tada, kai CDN neprieinamas, ir nesiunčia lankytojo
  duomenų trečiai šaliai. Paprastas skriptas įvykdomas anksčiau už modulį,
  tad app.js jį jau randa.
  Atnaujinimas: curl -sL -o zona/vendor/supabase-2.116.0.umd.js \n                  https://cdn.jsdelivr.net/npm/@supabase/supabase-js@VERSIJA
-->
<script src="vendor/supabase-2.116.0.umd.js"></script>
<style>
  .diena-kortele + .diena-kortele { margin-top: var(--s-300); }
  .pratimo-eilute {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--s-100) var(--s-200);
    padding: var(--s-100) 0; border-top: 1px solid var(--hair-ink);
  }
  .pratimo-eilute:first-child { border-top: 0; }
  /* Redagavimo forma dalinasi .pratimo-eilute klase (dėl bendro rėmelio),
     bet ji nėra tas pats vaizdas -- flex-wrap paveldėtas iš aukščiau kartu
     su inline flex-direction:column verčia Chromium siaubingai išpūsti
     kiekvienos eilutės aukštį. Forma visada rikiuojama viena kolona. */
  .forma-redaguoti-pratima { flex-wrap: nowrap; }
  .pratimo-meta { display: flex; flex-wrap: wrap; gap: var(--s-100); margin-top: 4px; }
  .pratimo-eilute-info { flex: 1 1 180px; min-width: 0; }
  .pratimo-eilute-valdymas { display: flex; align-items: center; gap: var(--s-100); flex-wrap: wrap; flex: none; margin-left: auto; }

  /* Pratimų tvarkos keitimas -- pele tempiant rankeną, arba mygtukais ten,
     kur tempimas nepatogus ar neveikia (dauguma liečiamų ekranų). */
  .pratimo-eilute[draggable="true"] { cursor: grab; }
  .pratimo-eilute.velkama { opacity: .35; }
  .pratimo-eilute.uzleista { border-top-color: var(--ink); }
  .tvarkos-rankena {
    flex: none; align-self: center; color: var(--ink-soft); font-size: 1.125rem;
    line-height: 1; padding-right: var(--s-100); user-select: none;
  }
  .tvarkos-mygtukai { display: flex; flex-direction: column; gap: 2px; flex: none; }
  .tvarkos-mygtukai button {
    width: 26px; height: 22px; padding: 0; line-height: 1; font-size: .75rem;
    border: 1px solid rgba(16,16,16,0.20); border-radius: var(--r-sm); background: var(--white); cursor: pointer;
  }
  .tvarkos-mygtukai button:hover:not(:disabled) { border-color: rgba(16,16,16,0.42); }
  .tvarkos-mygtukai button:disabled { opacity: .3; cursor: default; }

  /* Supersetai -- kairinis rėmelis jungia grupės nares, o A1/A2 ženklelis
     parodo, kokia tvarka jos atliekamos. */
  .pratimo-eilute.supersete { border-left: 3px solid var(--volt); padding-left: var(--s-100); margin-left: -1px; }
  .pratimo-eilute.supersete-tesinys { border-top: 0; padding-top: 2px; }
  .superseto-zenklas {
    display: inline-block; font-size: .6875rem; font-weight: 700; letter-spacing: .04em;
    color: var(--ink); background: var(--volt); border-radius: var(--r-sm); padding: 1px 6px; margin-left: 4px;
  }

  .diena-antraste-redagavimas { display: flex; flex-direction: column; gap: var(--s-200); margin-bottom: var(--s-200); }
</style>
</head>
<body>

<header class="nav on-ink">
  <div class="shell nav-inner">
    <a class="wordmark" href="valdymas.html">Butkus<i>/</i>Coaching<small>Valdymas</small></a>
    <div class="nav-right" id="nav-right"></div>
  </div>
</header>

<main id="turinys">
  <div class="shell page">
    <div class="page-head">
      <p><a class="btn btn-ghost btn-sm" href="valdymas.html">&larr; Atgal į valdymą</a></p>
      <h1 id="antraste">Programos redagavimas</h1>
    </div>

    <div id="kraunasi" class="loading"><span class="spinner" aria-hidden="true"></span><span>Kraunama</span></div>
    <p class="note" id="pranesimas" hidden></p>

    <div id="skydelis" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" type="button" data-kortele="turinys" aria-selected="true">Turinys</button>
        <button class="tab" role="tab" type="button" data-kortele="priskyrimai" aria-selected="false">Priskyrimai</button>
      </div>
      <section id="kortele-turinys"></section>
      <section id="kortele-priskyrimai" hidden></section>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell">
    <span>Butkus Coaching, valdymas</span>
    <a href="../index.html">Į svetainę</a>
  </div>
</footer>

<script type="module">
import {
  db, $, $$, esc, data, klaidaLT, pranesk, reikiaSesijos, rodykNav,
  apskaiciuokSupersetuZenklus,
} from './app.js?v=20261007';

const programId = new URLSearchParams(location.search).get('id');

let programa = null;
let dienos = [];
let pratimai = [];
let klientai = [];
let priskyrimai = [];
let savasId = null;
let redaguojamoPratimoId = null;
let redaguojamosDienosId = null;
let velkamaEilute = null;

paleisk();

async function paleisk() {
  const s = await reikiaSesijos({ tikTreneriui: true });
  if (!s) return;
  rodykNav(s.profilis, 'valdymas.html', true);
  savasId = s.vartotojas.id;

  if (!programId) {
    $('#kraunasi').hidden = true;
    pranesk($('#pranesimas'), 'Trūksta programos adreso. Grįžk į valdymą ir pasirink programą iš sąrašo.', 'error');
    return;
  }

  for (const t of $$('.tab')) {
    t.addEventListener('click', () => rodykKortele(t.dataset.kortele));
  }

  await perkrauk();

  $('#kraunasi').hidden = true;
  if (programa) $('#skydelis').hidden = false;
}

async function perkrauk() {
  const [p1, p2, p3] = await Promise.all([
    db.from('programs').select('id, title, summary, status').eq('id', programId).maybeSingle(),
    db.from('program_sections').select('id, title, notes, position').eq('program_id', programId).order('position', { ascending: true }),
    db.from('profiles').select('id, email, full_name, status, plan_type').order('full_name', { ascending: true }),
  ]);

  if (p1.error || !p1.data) {
    pranesk($('#pranesimas'), p1.error ? klaidaLT(p1.error) : 'Programa nerasta.', 'error');
    return;
  }

  programa = p1.data;
  dienos   = p2.data || [];
  klientai = (p3.data || []).filter((k) => k.status !== 'blocked' && k.id !== savasId);

  const sekcijuId = dienos.map((d) => d.id);
  const [p4, p5] = await Promise.all([
    sekcijuId.length
      ? db.from('exercises').select('*').in('section_id', sekcijuId).order('position', { ascending: true })
      : Promise.resolve({ data: [] }),
    db.from('client_programs').select('id, client_id, status').eq('program_id', programId),
  ]);

  pratimai    = p4.data || [];
  priskyrimai = p5.data || [];

  $('#antraste').textContent = programa.title;
  document.title = programa.title + ' | Butkus Coaching';

  piesTurini();
  piesPriskyrimus();
}

function rodykKortele(vardas) {
  for (const t of $$('.tab')) {
    t.setAttribute('aria-selected', String(t.dataset.kortele === vardas));
  }
  for (const k of ['turinys', 'priskyrimai']) {
    $('#kortele-' + k).hidden = k !== vardas;
  }
}

// =============================================================================
//  TURINYS: pavadinimas, būsena, dienos ir pratimai
// =============================================================================
function piesTurini() {
  $('#kortele-turinys').innerHTML = `
    <div class="card" style="margin-bottom:var(--s-300)">
      <div class="card-head"><h2>Apie programą</h2></div>
      <form id="forma-antraste" novalidate>
        <div class="field">
          <label for="pr-pavadinimas">Pavadinimas</label>
          <input id="pr-pavadinimas" type="text" required value="${esc(programa.title)}">
        </div>
        <div class="field">
          <label for="pr-aprasas">Trumpas aprašas</label>
          <textarea id="pr-aprasas">${esc(programa.summary || '')}</textarea>
        </div>
        <div class="field">
          <label for="pr-busena">Būsena</label>
          <select id="pr-busena">
            <option value="draft"${programa.status === 'draft' ? ' selected' : ''}>Juodraštis, klientas nemato</option>
            <option value="published"${programa.status === 'published' ? ' selected' : ''}>Paskelbta, priskirti klientai mato</option>
            <option value="archived"${programa.status === 'archived' ? ' selected' : ''}>Archyve</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Išsaugoti</button>
        </div>
      </form>
    </div>

    <div class="card-head" style="margin-bottom:var(--s-200)"><h2>Dienos</h2></div>
    <div id="dienu-sarasas"></div>

    <div class="card" style="margin-top:var(--s-300)">
      <div class="card-head"><h2>Nauja diena</h2></div>
      <form id="forma-diena" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="d-pavadinimas">Pavadinimas</label>
            <input id="d-pavadinimas" type="text" required placeholder="Pvz., 1 diena — stūmimas">
          </div>
          <div class="field">
            <label for="d-pastabos">Pastabos <span class="hint" style="display:inline">(neprivaloma)</span></label>
            <input id="d-pastabos" type="text" placeholder="Bendra šios dienos pastaba">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Pridėti dieną</button>
        </div>
      </form>
    </div>`;

  $('#forma-antraste').addEventListener('submit', issaugokAntraste);
  $('#forma-diena').addEventListener('submit', prideDiena);
  piesDienuSarasa();
}

async function issaugokAntraste(ev) {
  ev.preventDefault();
  const pavadinimas = $('#pr-pavadinimas').value.trim();
  if (!pavadinimas) {
    pranesk($('#pranesimas'), 'Įrašyk programos pavadinimą.', 'error');
    return;
  }

  const { error } = await db.from('programs').update({
    title: pavadinimas,
    summary: $('#pr-aprasas').value.trim(),
    status: $('#pr-busena').value,
  }).eq('id', programId);

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Išsaugota.', 'ok');
  await perkrauk();
}

function piesDienuSarasa() {
  const vieta = $('#dienu-sarasas');
  if (!dienos.length) {
    vieta.innerHTML = '<p class="muted">Dienų dar nėra. Pridėk pirmą žemiau.</p>';
    return;
  }

  vieta.innerHTML = dienos.map((d) => {
    const savi = pratimai.filter((p) => p.section_id === d.id);
    const supersetuZenklai = apskaiciuokSupersetuZenklus(savi);
    return `
      <div class="card diena-kortele">
        ${d.id === redaguojamosDienosId ? dienosRedagavimoForma(d) : `
          <div class="card-head">
            <h3 style="margin:0">${esc(d.title)}</h3>
            <div class="row" style="gap:var(--s-100)">
              <button class="btn btn-ghost btn-sm redaguoti-diena" type="button" data-id="${esc(d.id)}">Redaguoti</button>
              <button class="btn btn-danger btn-sm trinti-diena" type="button" data-id="${esc(d.id)}" data-vardas="${esc(d.title)}">Trinti dieną</button>
            </div>
          </div>
          ${d.notes ? `<p class="muted" style="font-size:.9375rem">${esc(d.notes)}</p>` : ''}`}

        <div id="pratimai-${esc(d.id)}" data-sekcija="${esc(d.id)}">
          ${savi.length ? savi.map((p, i) => {
            if (p.id === redaguojamoPratimoId) return pratimoRedagavimoForma(p);
            const zenklas = supersetuZenklai.get(p.id);
            const tesinys = i > 0 && p.superset_with_previous && zenklas;
            return `
            <div class="pratimo-eilute${zenklas ? ' supersete' : ''}${tesinys ? ' supersete-tesinys' : ''}" draggable="true" data-id="${esc(p.id)}">
              <span class="tvarkos-rankena" title="Tempk, kad pakeistum tvarką">⠿</span>
              <div class="pratimo-eilute-info">
                <strong>${esc(p.title)}</strong>${zenklas ? ` <span class="superseto-zenklas">${zenklas}</span>` : ''}
                <div class="pratimo-meta muted" style="font-size:.8125rem">
                  ${p.log_type === 'kartai' ? '<span>Tik kartai</span>' : p.log_type === 'laikas' ? '<span>Laikas</span>' : ''}
                  ${p.target_sets ? `<span>${esc(p.target_sets)} setai</span>` : ''}
                  ${p.target_reps ? `<span>${esc(p.target_reps)} kartų</span>` : ''}
                  ${p.target_load ? `<span>${esc(p.target_load)}</span>` : ''}
                  ${p.rest_seconds ? `<span>${esc(p.rest_seconds)} sek poilsis</span>` : ''}
                </div>
                ${p.notes ? `<p class="muted" style="font-size:.8125rem;margin-top:4px">${esc(p.notes)}</p>` : ''}
                ${p.video_url ? `<p style="font-size:.8125rem;margin-top:4px"><a href="${esc(p.video_url)}" target="_blank" rel="noopener" style="text-decoration:underline">Vaizdo nuoroda</a></p>` : ''}
              </div>
              <div class="pratimo-eilute-valdymas">
                <div class="tvarkos-mygtukai">
                  <button type="button" class="kelk-pratima" data-id="${esc(p.id)}" data-kryptis="-1" aria-label="Kelti aukštyn"${i === 0 ? ' disabled' : ''}>&#9650;</button>
                  <button type="button" class="kelk-pratima" data-id="${esc(p.id)}" data-kryptis="1" aria-label="Kelti žemyn"${i === savi.length - 1 ? ' disabled' : ''}>&#9660;</button>
                </div>
                <button class="btn btn-ghost btn-sm redaguoti-pratima" type="button" data-id="${esc(p.id)}">Redaguoti</button>
                <button class="btn btn-ghost btn-sm trinti-pratima" type="button" data-id="${esc(p.id)}" data-vardas="${esc(p.title)}">Trinti</button>
              </div>
            </div>`;
          }).join('') : '<p class="muted" style="font-size:.9375rem">Pratimų dar nėra.</p>'}
        </div>

        ${pratimai.length ? `
          <div style="margin-top:var(--s-300);padding-top:var(--s-300);border-top:1px solid var(--hair-ink)">
            <div class="field">
              <label for="kp-pasirinkimas-${esc(d.id)}">Kopijuoti esamą pratimą į šią dieną</label>
              <select id="kp-pasirinkimas-${esc(d.id)}">
                ${dienos.map((diena) => {
                  const jos = pratimai.filter((p) => p.section_id === diena.id);
                  if (!jos.length) return '';
                  return `<optgroup label="${esc(diena.title)}">
                    ${jos.map((p) => `<option value="${esc(p.id)}">${esc(p.title)}</option>`).join('')}
                  </optgroup>`;
                }).join('')}
              </select>
            </div>
            <div class="form-actions">
              <button class="btn btn-ghost btn-sm kopijuoti-pratima" type="button" data-sekcija="${esc(d.id)}">Kopijuoti</button>
            </div>
          </div>` : ''}

        <form class="forma-pratimas" data-sekcija="${esc(d.id)}" novalidate style="margin-top:var(--s-300);padding-top:var(--s-300);border-top:1px solid var(--hair-ink)">
          <div class="field-row">
            <div class="field">
              <label for="p-pavadinimas-${esc(d.id)}">Pratimo pavadinimas</label>
              <input id="p-pavadinimas-${esc(d.id)}" name="title" type="text" required placeholder="Pvz., Štangos spaudimas gulint">
            </div>
            <div class="field">
              <label for="p-setai-${esc(d.id)}">Setai</label>
              <input id="p-setai-${esc(d.id)}" name="sets" type="number" min="1" max="20" inputmode="numeric">
            </div>
            <div class="field">
              <label for="p-kartai-${esc(d.id)}">Kartai</label>
              <input id="p-kartai-${esc(d.id)}" name="reps" type="text" placeholder="Pvz., 8-10">
            </div>
            <div class="field">
              <label for="p-svoris-${esc(d.id)}">Svoris / intensyvumas</label>
              <input id="p-svoris-${esc(d.id)}" name="load" type="text" placeholder="Pvz., 60 kg arba RPE 8">
            </div>
            <div class="field">
              <label for="p-poilsis-${esc(d.id)}">Poilsis, sek</label>
              <input id="p-poilsis-${esc(d.id)}" name="rest" type="number" min="0" max="600" inputmode="numeric">
            </div>
            <div class="field">
              <label for="p-tipas-${esc(d.id)}">Įrašymo tipas</label>
              <select id="p-tipas-${esc(d.id)}" name="log_type">
                <option value="svoris">Svoris ir kartai</option>
                <option value="kartai">Tik kartai (be svorio)</option>
                <option value="laikas">Laikas (sekundėmis)</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="p-pastabos-${esc(d.id)}">Pastabos <span class="hint" style="display:inline">(neprivaloma)</span></label>
              <input id="p-pastabos-${esc(d.id)}" name="notes" type="text" placeholder="Technikos pastaba klientui">
            </div>
            <div class="field">
              <label for="p-video-${esc(d.id)}">Vaizdo nuoroda <span class="hint" style="display:inline">(neprivaloma)</span></label>
              <input id="p-video-${esc(d.id)}" name="video" type="url" placeholder="YouTube arba Vimeo nuoroda">
            </div>
          </div>
          <div class="field">
            <label class="check-opt" for="p-supersetas-${esc(d.id)}">
              <input id="p-supersetas-${esc(d.id)}" name="superset" type="checkbox">
              <span>Supersetas su ankstesniu pratimu <span class="hint" style="display:inline">(atliekama iš karto po jo, be poilsio tarp jų)</span></span>
            </label>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost btn-sm" type="submit">Pridėti pratimą</button>
          </div>
        </form>
      </div>`;
  }).join('');

  for (const b of $$('.trinti-diena')) b.addEventListener('click', () => trinkDiena(b.dataset.id, b.dataset.vardas));
  for (const b of $$('.trinti-pratima')) b.addEventListener('click', () => trinkPratima(b.dataset.id, b.dataset.vardas));
  for (const f of $$('.forma-pratimas')) f.addEventListener('submit', pridePratima);
  for (const b of $$('.redaguoti-pratima')) {
    b.addEventListener('click', () => { redaguojamoPratimoId = b.dataset.id; piesDienuSarasa(); });
  }
  for (const b of $$('.atsaukti-redagavima')) {
    b.addEventListener('click', () => { redaguojamoPratimoId = null; piesDienuSarasa(); });
  }
  for (const f of $$('.forma-redaguoti-pratima')) f.addEventListener('submit', issaugokPratimoRedagavima);

  for (const b of $$('.redaguoti-diena')) {
    b.addEventListener('click', () => { redaguojamosDienosId = b.dataset.id; piesDienuSarasa(); });
  }
  for (const b of $$('.atsaukti-dienos-redagavima')) {
    b.addEventListener('click', () => { redaguojamosDienosId = null; piesDienuSarasa(); });
  }
  for (const f of $$('.forma-redaguoti-diena')) f.addEventListener('submit', issaugokDienosRedagavima);

  for (const b of $$('.kelk-pratima')) {
    b.addEventListener('click', () => perkelkPratima(b.dataset.id, Number(b.dataset.kryptis)));
  }
  for (const konteineris of $$('#dienu-sarasas [id^="pratimai-"]')) prijunkTempima(konteineris);
  for (const b of $$('.kopijuoti-pratima')) {
    b.addEventListener('click', () => {
      const sectionId = b.dataset.sekcija;
      const pasirinkimas = $('#kp-pasirinkimas-' + sectionId);
      if (pasirinkimas?.value) kopijuokPratima(sectionId, pasirinkimas.value);
    });
  }
}

async function kopijuokPratima(targetSectionId, sourceExerciseId) {
  const originalas = pratimai.find((p) => p.id === sourceExerciseId);
  if (!originalas) return;

  const kiekSioje = pratimai.filter((p) => p.section_id === targetSectionId).length;

  const { error } = await db.from('exercises').insert({
    section_id: targetSectionId,
    title: originalas.title,
    target_sets: originalas.target_sets,
    target_reps: originalas.target_reps,
    target_load: originalas.target_load,
    rest_seconds: originalas.rest_seconds,
    notes: originalas.notes,
    video_url: originalas.video_url,
    superset_with_previous: false,
    log_type: originalas.log_type || 'svoris',
    position: kiekSioje,
  });

  if (error) {
    pranesk($('#pranesimas'), klaidaLT(error), 'error');
    return;
  }
  pranesk($('#pranesimas'), 'Pratimas nukopijuotas.', 'ok');
  await perkrauk();
}

function dienosRedagavimoForma(d) {
  return `
    <form class="diena-antraste-redagavimas forma-redaguoti-diena" data-id="${esc(d.id)}" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="rd-pavadinimas-${esc(d.id)}">Dienos pavadinimas</label>
          <input id="rd-pavadinimas-${esc(d.id)}" name="title" type="text" required value="${esc(d.title)}">
        </div>
        <div class="field">

// =============================================================================
//  PRATIMŲ TVARKA -- tempimas pele arba mygtukai ten, kur tempimas nepatogu
//  (dauguma liečiamų ekranų HTML5 tempimo įvykių gerai nepalaiko).
// =============================================================================
async function issaugokTvarka(sectionId, tvarkaId) {
  const atnaujinimai = tvarkaId.map((id, i) => db.from('exercises').update({ position: i }).eq('id', id));
  const rezultatai = await Promise.all(atnaujinimai);
  const klaida = rezultatai.find((r) => r.error)?.error;
  if (klaida) {
    pranesk($('#pranesimas'), klaidaLT(klaida), 'error');
    return false;
  }
  // Vietinė tvarka atnaujinama iškart, kad neliktų trumpo senos tvarkos
  // blyksnio kol laukiame naujo perkrauk() atsakymo.
  tvarkaId.forEach((id, i) => {
    const p = pratimai.find((x) => x.id === id);
    if (p) p.position = i;
  });
  pratimai.sort((a, b) => a.position - b.position);
  return true;
}

async function perkelkPratima(pratimoId, kryptis) {
  const p = pratimai.find((x) => x.id === pratimoId);
  if (!p) return;
  const savi = pratimai.filter((x) => x.section_id === p.section_id).sort((a, b) => a.position - b.position);
  const idx = savi.findIndex((x) => x.id === pratimoId);
  const naujasIdx = idx + kryptis;
  if (naujasIdx < 0 || naujasIdx >= savi.length) return;

  [savi[idx], savi[naujasIdx]] = [savi[naujasIdx], savi[idx]];
  const sekme = await issaugokTvarka(p.section_id, savi.map((x) => x.id));
  if (sekme) piesDienuSarasa();
}

function prijunkTempima(konteineris) {
  konteineris.addEventListener('dragstart', (ev) => {
    const eilute = ev.target.closest('.pratimo-eilute');
    if (!eilute || !eilute.dataset.id) return;
    velkamaEilute = eilute;
    eilute.classList.add('velkama');
    ev.dataTransfer.effectAllowed = 'move';
  });

  konteineris.addEventListener('dragend', () => {
    velkamaEilute?.classList.remove('velkama');
    velkamaEilute = null;
  });

  konteineris.addEventListener('dragover', (ev) => {
    if (!velkamaEilute) return;
    ev.preventDefault();
    const virsEilutes = ev.target.closest('.pratimo-eilute');
    if (!virsEilutes || virsEilutes === velkamaEilute) return;
    const stacija = virsEilutes.getBoundingClientRect();
    const dedamPo = (ev.clientY - stacija.top) / stacija.height > 0.5;
    konteineris.insertBefore(velkamaEilute, dedamPo ? virsEilutes.nextSibling : virsEilutes);
  });

  konteineris.addEventListener('drop', async (ev) => {
    if (!velkamaEilute) return;
    ev.preventDefault();
    const tvarka = $$('.pratimo-eilute', konteineris).map((el) => el.dataset.id).filter(Boolean);
    const sekme = await issaugokTvarka(konteineris.dataset.sekcija, tvarka);
    if (sekme) piesDienuSarasa();
  });
}

// =============================================================================
//  PRISKYRIMAI
//
//  Priskyrimas nekuria nuorodos į bendrą šabloną -- jis nukopijuoja dienas ir
//  pratimus į kliento paties client_programs / client_days / client_exercises
//  įrašus (žr. assign_program() funkciją, supabase/klientu-kopijos.sql).
//  Vėliau pakeitus klientui vieną pratimą, šablonas ir kiti klientai lieka
//  nepaliesti.
// =============================================================================
function piesPriskyrimus() {
  const eilutes = klientai.map((k) => {
    // "Tik užduotys" paketo klientui programos neprisiskiriamos -- tą pačią
    // taisyklę saugo ir assign_program() duomenų bazėje, čia tik nerodomas
    // mygtukas, kurio paspaudus vis tiek gautum klaidą.
    if (k.plan_type === 'tik_uzduotys') {
      return `
        <tr>
          <td>
            <strong>${esc(k.full_name || 'Be vardo')}</strong>
            <div class="muted" style="font-size:.8125rem">${esc(k.email || '')}</div>
          </td>
          <td><span class="chip chip-quiet">Tik užduotys</span></td>
          <td><span class="muted" style="font-size:.8125rem">Programos nepriskiriamos</span></td>
        </tr>`;
    }
    const esamas = priskyrimai.find((a) => a.client_id === k.id && a.status !== 'finished');
    const priskirtas = Boolean(esamas);
    return `
      <tr>
        <td>
          <strong>${esc(k.full_name || 'Be vardo')}</strong>
          <div class="muted" style="font-size:.8125rem">${esc(k.email || '')}</div>
        </td>
        <td>${priskirtas ? '<span class="chip chip-ok">Priskirta</span>' : '<span class="chip chip-quiet">Nepriskirta</span>'}</td>
        <td>
          ${priskirtas
            ? `<button class="btn btn-ghost btn-sm keisk-priskyrima" type="button" data-client="${esc(k.id)}" data-veiksmas="atimti">Atimti</button>`
            : `<button class="btn btn-primary btn-sm keisk-priskyrima" type="button" data-client="${esc(k.id)}" data-veiksmas="priskirti">Priskirti kopiją</button>`}
        </td>
      </tr>`;
  }).join('');

  $('#kortele-priskyrimai').innerHTML = `
    <div class="card" style="margin-bottom:var(--s-300)">
      <div class="card-head"><h2>Pradžios data</h2></div>
      <p class="muted" style="margin-bottom:var(--s-200)">
        Neprivaloma. Jei nustatysi, ji bus pritaikyta kiekvienai naujai priskiriamai kopijai žemiau.
      </p>
      <div class="field" style="max-width:220px">
        <label for="pr-pradzia">Pradžios data</label>
        <input id="pr-pradzia" type="date">
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Priskyrimai</h2><span class="row-end muted">${klientai.length}</span></div>
      <p class="muted" style="margin-bottom:var(--s-200)">
        „Priskirti kopiją“ sukuria klientui savo, nepriklausomą programos kopiją. Vėliau pakeitus jo pratimą, šis
        šablonas ir kitų klientų kopijos nesikeičia.
      </p>
      ${klientai.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Klientas</th><th>Būsena</th><th></th></tr></thead>
            <tbody>${eilutes}</tbody>
          </table>
        </div>` : '<p class="muted">Klientų dar nėra.</p>'}
    </div>`;

  for (const b of $$('.keisk-priskyrima')) {
    b.addEventListener('click', () => keiskPriskyrima(b.dataset.client, b.dataset.veiksmas, b));
  }
}

async function keiskPriskyrima(clientId, veiksmas, mygtukas) {
  mygtukas.disabled = true;
  let klaida;

  if (veiksmas === 'priskirti') {
    const pradzia = $('#pr-pradzia')?.value || null;
    ({ error: klaida } = await db.rpc('assign_program', {
      p_program_id: programId,
      p_client_id: clientId,
      p_starts_on: pradzia,
    }));
  } else {
    const esamas = priskyrimai.find((a) => a.client_id === clientId && a.status !== 'finished');
    if (esamas) {
      ({ error: klaida } = await db.from('client_programs').update({ status: 'finished' }).eq('id', esamas.id));
    }
  }

  mygtukas.disabled = false;
  if (klaida) {
    pranesk($('#pranesimas'), klaidaLT(klaida), 'error');
    return;
  }
  pranesk($('#pranesimas'), veiksmas === 'priskirti' ? 'Kopija sukurta.' : 'Priskyrimas baigtas.', 'ok');
  await perkrauk();
}
